<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Anclajes en hormigón | fddlebel</title>
<style>
:root{
  --paper:#ffffff;--panel:#ffffff;--ink:#000000;--line:#9a9a9a;--line-strong:#7a7a7a;
  --accent:#000000;--accent-soft:#e9e9e9;--grid:#d9d9d9;--conc:#c0c0c0;--conc-dark:#a8a8a8;
  --fail:#b3261e;--focus:#4a4d24;
  --sans:'Arial Narrow',Arial,Helvetica,sans-serif;
}
*{box-sizing:border-box;}
[hidden]{display:none!important;}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);padding-block:20px 48px;padding-inline:max(16px,calc((100vw - 1400px)/2));}
h1{font-size:22px;font-weight:700;margin:0;}
.app-header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px;}
.clause{font-size:12px;}
.btn{font-family:var(--sans);font-weight:700;font-size:13px;color:#fff;background:var(--accent);border:1px solid var(--accent);border-radius:4px;padding:7px 14px;cursor:pointer;}
.btn.sec{background:var(--panel);color:var(--ink);border-color:var(--line-strong);}
.grid{display:grid;grid-template-columns:320px minmax(0,1fr);gap:16px;align-items:start;}
@media (max-width:900px){.grid{grid-template-columns:1fr;}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:14px;}
.panel+.panel{margin-top:12px;}
.section-title{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;margin:0 0 10px;}
.field{margin-bottom:9px;min-width:0;}
.field label{display:block;font-size:12px;margin-bottom:3px;}
.unit{opacity:.75;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
input[type=number],input[type=text],select,textarea{width:100%;font-family:var(--sans);font-size:13px;color:var(--ink);background:#fff;border:1px solid var(--line-strong);border-radius:4px;padding:6px 7px;font-variant-numeric:tabular-nums;}
textarea{font-size:12px;resize:vertical;}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--focus);outline-offset:1px;}
details summary{cursor:pointer;font-size:13px;font-weight:700;margin-top:4px;user-select:none;}
details[open] summary{margin-bottom:8px;}
.chk{display:flex;align-items:center;gap:6px;font-size:12px;}
.chk input{width:auto;margin:0;}
.toolbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px;}
.tool{font-family:var(--sans);font-size:12.5px;font-weight:700;background:var(--panel);color:var(--ink);border:1px solid var(--line-strong);border-radius:4px;padding:6px 10px;cursor:pointer;}
.tool.active{background:var(--accent);color:#fff;border-color:var(--accent);}
.toolbar select{width:auto;}
.toolbar .sep{width:1px;height:24px;background:var(--line);margin:0 4px;}
#gridWrap{position:relative;border:1px solid var(--line);border-radius:4px;overflow:auto;max-height:560px;background:#fff;}
#gridCanvas{display:block;cursor:crosshair;touch-action:none;}
#gridInfo{font-size:12px;margin-top:6px;min-height:16px;}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 10px;}
.tabs button{font-family:var(--sans);font-weight:700;font-size:13px;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:7px 14px;cursor:pointer;}
.tabs button.active{background:var(--accent);color:#fff;border-color:var(--accent);}
.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-bottom:12px;}
.stat{border:1px solid var(--line);border-radius:4px;padding:8px 10px;}
.stat .k{font-size:11px;text-transform:uppercase;letter-spacing:.04em;}
.stat .v{font-size:16px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums;}
table{width:100%;border-collapse:collapse;font-size:12.5px;}
th,td{text-align:left;padding:5px 8px;border:1px solid var(--line);font-variant-numeric:tabular-nums;}
th{font-size:11px;font-weight:700;background:var(--accent-soft);}
td.num,th.num{text-align:right;}
tr.fail td{color:var(--fail);font-weight:700;}
.tablewrap{overflow-x:auto;}
.chartwrap{border:1px solid var(--line);border-radius:4px;padding:10px;margin-bottom:12px;}
.ctrls{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin-bottom:10px;}
.ctrls .field{margin:0;width:150px;}
#glWrap{position:relative;border:1px solid var(--line);border-radius:4px;overflow:hidden;background:#fff;}
#glCanvas{display:block;width:100%;height:560px;cursor:grab;touch-action:none;}
#glLabels{position:absolute;inset:0;pointer-events:none;font-size:11px;}
#glLabels span{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;}
.note{font-size:11.5px;line-height:1.5;}
.warn{background:var(--accent-soft);border:1px solid var(--line-strong);border-radius:4px;padding:7px 10px;font-size:12px;margin-bottom:10px;}
#busy{font-size:12px;margin-left:8px;}
svg text{font-family:var(--sans);}
#printReport{display:none;}
.rpt-header{margin-bottom:12px;}
.rpt-header h1{font-size:20px;}
.rpt-sub{font-size:11.5px;margin-top:2px;}
.rpt-params{width:100%;border-collapse:collapse;margin-bottom:14px;font-size:11px;}
.rpt-params td{border:1px solid var(--line);padding:4px 7px;}
.rpt-params td.k{font-weight:700;width:22%;background:var(--accent-soft);}
.rpt-section{margin-bottom:16px;page-break-inside:avoid;break-inside:avoid;}
.rpt-section h2{font-size:14px;font-weight:700;margin:0 0 8px;border-bottom:1px solid var(--line);padding-bottom:4px;break-after:avoid;}
.rpt-section.allow-break{page-break-inside:auto;break-inside:auto;}
.rpt-foot{font-size:10px;margin-top:14px;border-top:1px solid var(--line);padding-top:6px;}
.rpt-small{font-size:10px;}
.rpt-small td,.rpt-small th{padding:2px 5px;}
@media print{
  body *{visibility:hidden;}
  #printReport,#printReport *{visibility:visible;}
  #printReport{display:block;position:absolute;left:0;top:0;width:100%;}
  @page{margin:12mm;}
}
</style>
</head>
<body>

<div class="app-header">
  <h1><a href="index.html" style="color:inherit;text-decoration:none;font-weight:400;">fddlebel</a> / Anclajes en hormigón</h1>
  <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
    <div class="clause">ACI 318-25, capítulo 17</div>
    <button class="btn sec" id="saveBtn">Guardar proyecto</button>
    <button class="btn sec" id="loadBtn">Abrir proyecto</button>
    <input type="file" id="loadFile" accept=".json" hidden>
    <button class="btn" id="pdfBtn">Exportar PDF</button>
  </div>
</div>

<div id="printReport"></div>

<div class="grid">
  <div>
    <div class="panel">
      <div class="field"><label>Proyecto / elemento</label><input type="text" id="proj" value=""></div>

      <div class="section-title" style="margin-top:12px">Anclaje</div>
      <div class="row2">
        <div class="field"><label>Instalación</label><select id="inst"><option value="cast" selected>Preinstalado</option><option value="adh">Postinstalado adhesivo</option></select></div>
        <div class="field"><label>Cabeza</label><select id="head"><option value="hex" selected>Tuerca hexagonal pesada</option><option value="plate">Placa de extracción</option><option value="J">Perno J</option></select></div>
      </div>
      <div class="row3">
        <div class="field"><label>da <span class="unit">[in]</span></label><select id="dain">
          <option>0.375</option><option>0.5</option><option>0.625</option><option selected>0.75</option><option>0.875</option><option>1</option><option>1.125</option><option>1.25</option><option>1.5</option><option>1.75</option><option>2</option></select></div>
        <div class="field"><label>fya <span class="unit">[MPa]</span></label><input type="number" id="fya" value="250" step="10"></div>
        <div class="field"><label>futa <span class="unit">[MPa]</span></label><input type="number" id="futa" value="400" step="10"></div>
      </div>
      <div class="row2">
        <div class="field"><label>hef <span class="unit">[mm]</span></label><input type="number" id="hef" value="500" step="10"></div>
        <div class="field"><label>ha espesor elemento <span class="unit">[mm]</span></label><input type="number" id="ha" value="1300" step="10"></div>
      </div>
      <label class="chk"><input type="checkbox" id="duct" checked> Acero dúctil</label>
      <label class="chk"><input type="checkbox" id="grout" checked> Mortero de nivelación bajo la placa</label>
      <div id="plateBox"><div class="row2">
        <div class="field"><label>Bp placa <span class="unit">[mm]</span></label><input type="number" id="Bp" value="100" step="5"></div>
        <div class="field"><label>Lp placa <span class="unit">[mm]</span></label><input type="number" id="Lp" value="100" step="5"></div>
      </div><div class="row2">
        <div class="field"><label>tp placa <span class="unit">[mm]</span></label><input type="number" id="tp" value="22" step="1"></div>
        <div class="field"><label>fy placa <span class="unit">[MPa]</span></label><input type="number" id="fyp" value="250" step="10"></div>
      </div></div>
      <div class="field" id="jBox"><label>eh gancho J <span class="unit">[mm]</span></label><input type="number" id="eh" value="100" step="5"></div>
      <div class="row3" id="adhBox">
        <div class="field"><label>τcr <span class="unit">[MPa]</span></label><input type="number" id="tcr" value="9.33" step="0.1"></div>
        <div class="field"><label>τuncr <span class="unit">[MPa]</span></label><input type="number" id="tunc" value="18.01" step="0.1"></div>
        <div class="field"><label>Categoría</label><select id="cat"><option value="1" selected>1</option><option value="2">2</option><option value="3">3</option></select></div>
      </div>
      <div class="row2" id="cacBox">
        <div class="field"><label>cac <span class="unit">[mm, 0 = 2hef]</span></label><input type="number" id="cac" value="0" step="10"></div>
        <div class="field"><label>Nua,s sostenida <span class="unit">[kN/anclaje]</span></label><input type="number" id="Nus" value="0" step="1"></div>
      </div>

      <div class="section-title" style="margin-top:12px">Grupo y bordes <span class="unit">[mm]</span></div>
      <div class="row2">
        <div class="field"><label>n en x / sx</label><div class="row2"><input type="number" id="nx" value="2" step="1" min="1"><input type="number" id="sx" value="200" step="10"></div></div>
        <div class="field"><label>n en y / sy</label><div class="row2"><input type="number" id="ny" value="2" step="1" min="1"><input type="number" id="sy" value="200" step="10"></div></div>
      </div>
      <div class="row2">
        <div class="field"><label>Borde −x / +x <span class="unit">[0 = sin borde]</span></label><div class="row2"><input type="number" id="cxm" value="225" step="5"><input type="number" id="cxp" value="225" step="5"></div></div>
        <div class="field"><label>Borde −y / +y <span class="unit">[0 = sin borde]</span></label><div class="row2"><input type="number" id="cym" value="225" step="5"><input type="number" id="cyp" value="225" step="5"></div></div>
      </div>

      <div class="row3">
        <div class="field"><label>Placa base x</label><input type="number" id="Bbp" value="500" step="10"></div>
        <div class="field"><label>Placa base y</label><input type="number" id="Lbp" value="500" step="10"></div>
        <div class="field"><label>t placa / mortero</label><div class="row2"><input type="number" id="tbp" value="32" step="2"><input type="number" id="gbp" value="50" step="5"></div></div>
      </div>

      <div class="section-title" style="margin-top:12px">Hormigón</div>
      <div class="row3">
        <div class="field"><label>f'c <span class="unit">[MPa]</span></label><input type="number" id="fc" value="25" step="1"></div>
        <div class="field"><label>λa</label><input type="number" id="lam" value="1" step="0.05"></div>
        <div class="field"><label>z para ψcm,N <span class="unit">[mm]</span></label><input type="number" id="zcm" value="0" step="10"></div>
      </div>
      <label class="chk"><input type="checkbox" id="crk" checked> Hormigón fisurado</label>
      <label class="chk"><input type="checkbox" id="seis"> Sísmico, CDS C a F, 0,75 en modos de hormigón en tracción</label>
      <div class="row2">
        <div class="field"><label>Condición tracción</label><select id="condT"><option value="A">A, con refuerzo suplementario</option><option value="B" selected>B, sin refuerzo suplementario</option></select></div>
        <div class="field"><label>Condición corte</label><select id="condV"><option value="A">A, con refuerzo suplementario</option><option value="B" selected>B, sin refuerzo suplementario</option></select></div>
      </div>
      <div class="field"><label>ψc,V</label><select id="psicV"><option value="1" selected>1,0 sin refuerzo de borde</option><option value="1.2">1,2 barra de borde ≥ Ø12</option><option value="1.4">1,4 barra de borde y estribos @ ≤ 100</option></select></div>

      <div class="section-title" style="margin-top:12px">Factores φ y ψa, Tablas 21.2.1 y 17.5.4.1</div>
      <div class="row3">
        <div class="field"><label>Redundante</label><select id="red"><option value="1" selected>Sí, φ = 0,75</option><option value="0">No, φ = 0,65</option></select></div>
        <div class="field"><label>ψa tracción <span class="unit">[0 = tabla]</span></label><input type="number" id="psaT" value="0" step="0.01"></div>
        <div class="field"><label>ψa corte <span class="unit">[0 = tabla]</span></label><input type="number" id="psaV" value="0" step="0.01"></div>
      </div>

      <div class="section-title" style="margin-top:12px">Solicitaciones</div>
      <div class="field"><label>Diseño</label><select id="dmode"><option value="res" selected>Resistencia, Nua y Vua</option><option value="cap">Capacidad, Nsa y Vsa del perno</option></select></div>
      <div class="row3">
        <div class="field"><label>Nua grupo <span class="unit">[kN]</span></label><input type="number" id="Nua" value="40" step="1"></div>
        <div class="field"><label>e'N,x <span class="unit">[mm]</span></label><input type="number" id="eNx" value="0" step="5"></div>
        <div class="field"><label>e'N,y <span class="unit">[mm]</span></label><input type="number" id="eNy" value="0" step="5"></div>
      </div>
      <div class="row3">
        <div class="field"><label>Vua grupo <span class="unit">[kN]</span></label><input type="number" id="Vua" value="20" step="1"></div>
        <div class="field"><label>Dirección</label><select id="vdir"><option value="px" selected>+x</option><option value="mx">−x</option><option value="py">+y</option><option value="my">−y</option></select></div>
        <div class="field"><label>e'V <span class="unit">[mm]</span></label><input type="number" id="eV" value="0" step="5"></div>
      </div>
      <div class="field"><label>Distribución del corte</label><select id="vcase"><option value="std" selected>Agujeros normales, casos 1, 2 o 3</option><option value="weld">Pernos soldados a la placa, caso 2</option></select></div>

      <div class="section-title" style="margin-top:12px">Armadura de anclaje</div>
      <label class="chk"><input type="checkbox" id="arT"> En tracción</label>
      <div id="arTBox">
        <div class="row3">
          <div class="field"><label>N° barras</label><input type="number" id="nbT" value="4" step="1"></div>
          <div class="field"><label>Ø <span class="unit">[mm]</span></label><input type="number" id="dbT" value="16" step="2"></div>
          <div class="field"><label>fy <span class="unit">[MPa]</span></label><input type="number" id="fyr" value="420" step="10"></div>
        </div>
        <div class="row2">
          <div class="field"><label>Tipo</label><select id="btype"><option value="hook" selected>Con gancho</option><option value="str">Recta</option></select></div>
          <div class="field"><label>Rec. superior <span class="unit">[mm]</span></label><input type="number" id="rtop" value="50" step="5"></div>
        </div>
        <div class="row2">
          <div class="field"><label>Lx perno a barra</label><input type="number" id="Lx" value="50" step="5"></div>
          <div class="field"><label>Ly perno a barra</label><input type="number" id="Ly" value="100" step="5"></div>
        </div>
      </div>
      <label class="chk"><input type="checkbox" id="arV"> En corte</label>
      <div class="row3" id="arVBox">
        <div class="field"><label>N° ramas</label><input type="number" id="nbV" value="4" step="1"></div>
        <div class="field"><label>Ø <span class="unit">[mm]</span></label><input type="number" id="dbV" value="10" step="2"></div>
        <div class="field"><label>fy <span class="unit">[MPa]</span></label><input type="number" id="fyv" value="420" step="10"></div>
      </div>

      <div class="section-title" style="margin-top:12px">Llave de corte</div>
      <label class="chk"><input type="checkbox" id="lug"> Incluir llave de corte</label>
      <div id="lugBox">
        <div class="field"><label>Diseño de la llave</label><select id="lmode"><option value="cap" selected>Capacidad de la placa</option><option value="res">Resistencia, Vua</option></select></div>
        <div class="row3">
          <div class="field"><label>bsl</label><input type="number" id="bsl" value="150" step="10"></div>
          <div class="field"><label>H total</label><input type="number" id="Hsl" value="200" step="10"></div>
          <div class="field"><label>t</label><input type="number" id="tsl" value="28" step="1"></div>
        </div>
        <div class="row2">
          <div class="field"><label>fy <span class="unit">[MPa]</span></label><input type="number" id="fysl" value="250" step="10"></div>
          <div class="field"><label>Pu <span class="unit">[kN, + comp.]</span></label><input type="number" id="Pu" value="1060" step="10"></div>
        </div>
                
        <div class="row3">
          <div class="field"><label>Estribos, ramas</label><input type="number" id="nbl" value="12" step="1"></div>
          <div class="field"><label>Ø <span class="unit">[mm]</span></label><input type="number" id="dbl" value="12" step="2"></div>
          <div class="field"><label>fy <span class="unit">[MPa]</span></label><input type="number" id="fyl" value="420" step="10"></div>
        </div>
      </div>
    </div>
    <div class="panel">
      <div class="section-title">Notas</div>
      <div class="note" id="notes"></div>
    </div>
  </div>

  <div style="min-width:0;">
    <div class="stat-row" id="stats"></div>
    <div id="warns"></div>
    <div class="chartwrap"><div class="toolbar" id="v3bar"></div><canvas id="v3" style="width:100%;height:440px;display:block"></canvas></div>
    <div class="chartwrap"><svg id="planSvg" viewBox="0 0 1300 660" width="100%" style="display:block;height:auto"></svg></div>
    <div class="chartwrap"><svg id="sideSvg" viewBox="0 0 1300 540" width="100%" style="display:block;height:auto"></svg></div>
    <div class="tabs" id="tabs">
      <button data-tab="rs" class="active">Resumen</button>
      <button data-tab="tn">Tracción</button>
      <button data-tab="sh">Corte</button>
      <button data-tab="lg">Llave de corte</button>
    </div>
    <div class="tabpane" data-pane="rs">
      <div class="panel"><div class="section-title">Modos de falla</div><div class="tablewrap"><table id="tbSum"></table></div></div>
      <div class="panel"><div class="section-title">Interacción tracción y corte, 17.8</div><div class="tablewrap"><table id="tbInt"></table></div></div>
    </div>
    <div class="tabpane" data-pane="tn" hidden><div class="panel"><div class="tablewrap"><table id="tbTen"></table></div></div></div>
    <div class="tabpane" data-pane="sh" hidden><div class="panel"><div class="tablewrap"><table id="tbShr"></table></div></div></div>
    <div class="tabpane" data-pane="lg" hidden><div class="panel"><div class="tablewrap"><table id="tbLug"></table></div></div></div>
  </div>
</div>
<script>
const svgNS='http://www.w3.org/2000/svg';
function el(tag,attrs){ const n=document.createElementNS(svgNS,tag); for(const k in attrs) n.setAttribute(k,attrs[k]); return n; }
function tx(x,y,s,o){ const t=el('text',Object.assign({x,y,'font-size':11,'text-anchor':'middle',fill:'#000'},o||{})); t.textContent=s; return t; }
function niceStep(range,count){ const raw=Math.max(range,1e-12)/count, m=Math.pow(10,Math.floor(Math.log10(raw))), f=raw/m; return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*m; }
function fmtTick(v,st){ const d=st>=1?0:Math.min(6,Math.ceil(-Math.log10(st))); return (Math.abs(v)<st*1e-6?0:v).toFixed(d); }
const fmt=(x,d)=>isFinite(x)?x.toFixed(d):'-';
const fmtk=x=>isFinite(x)?String(Math.round(x)):'-';
const FAIL='#b3261e';

function chart(svg,cfg){
  svg.innerHTML='';
  const W=760,H=cfg.H||420,L=70,R=18,T=16,B=46;
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
  const xs=[],ys=[];
  cfg.series.forEach(s=>s.pts.forEach(p=>{ if(isFinite(p[0])&&isFinite(p[1])){ xs.push(p[0]); ys.push(p[1]); } }));
  (cfg.points||[]).forEach(p=>{ xs.push(p.x); ys.push(p.y); });
  if(!xs.length){ svg.appendChild(tx(W/2,H/2,'Sin datos')); return; }
  let x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);

function analyze(p){

  const psiedN=camin>=1.5*hp?1:0.7+0.3*camin/(1.5*hp);
  const psicN=p.crk?1:(cast?1.25:1.4);
  const cac=p.cac>0?p.cac:2*p.hef;
  const psicpN=(!cast&&!p.crk&&p.condT==='B'&&camin<cac)?Math.max(camin/cac,1.5*hp/cac):1;
  const kc=cast?10:7;

  pt.innerHTML=`<tr><td class="k">Anclaje</td><td>${p.inst==='cast'?'Preinstalado, '+({hex:'tuerca hexagonal pesada',plate:'placa de extracción',J:'perno J'}[p.head]):'Adhesivo, categoría '+p.cat}, da = ${p.dain} in</td><td class="k">Acero</td><td>fya = ${p.fya} MPa, futa = ${p.futa} MPa, ${p.duct?'dúctil':'frágil'}</td></tr>
   <tr><td class="k">Grupo</td><td>${R.nx}×${R.ny}, sx = ${R.sx} mm, sy = ${R.sy} mm, hef = ${p.hef} mm</td><td class="k">Bordes</td><td>${[p.cxm,p.cxp,p.cym,p.cyp].map(v=>v>0?v:'∞').join(' / ')} mm</td></tr>
   <tr><td class="k">Hormigón</td><td>f'c = ${p.fc} MPa, ${p.crk?'fisurado':'no fisurado'}, ha = ${p.ha} mm</td><td class="k">Condición</td><td>Tracción ${p.condT}, corte ${p.condV}, ${p.red==='1'?'redundante':'no redundante'}${p.seis?', sísmico':''}</td></tr>
   <tr><td class="k">Solicitaciones</td><td>Nua = ${f1(R.Ng,2)} kN, Vua = ${f1(R.Vg,2)} kN</td><td class="k">Diseño</td><td>${p.dmode==='cap'?'Por capacidad del perno':'Por resistencia'}</td></tr>`;
  ct.appendChild(pt);
  const addSec=(t,n)=>{ const s=document.createElement('div'); s.className='rpt-section'; s.innerHTML=`<h2>${t}</h2>`; if(n) s.appendChild(n); ct.appendChild(s); return s; };
  const T={}; ['sum','int','ten','shr','lug'].forEach(k=>{ T[k]=document.createElement('table'); T[k].className='rpt-small'; });
  const sv={plan:el('svg',{width:'100%',style:'max-width:100%;height:auto;display:block;margin:0 auto;'}),side:el('svg',{width:'100%',style:'max-width:100%;height:auto;display:block;margin:0 auto;'})};
  renderAll(R,T,sv);
  if(V3) addSec('Vista 3D',snap3D(V3,760,440));
  addSec('Planta y corte A-A',sv.plan);
  addSec('Vista B-B y detalle 1',sv.side);
  addSec('Modos de falla',T.sum);
  addSec('Interacción',T.int);
  addSec('Tracción',T.ten);
  addSec('Corte',T.shr);
  if(p.lug) addSec('Llave de corte',T.lug);
  const ft=document.createElement('div'); ft.className='rpt-foot'; ft.innerHTML=notesHtml(R); ct.appendChild(ft);
}
