<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Estanques enterrados | fddlebel</title>
<style>
:root{
  --paper:#ffffff;--panel:#ffffff;--ink:#000000;--line:#9a9a9a;--line-strong:#7a7a7a;
  --accent:#000000;--accent-soft:#e9e9e9;--grid:#d9d9d9;--conc:#c0c0c0;--conc-dark:#a8a8a8;
  --fail:#b3261e;--focus:#4a4d24;
  --sans:'Arial Narrow',Arial,Helvetica,sans-serif;
}
*{box-sizing:border-box;}
[hidden]{display:none!important;}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);padding-block:20px 48px;padding-inline:max(16px,calc((100vw - 1400px)/2));}
h1{font-size:22px;font-weight:700;margin:0;}
.app-header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px;}
.clause{font-size:12px;}
.btn{font-family:var(--sans);font-weight:700;font-size:13px;color:#fff;background:var(--accent);border:1px solid var(--accent);border-radius:4px;padding:7px 14px;cursor:pointer;}
.btn.sec{background:var(--panel);color:var(--ink);border-color:var(--line-strong);}
.grid{display:grid;grid-template-columns:320px minmax(0,1fr);gap:16px;align-items:start;}
@media (max-width:900px){.grid{grid-template-columns:1fr;}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:14px;}
.panel+.panel{margin-top:12px;}
.section-title{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;margin:0 0 10px;}
.field{margin-bottom:9px;min-width:0;}
.field label{display:block;font-size:12px;margin-bottom:3px;}
.unit{opacity:.75;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
input[type=number],input[type=text],select,textarea{width:100%;font-family:var(--sans);font-size:13px;color:var(--ink);background:#fff;border:1px solid var(--line-strong);border-radius:4px;padding:6px 7px;font-variant-numeric:tabular-nums;}
textarea{font-size:12px;resize:vertical;}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--focus);outline-offset:1px;}
details summary{cursor:pointer;font-size:13px;font-weight:700;margin-top:4px;user-select:none;}
details[open] summary{margin-bottom:8px;}
.chk{display:flex;align-items:center;gap:6px;font-size:12px;}
.chk input{width:auto;margin:0;}
.toolbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px;}
.tool{font-family:var(--sans);font-size:12.5px;font-weight:700;background:var(--panel);color:var(--ink);border:1px solid var(--line-strong);border-radius:4px;padding:6px 10px;cursor:pointer;}
.tool.active{background:var(--accent);color:#fff;border-color:var(--accent);}
.toolbar select{width:auto;}
.toolbar .sep{width:1px;height:24px;background:var(--line);margin:0 4px;}
#gridWrap{position:relative;border:1px solid var(--line);border-radius:4px;overflow:auto;max-height:560px;background:#fff;}
#gridCanvas{display:block;cursor:crosshair;touch-action:none;}
#gridInfo{font-size:12px;margin-top:6px;min-height:16px;}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 10px;}
.tabs button{font-family:var(--sans);font-weight:700;font-size:13px;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:7px 14px;cursor:pointer;}
.tabs button.active{background:var(--accent);color:#fff;border-color:var(--accent);}
.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-bottom:12px;}
.stat{border:1px solid var(--line);border-radius:4px;padding:8px 10px;}
.stat .k{font-size:11px;text-transform:uppercase;letter-spacing:.04em;}
.stat .v{font-size:16px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums;}
table{width:100%;border-collapse:collapse;font-size:12.5px;}
th,td{text-align:left;padding:5px 8px;border:1px solid var(--line);font-variant-numeric:tabular-nums;}
th{font-size:11px;font-weight:700;background:var(--accent-soft);}
td.num,th.num{text-align:right;}
tr.fail td{color:var(--fail);font-weight:700;}
.tablewrap{overflow-x:auto;}
.chartwrap{border:1px solid var(--line);border-radius:4px;padding:10px;margin-bottom:12px;}
.ctrls{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin-bottom:10px;}
.ctrls .field{margin:0;width:150px;}
#glWrap{position:relative;border:1px solid var(--line);border-radius:4px;overflow:hidden;background:#fff;}
#glCanvas{display:block;width:100%;height:560px;cursor:grab;touch-action:none;}
#glLabels{position:absolute;inset:0;pointer-events:none;font-size:11px;}
#glLabels span{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;}
.note{font-size:11.5px;line-height:1.5;}
.warn{background:var(--accent-soft);border:1px solid var(--line-strong);border-radius:4px;padding:7px 10px;font-size:12px;margin-bottom:10px;}
#busy{font-size:12px;margin-left:8px;}
svg text{font-family:var(--sans);}
#printReport{display:none;}
.rpt-header{margin-bottom:12px;}
.rpt-header h1{font-size:20px;}
.rpt-sub{font-size:11.5px;margin-top:2px;}
.rpt-params{width:100%;border-collapse:collapse;margin-bottom:14px;font-size:11px;}
.rpt-params td{border:1px solid var(--line);padding:4px 7px;}
.rpt-params td.k{font-weight:700;width:22%;background:var(--accent-soft);}
.rpt-section{margin-bottom:16px;page-break-inside:avoid;break-inside:avoid;}
.rpt-section h2{font-size:14px;font-weight:700;margin:0 0 8px;border-bottom:1px solid var(--line);padding-bottom:4px;break-after:avoid;}
.rpt-section.allow-break{page-break-inside:auto;break-inside:auto;}
.rpt-grid{column-count:3;column-gap:12px;}
.rpt-grid table{width:100%;border-collapse:collapse;font-size:10px;break-inside:avoid;page-break-inside:avoid;margin:0 0 8px;}
.rpt-grid th,.rpt-grid td{border:1px solid var(--line);padding:2px 5px;}
.rpt-grid th{background:var(--accent-soft);text-align:left;}
.rpt-grid td.num{text-align:right;white-space:nowrap;}
.rpt-small thead{display:table-header-group;}
.rpt-small tr{break-inside:avoid;page-break-inside:avoid;}
.rpt-foot{font-size:10px;margin-top:14px;border-top:1px solid var(--line);padding-top:6px;}
.rpt-small{font-size:10px;}
.rpt-small td,.rpt-small th{padding:2px 5px;}
@media print{
  body>*:not(#printReport){display:none!important;}
  body{padding:0;}
  #printReport{display:block;position:static;width:100%;}
  @page{margin:12mm;}
}
</style>
</head>
<body>
<style>
.ltab{width:100%;border-collapse:collapse;font-size:12px;table-layout:fixed;}
.ltab td,.ltab th{padding:2px 3px;}
.ltab th:first-child{width:34%;}
.ltab input[type=number],.ltab select{padding:4px 3px;font-size:12px;width:100%;min-width:0;}
</style>
<div class="app-header">
  <h1><a href="index.html" style="color:inherit;text-decoration:none;font-weight:400;">fddlebel</a> / Estanques enterrados</h1>
  <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
    <div class="clause">ACI 350-06, ACI 350.3-06, MC Vol. 3 3.1003.501</div>
    <button class="btn sec" id="saveBtn">Guardar proyecto</button>
    <button class="btn sec" id="loadBtn">Abrir proyecto</button>
    <input type="file" id="loadFile" accept=".json" hidden>
    <button class="btn sec" id="dxfBtn">Exportar DXF</button>
    <button class="btn" id="pdfBtn">Exportar PDF</button>
  </div>
</div>
<div id="printReport"></div>
<div class="grid">
  <div>
    <div class="panel">
      <div class="field"><label>Proyecto / estanque</label><input type="text" id="proj" value=""></div>
      <div class="section-title" style="margin-top:12px">Geometría <span class="unit">[m]</span></div>
      <div class="row3">
        <div class="field"><label>Largo L</label><input type="number" id="L" value="8" step="0.1"></div>
        <div class="field"><label>Ancho B</label><input type="number" id="B" value="5" step="0.1"></div>
        <div class="field"><label>Altura Hw</label><input type="number" id="Hw" value="3" step="0.1"></div>
      </div>
      <div class="row3">
        <div class="field"><label>Agua HL</label><input type="number" id="HL" value="2.5" step="0.1"></div>
        <div class="field"><label>Muros tw</label><input type="number" id="tw" value="0.3" step="0.05"></div>
        <div class="field"><label>Fondo tb</label><input type="number" id="tb" value="0.3" step="0.05"></div>
      </div>
      <div class="row3">
        <div class="field"><label>Cubierta tr</label><input type="number" id="tr" value="0.2" step="0.05"></div>
        <div class="field"><label>Zarpa z</label><input type="number" id="zp" value="0.5" step="0.1"></div>
        <div class="field"><label>Relleno d</label><input type="number" id="d" value="0.6" step="0.1"></div>
      </div>
      <div class="row3">
        <div class="field"><label>NF dNF</label><input type="number" id="dNF" value="1" step="0.1"></div>
        <div class="field"><label>Juntas Lj</label><input type="number" id="Lj" value="8" step="1"></div>
        <div class="field"><label>Borde sup.</label><select id="top"><option value="ap" selected>Apoyado</option><option value="li">Libre</option></select></div>
      </div>
      <div class="section-title" style="margin-top:12px">Materiales</div>
      <div class="row3">
        <div class="field"><label>f'c <span class="unit">[MPa]</span></label><input type="number" id="fc" value="28" step="1"></div>
        <div class="field"><label>fy</label><input type="number" id="fy" value="420" step="10"></div>
        <div class="field"><label>Exposición</label><select id="exp"><option value="nor" selected>Normal</option><option value="sev">Severa</option></select></div>
      </div>
      <div class="row3">
        <div class="field"><label>γc <span class="unit">[kN/m³]</span></label><input type="number" id="gc" value="24" step="0.5"></div>
        <div class="field"><label>γw</label><input type="number" id="gw" value="9.81" step="0.01"></div>
        <div class="field"><label>Rec. muros <span class="unit">[mm]</span></label><input type="number" id="cw" value="50" step="5"></div>
      </div>
      <div class="row2">
        <div class="field"><label>Rec. fondo inferior</label><input type="number" id="cbb" value="75" step="5"></div>
        <div class="field"><label>Rec. fondo sup. y cubierta</label><input type="number" id="cbt" value="50" step="5"></div>
      </div>
      <div class="section-title" style="margin-top:12px">Suelo</div>
      <div class="row3">
        <div class="field"><label>γ <span class="unit">[kN/m³]</span></label><input type="number" id="g" value="18" step="0.5"></div>
        <div class="field"><label>γsat</label><input type="number" id="gs" value="20" step="0.5"></div>
        <div class="field"><label>φ' <span class="unit">[°]</span></label><input type="number" id="phi" value="28" step="1"></div>
      </div>
      <div class="row3">
        <div class="field"><label>qadm <span class="unit">[kPa]</span></label><input type="number" id="qadm" value="150" step="10"></div>
        <div class="field"><label>FS flotación</label><input type="number" id="FSmin" value="1.25" step="0.05"></div>
        <div class="field"><label>Suelo sobre zarpa</label><input type="number" id="fz" value="0.5" step="0.1"></div>
      </div>
      <div class="section-title" style="margin-top:12px">Cargas sobre la cubierta</div>
      <div class="row2">
        <div class="field"><label>Sobrecarga en superficie q <span class="unit">[kPa]</span></label><input type="number" id="q" value="10" step="1"></div>
        <div class="field"><label>Carga viva uniforme Lr <span class="unit">[kPa]</span></label><input type="number" id="Lr" value="5" step="1"></div>
      </div>
      <div class="row2">
        <div class="field"><label>Carga de rueda P <span class="unit">[kN]</span></label><input type="number" id="Pw" value="0" step="5"></div>
        <div class="field"><label>Impacto IM <span class="unit">[%]</span></label><input type="number" id="IM" value="33" step="1"></div>
      </div>
      <div class="section-title" style="margin-top:12px">Vigas de cubierta</div>
      <div class="row3">
        <div class="field"><label>Cantidad</label><input type="number" id="nvb" value="0" step="1" min="0"></div>
        <div class="field"><label>Ancho bw <span class="unit">[m]</span></label><input type="number" id="bwb" value="0.3" step="0.05"></div>
        <div class="field"><label>Altura h</label><input type="number" id="hb" value="0.6" step="0.05"></div>
      </div>
      <div class="row3">
        <div class="field"><label>Barras inf.</label><input type="number" id="nbb" value="4" step="1"></div>
        <div class="field"><label>Ø inf. <span class="unit">[mm]</span></label><select id="dbv"></select></div>
        <div class="field"><label>2 Ø sup.</label><select id="dbvt"></select></div>
      </div>
      <div class="row2">
        <div class="field"><label>Estribo Ø</label><select id="dbst"></select></div>
        <div class="field"><label>Estribo s <span class="unit">[mm]</span></label><input type="number" id="sst" value="200" step="25"></div>
      </div>
      <div class="section-title" style="margin-top:12px">Sismo, empuje de suelo</div>
      <div class="row2">
        <div class="field"><label>a0</label><select id="a0"><option value="0">0,3 g</option><option value="1" selected>0,4 g</option><option value="2">0,5 g</option></select></div>
        <div class="field"><label>Suelo natural</label><select id="sn"></select></div>
      </div>
      <div class="row3">
        <div class="field"><label>Relleno</label><select id="sr"></select></div>
        <div class="field"><label>LR <span class="unit">[m]</span></label><input type="number" id="LR" value="0" step="0.1"></div>
        <div class="field"><label>LN</label><input type="number" id="LN" value="0" step="0.1"></div>
      </div>
      <div class="section-title" style="margin-top:12px">Sismo, hidrodinámico</div>
      <div class="row3">
        <div class="field"><label>SDS <span class="unit">[g]</span></label><input type="number" id="SDS" value="0.81" step="0.01"></div>
        <div class="field"><label>SD1</label><input type="number" id="SD1" value="0.57" step="0.01"></div>
        <div class="field"><label>I</label><input type="number" id="I" value="1.25" step="0.05"></div>
      </div>
      <div class="row2">
        <div class="field"><label>Ri</label><input type="number" id="Ri" value="2" step="0.25"></div>
        <div class="field"><label>Rc</label><input type="number" id="Rc" value="1" step="0.25"></div>
      </div>
      <div class="section-title" style="margin-top:12px">Armaduras <span class="unit">[Ø mm, s mm]</span></div>
      <table class="ltab" id="barTab"></table>
    </div>
    <div class="panel">
      <div class="section-title">Notas</div>
      <div class="note" id="notes"></div>
    </div>
  </div>
  <div style="min-width:0;">
    <div class="stat-row" id="stats"></div>
    <div id="warns"></div>
    <div class="chartwrap"><div class="toolbar" id="v3bar"></div><canvas id="v3" style="width:100%;height:460px;display:block"></canvas></div>
    <div class="chartwrap"><svg id="dk1" viewBox="0 0 1300 660" width="100%" style="display:block;height:auto"></svg></div>
    <div class="chartwrap"><svg id="dk2" viewBox="0 0 1300 660" width="100%" style="display:block;height:auto"></svg></div>
    <div class="chartwrap"><svg id="dk3" viewBox="0 0 1300 660" width="100%" style="display:block;height:auto"></svg></div>
    <div class="chartwrap"><svg id="dk4" viewBox="0 0 1300 660" width="100%" style="display:block;height:auto"></svg></div>
    <div class="chartwrap"><svg id="prSvg" width="100%" style="display:block;height:auto"></svg></div>
    <div class="panel"><div class="section-title">Verificaciones</div><div class="tablewrap"><table id="tbChk"></table></div></div>
    <div class="panel"><div class="section-title">Desarrollo</div><div class="tablewrap"><table id="tbDet"></table></div></div>
    <div class="panel"><div class="section-title">Empuje sísmico por capas</div><div class="tablewrap"><table id="tbLay"></table></div></div>
  </div>
</div>
<script>
const svgNS='http://www.w3.org/2000/svg';
function el(tag,attrs){ const n=document.createElementNS(svgNS,tag); for(const k in attrs) n.setAttribute(k,attrs[k]); return n; }
function tx(x,y,s,o){ const t=el('text',Object.assign({x,y,'font-size':11,'text-anchor':'middle',fill:'#000'},o||{})); t.textContent=s; return t; }
function niceStep(range,count){ const raw=Math.max(range,1e-12)/count, m=Math.pow(10,Math.floor(Math.log10(raw))), f=raw/m; return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*m; }
function fmtTick(v,st){ const d=st>=1?0:Math.min(6,Math.ceil(-Math.log10(st))); return (Math.abs(v)<st*1e-6?0:v).toFixed(d); }
const fmt=(x,d)=>isFinite(x)?x.toFixed(d):'-';
const fmtk=x=>isFinite(x)?String(Math.round(x)):'-';
const FAIL='#b3261e';

function chart(svg,cfg){
  svg.innerHTML='';
  const W=760,H=cfg.H||420,L=70,R=18,T=16,B=46;
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
  const xs=[],ys=[];
  cfg.series.forEach(s=>s.pts.forEach(p=>{ if(isFinite(p[0])&&isFinite(p[1])){ xs.push(p[0]); ys.push(p[1]); } }));
  (cfg.points||[]).forEach(p=>{ xs.push(p.x); ys.push(p.y); });
  if(!xs.length){ svg.appendChild(tx(W/2,H/2,'Sin datos')); return; }
  let x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
  if(cfg.zeroX){ x0=Math.min(x0,0); x1=Math.max(x1,0); } if(cfg.zeroY){ y0=Math.min(y0,0); y1=Math.max(y1,0); }
  if(cfg.equal){ const c=(x0+x1)/2, d=(y0+y1)/2, h=Math.max(x1-x0,(y1-y0)*(W-L-R)/(H-T-B))/2; x0=c-h; x1=c+h; const hv=h*(H-T-B)/(W-L-R); y0=d-hv; y1=d+hv; }
  const px=(x1-x0)*0.06||1, py=(y1-y0)*0.08||1; x0-=px; x1+=px; y0-=py; y1+=py;
  const sx=niceStep(x1-x0,8), sy=niceStep(y1-y0,7);
  x0=Math.floor(x0/sx)*sx; x1=Math.ceil(x1/sx)*sx; y0=Math.floor(y0/sy)*sy; y1=Math.ceil(y1/sy)*sy;
  if(cfg.xfix){ x0=cfg.xfix[0]; x1=cfg.xfix[1]; }
  const X=x=>L+(x-x0)/(x1-x0)*(W-L-R), Y=y=>H-B-(y-y0)/(y1-y0)*(H-T-B);
  const g=el('g',{});
  for(let y=y0;y<=y1+sy*1e-6;y+=sy){ g.appendChild(el('line',{x1:L,x2:W-R,y1:Y(y),y2:Y(y),stroke:'#dcdcdc','stroke-width':0.6})); g.appendChild(tx(L-6,Y(y)+4,fmtTick(y,sy),{'text-anchor':'end'})); }
  for(let x=x0;x<=x1+sx*1e-6;x+=sx){ g.appendChild(el('line',{x1:X(x),x2:X(x),y1:T,y2:H-B,stroke:'#dcdcdc','stroke-width':0.6})); g.appendChild(tx(X(x),H-B+15,fmtTick(x,sx))); }
  svg.appendChild(g);
  if(x0<0&&x1>0) svg.appendChild(el('line',{x1:X(0),x2:X(0),y1:T,y2:H-B,stroke:'#555','stroke-width':0.9}));
  if(y0<0&&y1>0) svg.appendChild(el('line',{x1:L,x2:W-R,y1:Y(0),y2:Y(0),stroke:'#555','stroke-width':0.9}));
  svg.appendChild(el('rect',{x:L,y:T,width:W-L-R,height:H-T-B,fill:'none',stroke:'#7a7a7a','stroke-width':1}));
  svg.appendChild(tx((L+W-R)/2,H-8,cfg.xlabel,{'font-weight':700}));
  const yl=tx(14,(T+H-B)/2,cfg.ylabel,{'font-weight':700}); yl.setAttribute('transform',`rotate(-90 14 ${(T+H-B)/2})`); svg.appendChild(yl);
  const clipId='c'+Math.random().toString(36).slice(2);
  const cp=el('clipPath',{id:clipId}); cp.appendChild(el('rect',{x:L,y:T,width:W-L-R,height:H-T-B})); svg.appendChild(cp);
  const gc=el('g',{'clip-path':`url(#${clipId})`});
  cfg.series.forEach(s=>{
    const d=s.pts.filter(p=>isFinite(p[0])&&isFinite(p[1])).map((p,i)=>(i?'L':'M')+X(p[0]).toFixed(1)+','+Y(p[1]).toFixed(1)).join(' ')+(s.close?'Z':'');
    gc.appendChild(el('path',{d,fill:'none',stroke:s.color||'#000','stroke-width':s.w||1.4,'stroke-dasharray':s.dash||'none','stroke-linejoin':'round'}));
  });
  (cfg.points||[]).forEach(p=>{
    const col=p.fail?FAIL:'#000';
    if(p.ring) gc.appendChild(el('circle',{cx:X(p.x),cy:Y(p.y),r:3.5,fill:'#fff',stroke:col,'stroke-width':1.4}));
    else gc.appendChild(el('circle',{cx:X(p.x),cy:Y(p.y),r:3.2,fill:col}));
    if(p.label) gc.appendChild(tx(X(p.x)+6,Y(p.y)-6,p.label,{'text-anchor':'start','font-size':10.5,'font-weight':700,fill:col}));
  });
  svg.appendChild(gc);
  const named=cfg.series.filter(s=>s.name);

const SIDES=['b','r','t','l'];

/* posiciones absolutas desde la referencia "junto a" */
function placePanels(PP){
  const out=[], warn=[];
  PP.forEach((q,i)=>{
    let x0=0,y0=0; const r=q.ref;
    if(r==null||r<0||r>=i||!out[r]){ x0=+q.x0||0; y0=+q.y0||0; }
    else { const R=out[r], off=+q.off||0;
      if(q.side==='r'){ x0=R.x1; y0=R.y0+off; }
      else if(q.side==='l'){ x0=R.x0-q.Lx; y0=R.y0+off; }
      else if(q.side==='t'){ x0=R.x0+off; y0=R.y1; }
      else { x0=R.x0+off; y0=R.y0-q.Ly; } }
    out.push(Object.assign({},q,{i,x0,y0,x1:x0+q.Lx,y1:y0+q.Ly,cx:x0+q.Lx/2,cy:y0+q.Ly/2}));
  });
  for(let i=0;i<out.length;i++) for(let j=i+1;j<out.length;j++){ const a=out[i], b=out[j];
    const ox=Math.min(a.x1,b.x1)-Math.max(a.x0,b.x0), oy=Math.min(a.y1,b.y1)-Math.max(a.y0,b.y0);
    if(ox>1e-4&&oy>1e-4) warn.push(`Los paños ${a.name} y ${b.name} se superponen. Revise la posición o el desfase.`); }
  return {P:out,warn};
}
/* tramos de cada lado: compartidos (C) o exteriores con la condición del lado */
function sidePortions(P){
  const all=[];
  P.forEach(p=>{
    SIDES.forEach(s=>{
      const hz=s==='b'||s==='t', c=s==='b'?p.y0:s==='t'?p.y1:s==='l'?p.x0:p.x1, a0=hz?p.x0:p.y0, a1=hz?p.x1:p.y1, sh=[];
      P.forEach(q=>{ if(q===p) return; let touch=false;
        if(s==='r') touch=Math.abs(q.x0-p.x1)<TOL; else if(s==='l') touch=Math.abs(q.x1-p.x0)<TOL; else if(s==='t') touch=Math.abs(q.y0-p.y1)<TOL; else touch=Math.abs(q.y1-p.y0)<TOL;
        if(!touch) return; const b0=Math.max(a0,hz?q.x0:q.y0), b1=Math.min(a1,hz?q.x1:q.y1); if(b1-b0>1e-4) sh.push({a:b0,b:b1,q:q.i}); });
      sh.sort((u,v)=>u.a-v.a);
      let cur=a0; const ps=[];
      sh.forEach(z=>{ if(z.a>cur+1e-4) ps.push({a:cur,b:z.a,type:p.cond[s],q:-1}); ps.push({a:z.a,b:z.b,type:'C',q:z.q}); cur=Math.max(cur,z.b); });
      if(a1>cur+1e-4) ps.push({a:cur,b:a1,type:p.cond[s],q:-1});
      ps.forEach(z=>{ z.p=p.i; z.side=s; z.hz=hz; z.c=c; z.len=z.b-z.a; z.id=all.length; all.push(z); });
      p['ps_'+s]=ps;
    });
  });

}

/* ---------- malla ---------- */
function buildMesh(P,N){
  const tgt=p=>Math.max(Math.min(p.Lx,p.Ly)/N,Math.max(p.Lx,p.Ly)/(2*N));
  const axis=(lo,hi,cen)=>{ let v=[]; P.forEach(p=>{ v.push(p[lo],p[hi],p[cen]); }); v.sort((a,b)=>a-b); const u=[]; v.forEach(x=>{ if(!u.length||x-u[u.length-1]>1e-5) u.push(x); }); return u; };
  const mk=(lines,lo,hi)=>{ const g=[lines[0]];
    for(let k=0;k<lines.length-1;k++){ const a=lines[k], b=lines[k+1], m=(a+b)/2; let t=Infinity; P.forEach(p=>{ if(m>p[lo]&&m<p[hi]) t=Math.min(t,tgt(p)); });
      const n=isFinite(t)?Math.max(1,Math.ceil((b-a)/t-1e-9)):1; for(let i=1;i<=n;i++) g.push(a+(b-a)*i/n); }
    return g; };
  const X=mk(axis('x0','x1','cx'),'x0','x1'), Y=mk(axis('y0','y1','cy'),'y0','y1');
  const nx=X.length, ny=Y.length, gid=(i,j)=>j*nx+i;
  const E=[], used=new Int32Array(nx*ny).fill(-1);
  for(let j=0;j<ny-1;j++) for(let i=0;i<nx-1;i++){ const xc=(X[i]+X[i+1])/2, yc=(Y[j]+Y[j+1])/2;
    const p=P.find(p=>xc>p.x0&&xc<p.x1&&yc>p.y0&&yc<p.y1); if(!p) continue;
    const n=[gid(i,j),gid(i+1,j),gid(i+1,j+1),gid(i,j+1)]; n.forEach(g=>used[g]=1); E.push({i,j,p:p.i,g:n,a:X[i+1]-X[i],b:Y[j+1]-Y[j]}); }
  /* numeración con el índice rápido en la dirección de menos líneas */
  const fastX=nx<=ny, order=[]; if(fastX){ for(let j=0;j<ny;j++) for(let i=0;i<nx;i++) if(used[gid(i,j)]>0) order.push(gid(i,j)); } else { for(let i=0;i<nx;i++) for(let j=0;j<ny;j++) if(used[gid(i,j)]>0) order.push(gid(i,j)); }
  const nodeOf=new Int32Array(nx*ny).fill(-1); order.forEach((g,k)=>nodeOf[g]=k);
  const NX=new Float64Array(order.length), NY=new Float64Array(order.length), NI=new Int32Array(order.length), NJ=new Int32Array(order.length);
  order.forEach((g,k)=>{ const i=g%nx, j=(g-i)/nx; NX[k]=X[i]; NY[k]=Y[j]; NI[k]=i; NJ[k]=j; });
  E.forEach(e=>e.n=e.g.map(g=>nodeOf[g]));
  return {X,Y,nx,ny,E,nn:order.length,NX,NY,NI,NJ,nodeOf,gid};
}

/* ---------- elemento ACM ---------- */
const ACM_E=[[0,0],[1,0],[0,1],[2,0],[1,1],[0,2],[3,0],[2,1],[1,2],[0,3],[3,1],[1,3]];
const pw=(x,n)=>n<=0?1:n===1?x:n===2?x*x:x*x*x;
function polyRow(x,y,dx,dy){ return ACM_E.map(([i,j])=>{ if(i<dx||j<dy) return 0; let c=1; for(let k=0;k<dx;k++) c*=i-k; for(let k=0;k<dy;k++) c*=j-k; return c*pw(x,i-dx)*pw(y,j-dy); }); }
function invMat(A){ const n=A.length, M=A.map((r,i)=>[...r,...Array.from({length:n},(_,j)=>i===j?1:0)]);
  for(let c=0;c<n;c++){ let m=c; for(let r=c+1;r<n;r++) if(Math.abs(M[r][c])>Math.abs(M[m][c])) m=r; [M[c],M[m]]=[M[m],M[c]]; const d=M[c][c]; if(Math.abs(d)<1e-14) throw new Error('Matriz singular del elemento');
    for(let j=0;j<2*n;j++) M[c][j]/=d; for(let r=0;r<n;r++){ if(r===c) continue; const f=M[r][c]; if(f) for(let j=0;j<2*n;j++) M[r][j]-=f*M[c][j]; } }
  return M.map(r=>r.slice(n)); }
const mulRowMat=(r,M)=>{ const n=M[0].length, o=new Array(n).fill(0); for(let k=0;k<r.length;k++){ const v=r[k]; if(v) for(let j=0;j<n;j++) o[j]+=v*M[k][j]; } return o; };
const ACM_NODES=[[0,0],[1,0],[1,1],[0,1]];
const GP=[0.5-Math.sqrt(0.6)/2,0.5,0.5+Math.sqrt(0.6)/2], GW=[5/18,8/18,5/18];
const ACM_CACHE=new Map();
/* matrices para D = 1: K (12×12), f para q = 1, recuperación de momentos en las esquinas (curvaturas) */
function acm(a,b,nu){
  const key=a.toFixed(7)+'|'+b.toFixed(7)+'|'+nu; if(ACM_CACHE.has(key)) return ACM_CACHE.get(key);
  const C=[]; ACM_NODES.forEach(([x,y])=>{ C.push(polyRow(x,y,0,0)); C.push(polyRow(x,y,0,1).map(v=>v/b)); C.push(polyRow(x,y,1,0).map(v=>-v/a)); });
  const Ci=invMat(C);
  const Bat=(x,y)=>[mulRowMat(polyRow(x,y,2,0).map(v=>v/(a*a)),Ci),mulRowMat(polyRow(x,y,0,2).map(v=>v/(b*b)),Ci),mulRowMat(polyRow(x,y,1,1).map(v=>2*v/(a*b)),Ci)];
  const Dm=[[1,nu,0],[nu,1,0],[0,0,(1-nu)/2]];
  const K=Array.from({length:12},()=>new Array(12).fill(0)), f=new Array(12).fill(0);
  for(let gi=0;gi<3;gi++) for(let gj=0;gj<3;gj++){ const x=GP[gi], y=GP[gj], wt=GW[gi]*GW[gj]*a*b, B=Bat(x,y), N=mulRowMat(polyRow(x,y,0,0),Ci);
    const DB=[0,1,2].map(r=>new Array(12).fill(0).map((_,j)=>Dm[r][0]*B[0][j]+Dm[r][1]*B[1][j]+Dm[r][2]*B[2][j]));
    for(let i=0;i<12;i++){ f[i]+=wt*N[i]; for(let j=0;j<12;j++) K[i][j]+=wt*(B[0][i]*DB[0][j]+B[1][i]*DB[1][j]+B[2][i]*DB[2][j]); } }
  /* momentos en esquinas: m = −Dm·κ (por D) */
  const Mc=ACM_NODES.map(([x,y])=>{ const B=Bat(x,y); return [0,1,2].map(r=>new Array(12).fill(0).map((_,j)=>-(Dm[r][0]*B[0][j]+Dm[r][1]*B[1][j]+Dm[r][2]*B[2][j])*(r===2?0.5:1))); });
  /* fila 2: Mxy = −D(1−ν)w,xy, con κ3 = 2w,xy y Dm33 = (1−ν)/2 resulta −(1−ν)/2·2w,xy, se multiplica por 0,5·2 = 1 */
  Mc.forEach(m=>{ m[2]=m[2].map(v=>v*2); });
  const o={K,f,Mc,Ci}; ACM_CACHE.set(key,o); return o;
}

/* ---------- solver de banda (Cholesky) ---------- */
function bandChol(n,bw,A){ /* A: n*(bw+1), fila i, columna k en [i−bw, i] → A[i*(bw+1)+k−i+bw] */
  const W=bw+1;
  for(let i=0;i<n;i++){ const i0=Math.max(0,i-bw);
    for(let j=i0;j<=i;j++){ const j0=Math.max(i0,j-bw); let s=A[i*W+j-i+bw];
      const ri=i*W-i+bw, rj=j*W-j+bw; for(let k=j0;k<j;k++) s-=A[ri+k]*A[rj+k];
      if(j===i){ if(!(s>1e-9*A[i*W+bw])) return {ok:false,row:i}; A[i*W+bw]=Math.sqrt(s); }
      else A[i*W+j-i+bw]=s/A[j*W+bw]; } }
  return {ok:true}; }
function bandSolve(n,bw,L,b){ const W=bw+1, x=Float64Array.from(b);
  for(let i=0;i<n;i++){ let s=x[i]; const i0=Math.max(0,i-bw), ri=i*W-i+bw; for(let k=i0;k<i;k++) s-=L[ri+k]*x[k]; x[i]=s/L[i*W+bw]; }
  for(let i=n-1;i>=0;i--){ x[i]/=L[i*W+bw]; const v=x[i], i0=Math.max(0,i-bw), ri=i*W-i+bw; for(let k=i0;k<i;k++) x[k]-=L[ri+k]*v; }
  return x; }

/* ---------- análisis completo ---------- */
/* model: {P (placePanels), ps (portions), Ec kPa, nu, N, cases:[{q:[kPa por paño]}]} */
function solvePlate(model){
  const {P,ps,Ec,nu,N}=model, M=buildMesh(P,N), nn=M.nn;
  /* condiciones de borde */
  const fix=new Uint8Array(nn*3);
  ps.forEach(z=>{ if(z.type==='L') return;
    for(let k=0;k<nn;k++){ const on=z.hz?Math.abs(M.NY[k]-z.c)<1e-6&&M.NX[k]>=z.a-1e-6&&M.NX[k]<=z.b+1e-6:Math.abs(M.NX[k]-z.c)<1e-6&&M.NY[k]>=z.a-1e-6&&M.NY[k]<=z.b+1e-6;
      if(!on) continue; fix[3*k]=1; if(z.type==='E'){ if(z.hz) fix[3*k+1]=1; else fix[3*k+2]=1; } } });
  const eq=new Int32Array(nn*3); let n=0; for(let d=0;d<nn*3;d++) eq[d]=fix[d]?-1:n++;
  if(!n) throw new Error('No hay grados de libertad libres');

  const W=bw+1, A=new Float64Array(n*W);
  const Dof=p=>Ec*Math.pow(p.h/1000,3)/(12*(1-nu*nu));
  M.E.forEach(e=>{ const el=acm(e.a,e.b,nu), D=Dof(P[e.p]); e.D=D; e.el=el; const dofs=[]; e.n.forEach(k=>{ for(let c=0;c<3;c++) dofs.push(3*k+c); }); e.dofs=dofs;
    for(let i=0;i<12;i++){ const I=eq[dofs[i]]; if(I<0) continue; for(let j=0;j<12;j++){ const J=eq[dofs[j]]; if(J<0||J>I) continue; A[I*W+J-I+bw]+=D*el.K[i][j]; } } });
  const ch=bandChol(n,bw,A);
  if(!ch.ok){ let k=-1; for(let d=0;d<nn*3;d++) if(eq[d]===ch.row){ k=Math.floor(d/3); break; } const p=k>=0?P.find(p=>M.NX[k]>=p.x0-1e-6&&M.NX[k]<=p.x1+1e-6&&M.NY[k]>=p.y0-1e-6&&M.NY[k]<=p.y1+1e-6):null;
    throw new Error(`La planta es inestable${p?' cerca del paño '+p.name:''}: falta apoyo (revise bordes libres y apoyos).`); }

  const res=model.cases.map(cs=>{
    const F=new Float64Array(n), fe=M.E.map(e=>{ const q=cs.q[e.p]||0; return e.el.f.map(v=>v*q); });
    M.E.forEach((e,ie)=>{ const f=fe[ie]; for(let i=0;i<12;i++){ const I=eq[e.dofs[i]]; if(I>=0) F[I]+=f[i]; } });
    const x=bandSolve(n,bw,A,F), u=new Float64Array(nn*3); for(let d=0;d<nn*3;d++) if(eq[d]>=0) u[d]=x[eq[d]];

    const mx=new Float64Array(nn), my=new Float64Array(nn), mxy=new Float64Array(nn), cnt=new Float64Array(nn), R=new Float64Array(nn*P.length);
    M.E.forEach((e,ie)=>{ const ue=e.dofs.map(d=>u[d]);
      for(let c=0;c<4;c++){ const Mc=e.el.Mc[c], k=e.n[c]; let a=0,b=0,t=0; for(let j=0;j<12;j++){ a+=Mc[0][j]*ue[j]; b+=Mc[1][j]*ue[j]; t+=Mc[2][j]*ue[j]; } mx[k]+=a*e.D; my[k]+=b*e.D; mxy[k]+=t*e.D; cnt[k]++; }
      const f=fe[ie]; for(let c=0;c<4;c++){ const d=e.dofs[3*c]; if(!fix[d]) continue; let r=0; for(let j=0;j<12;j++) r+=e.D*e.el.K[3*c][j]*ue[j]; R[e.n[c]*P.length+e.p]+=f[3*c]-r; } });
    for(let k=0;k<nn;k++){ mx[k]/=cnt[k]; my[k]/=cnt[k]; mxy[k]/=cnt[k]; }
    const w=new Float64Array(nn); for(let k=0;k<nn;k++) w[k]=u[3*k];
    return {w,mx,my,mxy,R};

/* nodos de la malla sobre un tramo de borde, ordenados */
function nodesOn(M,z,inner){ const out=[]; for(let k=0;k<M.nn;k++){ const on=z.hz?Math.abs(M.NY[k]-z.c)<1e-6&&M.NX[k]>=z.a-1e-6&&M.NX[k]<=z.b+1e-6:Math.abs(M.NX[k]-z.c)<1e-6&&M.NY[k]>=z.a-1e-6&&M.NY[k]<=z.b+1e-6; if(on) out.push(k); }
  return out.sort((a,b)=>z.hz?M.NX[a]-M.NX[b]:M.NY[a]-M.NY[b]); }

    else if(e.t==='S'){ P(0,'SOLID'); P(8,e.L); const q=[e.p[0],e.p[1],e.p[2],e.p[2]]; q.forEach(([a,b],i)=>{ P(10+i,a); P(20+i,b); P(30+i,0); }); }
    else { P(0,'TEXT'); P(8,e.L); P(10,e.p[0]); P(20,e.p[1]); P(30,0); P(40,e.h); P(1,enc(e.s)); if(e.r) P(50,e.r); if(e.j){ L.push(72,e.j); P(11,e.p[0]); P(21,e.p[1]); P(31,0); } } });

}
function exportDXF(){ if(!R) return; const ids=['dk1','dk2','dk3','dk4']; ids.forEach(id=>{}); const b=dxfBuild(ids.map(id=>$(id)));

function scene(o){
  const ms=[],lb=[], L=o.L,B=o.B,tw=o.tw,zp=o.zp,tb=o.tb,tr=o.tr,Hw=o.Hw,bm=o.bm, zT=tb+Hw;
  ms.push(M3.key(M3.box(-L/2-tw-zp,-B/2-tw-zp,0,L/2+tw+zp,B/2+tw+zp,tb,COL.conc),'tb zp'));
  [[-L/2-tw,B/2,L/2+tw,B/2+tw],[-L/2-tw,-B/2-tw,L/2+tw,-B/2],[L/2,-B/2,L/2+tw,B/2],[-L/2-tw,-B/2,-L/2,B/2]].forEach(([x0,y0,x1,y1])=>ms.push(M3.key(M3.box(x0,y0,tb,x1,y1,zT,COL.conc),'tw Hw')));
  for(let i=1;i<=bm.nv;i++){ const u=-(L+tw)/2+i*bm.st; ms.push(M3.key(M3.box(u-bm.bw/2,-B/2,zT-(bm.h-tr),u+bm.bw/2,B/2,zT,COL.grout),'nvb bwb hb')); }
  ms.push(M3.key(M3.box(-L/2-tw,-B/2-tw,zT,L/2+tw,B/2+tw,zT+tr,COL.conc,0.35),'tr'));
  ms.push(M3.key(M3.box(-L/2,-B/2,tb,L/2,B/2,tb+o.HL,COL.liquid,0.5),'HL'));
  if(o.d>0) ms.push(M3.key(M3.box(-L/2-tw-zp,-B/2-tw-zp,zT+tr,L/2+tw+zp,B/2+tw+zp,zT+tr+o.d,COL.soil,0.18),'d'));
  const zs=zT+tr+o.d, ql=o.qload, sz=Math.max(L,B);
  if(ql.q>0||ql.Lr>0){ for(let i=0;i<5;i++) for(let j=0;j<3;j++){ const x=-L/2+L*(i+0.5)/5, y=-B/2+B*(j+0.5)/3; ms.push(...M3.key(M3.arrow([x,y,zs],[0,0,-1],sz*0.09,COL.load,sz*0.004),'q Lr')); }
    lb.push({p:[-L/2,-B/2,zs+sz*0.09],t:`q ${f1(ql.q,1)} kPa, Lr ${f1(ql.Lr,1)} kPa`,k:'q Lr'}); }
  if(ql.P>0){ ms.push(M3.key(M3.box(-0.125,-0.255,zs,0.125,0.255,zs+0.03,COL.red),'Pw')); ms.push(...M3.key(M3.arrow([0,0,zs+0.03],[0,0,-1],sz*0.18,COL.red,sz*0.007),'Pw IM'));
    if(o.d>0) ms.push(M3.key(M3.box(-ql.ea/2,-ql.eb/2,zT+tr,ql.ea/2,ql.eb/2,zT+tr+0.01,COL.red,0.4),'Pw d'));
    lb.push({p:[0,0,zs+sz*0.18],t:`P(1 + IM) ${f1(ql.P*(1+ql.IM),1)} kN`,k:'Pw IM'}); }
  lb.push({p:[L/2+tw,B/2+tw,zT+tr],t:`Cubierta ${mm(tr)}`,k:'tr'},{p:[-L/2-tw,-B/2-tw-zp,tb/2],t:`Losa ${mm(tb)}, zarpa ${mm(zp)}`,k:'tb zp'},{p:[L/2+tw,-B/2-tw,tb+Hw*0.7],t:`Muro ${mm(tw)}`,k:'tw'},{p:[0,0,tb+o.HL],t:`HL ${f1(o.HL,2)} m`,k:'HL'});
  if(bm.nv) lb.push({p:[-(L+tw)/2+bm.st,0,zT-(bm.h-tr)],t:`${bm.nv} vigas ${mm(bm.bw)}×${mm(bm.h)}`,k:'nvb'});
  return {ms,lb};
}
function drawPr(svg,o){
  const zb=o.d+o.tr+o.Hw, z0=zb-o.HL, es=[],ep=[],hy=[],hd=[], h=o.hyd[o.hyd[0].pd>=o.hyd[1].pd?0:1];

  o.lay.forEach(l=>ep.push([l.se+l.ss,-l.Z]));
  for(let k=0;k<=20;k++){ const y=o.HL*(1-k/20), z=zb-y; hy.push([o.gw*(o.HL-y),-z]); hd.push([o.gw*(o.HL-y)+h.pdy(y),-z]); }

}
