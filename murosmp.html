<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Muros de corte | fddlebel</title>
<style>
:root{
  --paper:#ffffff;--panel:#ffffff;--ink:#000000;--line:#9a9a9a;--line-strong:#7a7a7a;
  --accent:#000000;--accent-soft:#e9e9e9;--grid:#d9d9d9;--conc:#c0c0c0;--conc-dark:#a8a8a8;
  --fail:#b3261e;--focus:#4a4d24;
  --sans:'Arial Narrow',Arial,Helvetica,sans-serif;
}
*{box-sizing:border-box;}
[hidden]{display:none!important;}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);padding-block:20px 48px;padding-inline:max(16px,calc((100vw - 1400px)/2));}
h1{font-size:22px;font-weight:700;margin:0;}
.app-header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px;}
.clause{font-size:12px;}
.btn{font-family:var(--sans);font-weight:700;font-size:13px;color:#fff;background:var(--accent);border:1px solid var(--accent);border-radius:4px;padding:7px 14px;cursor:pointer;}
.btn.sec{background:var(--panel);color:var(--ink);border-color:var(--line-strong);}
.grid{display:grid;grid-template-columns:320px minmax(0,1fr);gap:16px;align-items:start;}
@media (max-width:900px){.grid{grid-template-columns:1fr;}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:14px;}
.panel+.panel{margin-top:12px;}
.section-title{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;margin:0 0 10px;}
.field{margin-bottom:9px;min-width:0;}
.field label{display:block;font-size:12px;margin-bottom:3px;}
.unit{opacity:.75;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
input[type=number],input[type=text],select,textarea{width:100%;font-family:var(--sans);font-size:13px;color:var(--ink);background:#fff;border:1px solid var(--line-strong);border-radius:4px;padding:6px 7px;font-variant-numeric:tabular-nums;}
textarea{font-size:12px;resize:vertical;}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--focus);outline-offset:1px;}
details summary{cursor:pointer;font-size:13px;font-weight:700;margin-top:4px;user-select:none;}
details[open] summary{margin-bottom:8px;}
.chk{display:flex;align-items:center;gap:6px;font-size:12px;}
.chk input{width:auto;margin:0;}
.toolbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px;}
.tool{font-family:var(--sans);font-size:12.5px;font-weight:700;background:var(--panel);color:var(--ink);border:1px solid var(--line-strong);border-radius:4px;padding:6px 10px;cursor:pointer;}
.tool.active{background:var(--accent);color:#fff;border-color:var(--accent);}
.toolbar select{width:auto;}
.toolbar .sep{width:1px;height:24px;background:var(--line);margin:0 4px;}
#gridWrap{position:relative;border:1px solid var(--line);border-radius:4px;overflow:auto;max-height:560px;background:#fff;}
#gridCanvas{display:block;cursor:crosshair;touch-action:none;}
#gridInfo{font-size:12px;margin-top:6px;min-height:16px;}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 10px;}
.tabs button{font-family:var(--sans);font-weight:700;font-size:13px;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:7px 14px;cursor:pointer;}
.tabs button.active{background:var(--accent);color:#fff;border-color:var(--accent);}
.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-bottom:12px;}
.stat{border:1px solid var(--line);border-radius:4px;padding:8px 10px;}
.stat .k{font-size:11px;text-transform:uppercase;letter-spacing:.04em;}
.stat .v{font-size:16px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums;}
table{width:100%;border-collapse:collapse;font-size:12.5px;}
th,td{text-align:left;padding:5px 8px;border:1px solid var(--line);font-variant-numeric:tabular-nums;}
th{font-size:11px;font-weight:700;background:var(--accent-soft);}
td.num,th.num{text-align:right;}
tr.fail td{color:var(--fail);font-weight:700;}
.tablewrap{overflow-x:auto;}
.chartwrap{border:1px solid var(--line);border-radius:4px;padding:10px;margin-bottom:12px;}
.ctrls{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin-bottom:10px;}
.ctrls .field{margin:0;width:150px;}
#glWrap{position:relative;border:1px solid var(--line);border-radius:4px;overflow:hidden;background:#fff;}
#glCanvas{display:block;width:100%;height:560px;cursor:grab;touch-action:none;}
#glLabels{position:absolute;inset:0;pointer-events:none;font-size:11px;}
#glLabels span{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;}
.note{font-size:11.5px;line-height:1.5;}
.warn{background:var(--accent-soft);border:1px solid var(--line-strong);border-radius:4px;padding:7px 10px;font-size:12px;margin-bottom:10px;}
#busy{font-size:12px;margin-left:8px;}
svg text{font-family:var(--sans);}
#printReport{display:none;}
.rpt-header{margin-bottom:12px;}
.rpt-header h1{font-size:20px;}
.rpt-sub{font-size:11.5px;margin-top:2px;}
.rpt-params{width:100%;border-collapse:collapse;margin-bottom:14px;font-size:11px;}
.rpt-params td{border:1px solid var(--line);padding:4px 7px;}
.rpt-params td.k{font-weight:700;width:22%;background:var(--accent-soft);}
.rpt-section{margin-bottom:16px;page-break-inside:avoid;break-inside:avoid;}
.rpt-section h2{font-size:14px;font-weight:700;margin:0 0 8px;border-bottom:1px solid var(--line);padding-bottom:4px;break-after:avoid;}
.rpt-section.allow-break{page-break-inside:auto;break-inside:auto;}
.rpt-foot{font-size:10px;margin-top:14px;border-top:1px solid var(--line);padding-top:6px;}
.rpt-small{font-size:10px;}
.rpt-small td,.rpt-small th{padding:2px 5px;}
@media print{
  body *{visibility:hidden;}
  #printReport,#printReport *{visibility:visible;}
  #printReport{display:block;position:absolute;left:0;top:0;width:100%;}
  @page{margin:12mm;}
}
@media print{.grid,.app-header{display:none!important;}}
input[type=range]{width:100%;margin:0;accent-color:#000;}
input:disabled,select:disabled{background:#f2f2f2;color:#777;}
</style>
</head>
<body>
<div class="app-header">
  <h1><a href="index.html" style="color:inherit;text-decoration:none;font-weight:400;">fddlebel</a> / Muros de corte</h1>
  <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
    <div class="clause" id="clause">NCh1198:2024 cláusula 12, SDPWS 2015</div>
    <button class="btn sec" id="saveBtn">Guardar proyecto</button>
    <button class="btn sec" id="loadBtn">Abrir proyecto</button>
    <input type="file" id="loadFile" accept=".json" hidden>
    <button class="btn" id="pdfBtn">Exportar PDF</button>
  </div>
</div>

<div id="printReport"></div>

<div class="grid">
  <div>
    <div class="panel">
      <div class="field"><label>Proyecto / muro</label><input type="text" id="proj" value=""></div>
      <div class="row2">
        <div class="field"><label>Edificación</label><select id="nP"><option value="b12">1 a 2 pisos</option><option value="b36" selected>3 a 6 pisos</option></select></div>
        <div class="field"><label>Acción lateral</label><select id="acc"><option value="s" selected>Sismo</option><option value="w">Viento</option></select></div>
      </div>

      <div class="section-title" style="margin-top:12px">Geometría</div>
      <div class="row3">
        <div class="field"><label>Largo b <span class="unit">[m]</span></label><input type="number" id="b" value="3.6" step="0.1" min="0.3"></div>
        <div class="field"><label>Alto h <span class="unit">[m]</span></label><input type="number" id="h" value="2.44" step="0.05" min="1"></div>
        <div class="field"><label>Alto piso <span class="unit">[m]</span></label><input type="number" id="hpi" value="2.70" step="0.05"></div>
      </div>
      <div class="field"><label>Vano</label><select id="vano"><option value="0" selected>Sin vano, un segmento</option><option value="1">Con vano, dos segmentos</option></select></div>
      <div class="vx">
        <div class="row2">
          <div class="field"><label>Segmento 1, b1 <span class="unit">[m]</span></label><input type="number" id="b1" value="1.8" step="0.1"></div>
          <div class="field"><label>Ancho vano <span class="unit">[m]</span></label><input type="number" id="wo" value="1.2" step="0.1"></div>
        </div>
        <div class="row3">
          <div class="field"><label>Alto vano <span class="unit">[m]</span></label><input type="number" id="ho" value="1.2" step="0.05"></div>
          <div class="field"><label>Antepecho <span class="unit">[m]</span></label><input type="number" id="hs" value="0.9" step="0.05"></div>
          <div class="field"><label>Distribución V</label><select id="dist"><option value="L" selected>Por largo</option><option value="K">Por rigidez</option></select></div>
        </div>
      </div>

      <div class="section-title" style="margin-top:12px">Tablero y clavado</div>
      <div class="field"><label>Tablero y clavo</label><select id="tab"></select></div>
      <div class="row3">
        <div class="field"><label>Material</label><select id="mat"><option value="O" selected>OSB</option><option value="P">Contrachapado</option></select></div>
        <div class="field"><label>Caras</label><select id="nf"><option value="1" selected>Una</option><option value="2">Dos</option></select></div>
        <div class="field"><label>t tablero <span class="unit">[mm]</span></label><input type="number" id="tsh" value="11.1" step="0.1" readonly></div>
      </div>
      <div class="row3">
        <div class="field"><label>Borde Sct <span class="unit">[mm]</span></label><select id="sct"><option>150</option><option selected>100</option><option>75</option><option>50</option></select></div>
        <div class="field"><label>Interior <span class="unit">[mm]</span></label><input type="number" id="scf" value="300" step="50"></div>
        <div class="field"><label>Clavo D <span class="unit">[mm]</span></label><input type="number" id="Dn" value="3.3" step="0.1"></div>
      </div>
      <div class="row3">
        <div class="field"><label>Clavo largo <span class="unit">[mm]</span></label><input type="number" id="Ln" value="64" step="1"></div>
        <div class="field ux"><label>Vc <span class="unit">[N/mm]</span></label><input type="number" id="Vcu" value="5.0" step="0.1"></div>
        <div class="field ux"><label>Ga <span class="unit">[N/mm]</span></label><input type="number" id="Gau" value="3500" step="50"></div>
      </div>
      <div class="row2">
        <div class="field"><label>Tablero ancho <span class="unit">[mm]</span></label><input type="number" id="wp" value="1220" step="10"></div>
        <div class="field"><label>Tablero alto <span class="unit">[mm]</span></label><input type="number" id="hpn" value="2440" step="10"></div>
      </div>
      <label class="chk"><input type="checkbox" id="kgh">Marco con H &gt; 19 % en fabricación, KGH = 0,50</label>

      <div class="section-title" style="margin-top:12px">Entramado</div>
      <div class="row2">
        <div class="field"><label>Especie</label><select id="sp"></select></div>
        <div class="field"><label>Grado</label><select id="gr"></select></div>
      </div>
      <div class="field"><label>Escuadrías</label><select id="dset"></select></div>
      <div class="row3">
        <div class="field"><label>Espesor e <span class="unit">[mm]</span></label><select id="tw"></select></div>
        <div class="field"><label>Ancho a <span class="unit">[mm]</span></label><select id="dd"></select></div>
        <div class="field"><label>H servicio <span class="unit">[%]</span></label><input type="number" id="Hs" value="12" step="1"></div>
      </div>
      <div class="row3">
        <div class="field"><label>Espaciamiento <span class="unit">[mm]</span></label><input type="number" id="s" value="406" step="1"></div>
        <div class="field"><label>Piezas cuerda</label><input type="number" id="nc" value="3" step="1" min="1" max="8"></div>
        <div class="field"><label>Kp pandeo</label><input type="number" id="Kp" value="1.0" step="0.05"></div>
      </div>
      <div class="row3">
        <div class="field"><label>Soleras sup.</label><select id="ntp"><option value="1">1</option><option value="2" selected>2</option></select></div>
        <div class="field"><label>Fcn <span class="unit">[MPa]</span></label><input type="number" id="Fcn" value="2.5" step="0.1"></div>
        <div class="field"><label>Solera tras cuerda <span class="unit">[mm]</span></label><input type="number" id="sext" value="0" step="10"></div>
      </div>

      <div class="section-title" style="margin-top:12px">Anclaje antilevantamiento</div>
      <div class="row2">
        <div class="field"><label>Tipo</label><select id="anc"><option value="hd" selected>Hold down</option><option value="ats">Tie down system</option></select></div>
        <div class="field"><label>T adm <span class="unit">[kN]</span></label><input type="number" id="Tadm" value="30" step="1"></div>
      </div>
      <div class="row3 hdx">
        <div class="field"><label>Δ adm <span class="unit">[mm]</span></label><input type="number" id="dadm" value="3.5" step="0.1"></div>
        <div class="field"><label>Eje a cuerda <span class="unit">[mm]</span></label><input type="number" id="cl" value="32" step="1"></div>
        <div class="field"><label>Perno Ø <span class="unit">[mm]</span></label><input type="number" id="db" value="22" step="1"></div>
      </div>
      <div class="row2 hdx">
        <div class="field"><label>Kct</label><select id="kct"><option value="0.7" selected>Pernos, 0,70</option><option value="0.8">Clavos o tornillos, 0,80</option><option value="1">Sin perforación, 1,00</option></select></div>
      </div>
      <div class="row3 atx">
        <div class="field"><label>Barra</label><select id="rod"></select></div>
        <div class="field"><label>Placa a <span class="unit">[mm]</span></label><input type="number" id="pla" value="125" step="5"></div>
        <div class="field"><label>Placa b <span class="unit">[mm]</span></label><input type="number" id="plb" value="125" step="5"></div>
      </div>
      <div class="row2">
        <div class="field"><label>Δ adicional <span class="unit">[mm]</span></label><input type="number" id="d0" value="0" step="0.1"></div>
      </div>
      <label class="chk"><input type="checkbox" id="crush">Incluir aplastamiento de solera en Δa</label>

      <div class="section-title" style="margin-top:12px">Anclaje antideslizamiento</div>
      <div class="row2">
        <div class="field"><label>P adm unitario, KD 1 <span class="unit">[kN]</span></label><input type="number" id="Pa" value="2.6" step="0.1"></div>
        <div class="field"><label>Espaciamiento <span class="unit">[mm]</span></label><input type="number" id="sa" value="150" step="10"></div>
      </div>

      <div class="section-title" style="margin-top:12px">Cargas</div>
      <div class="row2">
        <div class="field"><label>V en el muro <span class="unit">[kN]</span></label><input type="number" id="V" value="15" step="0.5"></div>
        <div class="field"><label>M pisos superiores <span class="unit">[kN·m]</span></label><input type="number" id="Ms" value="20" step="1"></div>
      </div>
      <div class="row3">
        <div class="field"><label>qD <span class="unit">[kN/m]</span></label><input type="number" id="qD" value="6" step="0.5"></div>
        <div class="field"><label>qL <span class="unit">[kN/m]</span></label><input type="number" id="qL" value="3" step="0.5"></div>
        <div class="field"><label>Viento normal <span class="unit">[kPa]</span></label><input type="number" id="wn" value="0" step="0.1"></div>
      </div>
      <div class="row2">
        <div class="field"><label>KD lateral</label><select id="kdL"></select></div>
        <div class="field"><label>KD gravitacional</label><select id="kdG"></select></div>
      </div>
      <div class="row2">
        <div class="field"><label>Carga resistente al volcamiento</label><select id="res"><option value="t" selected>Ancho tributario de la cuerda</option><option value="m">q·b/2</option></select></div>
        <div class="field"><label>Deriva límite / h piso</label><input type="number" id="dlim" value="0.002" step="0.0005"></div>
      </div>
    </div>
    <div class="panel">
      <div class="note" id="notes"></div>
    </div>
  </div>
  <div>
    <div class="stat-row" id="stats"></div>
    <div id="warns"></div>
    <div class="chartwrap"><div class="toolbar" id="v3bar"></div><canvas id="v3" style="width:100%;height:460px;display:block"></canvas></div>
    <div class="chartwrap"><svg id="mwSvg" viewBox="0 0 1300 660" width="100%" style="display:block;height:auto"></svg></div>
    <div class="chartwrap">
      <div class="ctrls">
        <div class="field"><label>Gráfico</label><select id="cy"><option value="r" selected>Razón por grupo</option><option value="v">V máx. admisible</option><option value="d">Desplazamiento δmc</option></select></div>
      </div>
      <svg id="chSvg" viewBox="0 0 760 380" width="100%" style="display:block;height:auto"></svg>
    </div>
    <div class="panel"><div class="section-title">Verificaciones</div><div class="tablewrap"><table id="tbChk"></table></div></div>
    <div class="panel"><div class="section-title">Cálculo</div><div class="tablewrap"><table id="tbDet"></table></div></div>
  </div>
</div>

<script>
const svgNS='http://www.w3.org/2000/svg';
function el(tag,attrs){ const n=document.createElementNS(svgNS,tag); for(const k in attrs) n.setAttribute(k,attrs[k]); return n; }
function tx(x,y,s,o){ const t=el('text',Object.assign({x,y,'font-size':11,'text-anchor':'middle',fill:'#000'},o||{})); t.textContent=s; return t; }
function niceStep(range,count){ const raw=Math.max(range,1e-12)/count, m=Math.pow(10,Math.floor(Math.log10(raw))), f=raw/m; return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*m; }
function fmtTick(v,st){ const d=st>=1?0:Math.min(6,Math.ceil(-Math.log10(st))); return (Math.abs(v)<st*1e-6?0:v).toFixed(d); }
const fmt=(x,d)=>isFinite(x)?x.toFixed(d):'-';
const fmtk=x=>isFinite(x)?String(Math.round(x)):'-';
const FAIL='#b3261e';

function chart(svg,cfg){
  svg.innerHTML='';
  const W=760,H=cfg.H||420,L=70,R=18,T=16,B=46;
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
  const xs=[],ys=[];
  cfg.series.forEach(s=>s.pts.forEach(p=>{ if(isFinite(p[0])&&isFinite(p[1])){ xs.push(p[0]); ys.push(p[1]); } }));
  (cfg.points||[]).forEach(p=>{ xs.push(p.x); ys.push(p.y); });
  if(!xs.length){ svg.appendChild(tx(W/2,H/2,'Sin datos')); return; }
  let x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
  if(cfg.zeroX){ x0=Math.min(x0,0); x1=Math.max(x1,0); } if(cfg.zeroY){ y0=Math.min(y0,0); y1=Math.max(y1,0); }
  if(cfg.equal){ const c=(x0+x1)/2, d=(y0+y1)/2, h=Math.max(x1-x0,(y1-y0)*(W-L-R)/(H-T-B))/2; x0=c-h; x1=c+h; const hv=h*(H-T-B)/(W-L-R); y0=d-hv; y1=d+hv; }
  const px=(x1-x0)*0.06||1, py=(y1-y0)*0.08||1; x0-=px; x1+=px; y0-=py; y1+=py;
  const sx=niceStep(x1-x0,8), sy=niceStep(y1-y0,7);
  x0=Math.floor(x0/sx)*sx; x1=Math.ceil(x1/sx)*sx; y0=Math.floor(y0/sy)*sy; y1=Math.ceil(y1/sy)*sy;
  if(cfg.xfix){ x0=cfg.xfix[0]; x1=cfg.xfix[1]; } const sxx=cfg.xstep||sx;
  const X=x=>L+(x-x0)/(x1-x0)*(W-L-R), Y=y=>H-B-(y-y0)/(y1-y0)*(H-T-B);
  const g=el('g',{});
  for(let y=y0;y<=y1+sy*1e-6;y+=sy){ g.appendChild(el('line',{x1:L,x2:W-R,y1:Y(y),y2:Y(y),stroke:'#dcdcdc','stroke-width':0.6})); g.appendChild(tx(L-6,Y(y)+4,fmtTick(y,sy),{'text-anchor':'end'})); }
  for(let x=Math.ceil(x0/sxx-1e-9)*sxx;x<=x1+sxx*1e-6;x+=sxx){ g.appendChild(el('line',{x1:X(x),x2:X(x),y1:T,y2:H-B,stroke:'#dcdcdc','stroke-width':0.6})); g.appendChild(tx(X(x),H-B+15,fmtTick(x,sxx))); }
  svg.appendChild(g);
  if(x0<0&&x1>0) svg.appendChild(el('line',{x1:X(0),x2:X(0),y1:T,y2:H-B,stroke:'#555','stroke-width':0.9}));
  if(y0<0&&y1>0) svg.appendChild(el('line',{x1:L,x2:W-R,y1:Y(0),y2:Y(0),stroke:'#555','stroke-width':0.9}));
  svg.appendChild(el('rect',{x:L,y:T,width:W-L-R,height:H-T-B,fill:'none',stroke:'#7a7a7a','stroke-width':1}));
  svg.appendChild(tx((L+W-R)/2,H-8,cfg.xlabel,{'font-weight':700}));
  const yl=tx(14,(T+H-B)/2,cfg.ylabel,{'font-weight':700}); yl.setAttribute('transform',`rotate(-90 14 ${(T+H-B)/2})`); svg.appendChild(yl);
  const clipId='c'+Math.random().toString(36).slice(2);
  const cp=el('clipPath',{id:clipId}); cp.appendChild(el('rect',{x:L,y:T,width:W-L-R,height:H-T-B})); svg.appendChild(cp);
  const gc=el('g',{'clip-path':`url(#${clipId})`});
  cfg.series.forEach(s=>{
