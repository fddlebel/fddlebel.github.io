<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Orejas de izaje | fddlebel</title>
<style>
:root{
  --paper:#ffffff;--panel:#ffffff;--ink:#000000;--line:#9a9a9a;--line-strong:#7a7a7a;
  --accent:#000000;--accent-soft:#e9e9e9;--grid:#d9d9d9;--conc:#c0c0c0;--conc-dark:#a8a8a8;
  --fail:#b3261e;--focus:#4a4d24;
  --sans:'Arial Narrow',Arial,Helvetica,sans-serif;
}
*{box-sizing:border-box;}
[hidden]{display:none!important;}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);padding-block:20px 48px;padding-inline:max(16px,calc((100vw - 1400px)/2));}
h1{font-size:22px;font-weight:700;margin:0;}
.app-header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px;}
.clause{font-size:12px;}
.btn{font-family:var(--sans);font-weight:700;font-size:13px;color:#fff;background:var(--accent);border:1px solid var(--accent);border-radius:4px;padding:7px 14px;cursor:pointer;}
.btn.sec{background:var(--panel);color:var(--ink);border-color:var(--line-strong);}
.grid{display:grid;grid-template-columns:320px minmax(0,1fr);gap:16px;align-items:start;}
@media (max-width:900px){.grid{grid-template-columns:1fr;}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:14px;}
.panel+.panel{margin-top:12px;}
.section-title{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;margin:0 0 10px;}
.field{margin-bottom:9px;min-width:0;}
.field label{display:block;font-size:12px;margin-bottom:3px;}
.unit{opacity:.75;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
input[type=number],input[type=text],select,textarea{width:100%;font-family:var(--sans);font-size:13px;color:var(--ink);background:#fff;border:1px solid var(--line-strong);border-radius:4px;padding:6px 7px;font-variant-numeric:tabular-nums;}
textarea{font-size:12px;resize:vertical;}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--focus);outline-offset:1px;}
details summary{cursor:pointer;font-size:13px;font-weight:700;margin-top:4px;user-select:none;}
details[open] summary{margin-bottom:8px;}
.chk{display:flex;align-items:center;gap:6px;font-size:12px;}
.chk input{width:auto;margin:0;}
.toolbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px;}
.tool{font-family:var(--sans);font-size:12.5px;font-weight:700;background:var(--panel);color:var(--ink);border:1px solid var(--line-strong);border-radius:4px;padding:6px 10px;cursor:pointer;}
.tool.active{background:var(--accent);color:#fff;border-color:var(--accent);}
.toolbar select{width:auto;}
.toolbar .sep{width:1px;height:24px;background:var(--line);margin:0 4px;}
#gridWrap{position:relative;border:1px solid var(--line);border-radius:4px;overflow:auto;max-height:560px;background:#fff;}
#gridCanvas{display:block;cursor:crosshair;touch-action:none;}
#gridInfo{font-size:12px;margin-top:6px;min-height:16px;}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 10px;}
.tabs button{font-family:var(--sans);font-weight:700;font-size:13px;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:7px 14px;cursor:pointer;}
.tabs button.active{background:var(--accent);color:#fff;border-color:var(--accent);}
.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-bottom:12px;}
.stat{border:1px solid var(--line);border-radius:4px;padding:8px 10px;}
.stat .k{font-size:11px;text-transform:uppercase;letter-spacing:.04em;}
.stat .v{font-size:16px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums;}
table{width:100%;border-collapse:collapse;font-size:12.5px;}
th,td{text-align:left;padding:5px 8px;border:1px solid var(--line);font-variant-numeric:tabular-nums;}
th{font-size:11px;font-weight:700;background:var(--accent-soft);}
td.num,th.num{text-align:right;}
tr.fail td{color:var(--fail);font-weight:700;}
.tablewrap{overflow-x:auto;}
.chartwrap{border:1px solid var(--line);border-radius:4px;padding:10px;margin-bottom:12px;}
.ctrls{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin-bottom:10px;}
.ctrls .field{margin:0;width:150px;}
#glWrap{position:relative;border:1px solid var(--line);border-radius:4px;overflow:hidden;background:#fff;}
#glCanvas{display:block;width:100%;height:560px;cursor:grab;touch-action:none;}
#glLabels{position:absolute;inset:0;pointer-events:none;font-size:11px;}
#glLabels span{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;}
.note{font-size:11.5px;line-height:1.5;}
.warn{background:var(--accent-soft);border:1px solid var(--line-strong);border-radius:4px;padding:7px 10px;font-size:12px;margin-bottom:10px;}
#busy{font-size:12px;margin-left:8px;}
svg text{font-family:var(--sans);}
#printReport{display:none;}
.rpt-header{margin-bottom:12px;}
.rpt-header h1{font-size:20px;}
.rpt-sub{font-size:11.5px;margin-top:2px;}
.rpt-params{width:100%;border-collapse:collapse;margin-bottom:14px;font-size:11px;}
.rpt-params td{border:1px solid var(--line);padding:4px 7px;}
.rpt-params td.k{font-weight:700;width:22%;background:var(--accent-soft);}
.rpt-section{margin-bottom:16px;page-break-inside:avoid;break-inside:avoid;}
.rpt-section h2{font-size:14px;font-weight:700;margin:0 0 8px;border-bottom:1px solid var(--line);padding-bottom:4px;break-after:avoid;}
.rpt-section.allow-break{page-break-inside:auto;break-inside:auto;}
.rpt-foot{font-size:10px;margin-top:14px;border-top:1px solid var(--line);padding-top:6px;}
.rpt-small{font-size:10px;}
.rpt-small td,.rpt-small th{padding:2px 5px;}
@media print{
  body *{visibility:hidden;}
  #printReport,#printReport *{visibility:visible;}
  #printReport{display:block;position:absolute;left:0;top:0;width:100%;}
  @page{margin:12mm;}
}
@media print{.grid,.app-header{display:none!important;}}
input[type=range]{width:100%;margin:0;accent-color:#000;}
input:disabled,select:disabled{background:#f2f2f2;color:#777;}
</style>
</head>
<body>
<div class="app-header">
  <h1><a href="index.html" style="color:inherit;text-decoration:none;font-weight:400;">fddlebel</a> / Orejas de izaje</h1>
  <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
    <div class="clause" id="clause">EN 1993-1-8</div>
    <button class="btn sec" id="saveBtn">Guardar proyecto</button>
    <button class="btn sec" id="loadBtn">Abrir proyecto</button>
    <input type="file" id="loadFile" accept=".json" hidden>
    <button class="btn sec" id="dxfBtn">Exportar DXF</button>
    <button class="btn" id="pdfBtn">Exportar PDF</button>
  </div>
</div>

<div id="printReport"></div>

<div class="grid">
  <div>
    <div class="panel">
      <div class="field"><label>Proyecto / oreja</label><input type="text" id="proj" value=""></div>
      <div class="field"><label>Norma</label><select id="code"><option value="en" selected>EN 1993-1-8</option><option value="bth">ASME BTH-1</option></select></div>
      <div class="row3 en">
        <div class="field"><label>γM0</label><input type="number" id="gM0" value="1.00" step="0.05"></div>
        <div class="field"><label>γM2</label><input type="number" id="gM2" value="1.25" step="0.05"></div>
        <div class="field"><label>γM6,ser</label><input type="number" id="gM6" value="1.00" step="0.05"></div>
      </div>
      <div class="row2 bth">
        <div class="field"><label>Categoría de diseño</label><select id="cat"><option value="A">A, Nd 2.00</option><option value="B" selected>B, Nd 3.00</option></select></div>
        <div class="field"><label>Nd</label><input type="text" id="NdV" value="3.00" readonly></div>
      </div>

      <div class="section-title" style="margin-top:12px">Orientación y carga</div>
      <div class="row2">
        <div class="field"><label>Eje de la oreja</label><select id="orient"><option value="0" selected>Arriba, 0°</option><option value="90">Lateral, 90°</option><option value="180">Abajo, 180°</option><option value="c">Otro</option></select></div>
        <div class="field"><label>γ eje desde la vertical <span class="unit">[°]</span></label><input type="number" id="gam" value="0" step="5"></div>
      </div>
      <div class="row3">
        <div class="field"><label>F serv <span class="unit">[kN]</span></label><input type="number" id="F" value="100" step="5"></div>
        <div class="field"><label>kd dinámico</label><input type="number" id="kd" value="1.30" step="0.05"></div>
        <div class="field en"><label>γF</label><input type="number" id="gF" value="1.50" step="0.05"></div>
      </div>
      <div class="row2">
        <div class="field"><label>α en el plano, desde la vertical <span class="unit">[°]</span></label><input type="number" id="al" value="15" step="1" min="-180" max="180"></div>
        <div class="field"><label>φ fuera del plano <span class="unit">[°]</span></label><input type="number" id="ph" value="0" step="1" min="-90" max="90"></div>
      </div>
      <div class="row2">
        <div class="field"><input type="range" id="alR" min="-180" max="180" step="1" value="15"></div>
        <div class="field"><input type="range" id="phR" min="-90" max="90" step="1" value="0"></div>
      </div>
      <div class="row2">
        <div class="field"><label>Carga lateral mín. <span class="unit">[% F]</span></label><input type="number" id="lat" value="5" step="1"></div>
        <div class="field"><label>θ local, desde el eje de la oreja</label><input type="text" id="thV" value="" readonly></div>
      </div>

      <div class="section-title" style="margin-top:12px">Placa oreja</div>
      <div class="field"><label>Forma</label><select id="shape"><option value="r">Cabeza redonda, lados tangentes</option><option value="q">Rectangular</option><option value="p" selected>Contorno libre</option></select></div>
      <div class="field" id="sdBox"><label>Lado recto</label><select id="sside"><option value="n" selected>Ninguno, x del agujero libre</option><option value="l">Izquierdo</option><option value="r">Derecho</option></select></div>
      <div class="field" id="cpBox"><button class="btn sec" id="cpV">Editar como contorno libre</button></div>
      <div id="polyBox">
        <table class="ltab" id="vTab"></table>
        <div style="margin-top:6px;display:flex;gap:6px;flex-wrap:wrap;"><button class="btn sec" id="addV">Agregar vértice</button></div>
        <div class="note" style="margin:6px 0 8px">Vértices x, z en mm, base en z = 0. r es el radio de la esquina.</div>
      </div>
      <div class="row3">
        <div class="field"><label>t <span class="unit">[mm]</span></label><input type="number" id="t" value="30" step="1"></div>
        <div class="field pre"><label>Ancho base b</label><input type="number" id="b" value="220" step="5"></div>
        <div class="field pre"><label id="Rlab">Radio cabeza R</label><input type="number" id="R" value="75" step="5"></div>
      </div>
      <div class="row3">
        <div class="field"><label>Agujero x</label><input type="number" id="ex" value="35" step="5"></div>
        <div class="field"><label>Agujero z</label><input type="number" id="h" value="115" step="5"></div>
        <div class="field"><label>Acero</label><select id="pGr"></select></div>
      </div>
      <div class="row2">
        <div class="field"><label>Agujero d0</label><input type="number" id="d0" value="52" step="1"></div>
        <div class="field"><label>Pasador dp</label><input type="number" id="dp" value="48" step="1"></div>
      </div>
      <div class="row2">
        <div class="field"><label>fy <span class="unit">[MPa]</span></label><input type="number" id="fy" value="355" step="5"></div>
        <div class="field"><label>fu <span class="unit">[MPa]</span></label><input type="number" id="fu" value="470" step="5"></div>
      </div>
      <label class="chk en"><input type="checkbox" id="repl">Pasador removible, tensión de contacto</label>

      <div class="section-title" style="margin-top:12px">Placas de refuerzo</div>
      <div class="row2">
        <div class="field"><label>Cantidad</label><select id="nc"><option value="0" selected>Ninguna</option><option value="1">Un lado</option><option value="2">Ambos lados</option></select></div>
        <div class="field"><label>tc <span class="unit">[mm]</span></label><input type="number" id="tc" value="12" step="1"></div>
      </div>
      <div class="row2">
        <div class="field"><label>Diámetro Dc</label><input type="number" id="Dc" value="130" step="5"></div>
        <div class="field"><label>Garganta filete ac</label><input type="number" id="ac" value="5" step="1"></div>
      </div>

      <div class="section-title" style="margin-top:12px">Soldadura de la oreja</div>
      <div class="row3">
        <div class="field"><label>Tipo</label><select id="wt"><option value="f" selected>Filete ambos lados</option><option value="cjp">CJP</option></select></div>
        <div class="field"><label>Garganta a</label><input type="number" id="aw" value="8" step="1"></div>
        <div class="field en"><label>βw</label><input type="number" id="bw" value="0.90" step="0.05"></div>
        <div class="field bth"><label>Exx <span class="unit">[MPa]</span></label><input type="number" id="Exx" value="490" step="10"></div>
      </div>

      <div class="section-title" style="margin-top:12px">Conexión base</div>
      <div class="field"><label>Tipo</label><select id="base"><option value="w" selected>Soldada al soporte</option><option value="bp">Placa base apernada</option><option value="bs">Placa base soldada en dos bordes</option></select></div>
      <div class="wx">
        <div class="row2">
          <div class="field"><label>Perfil soporte</label><select id="sType"><option value="none">Sin verificar</option><option value="rhs" selected>RHS, oreja sobre la cara</option><option value="pfcw">PFC, oreja sobre el alma</option><option value="pfcf">PFC, oreja sobre el ala</option></select></div>
          <div class="field ssup"><label>Plano de la oreja</label><select id="sDir"><option value="l" selected>A lo largo del perfil</option><option value="t">Transversal al perfil</option></select></div>
        </div>
        <div class="row3 srhs">
          <div class="field"><label>Ancho cara b0</label><input type="number" id="sb0" value="200" step="10"></div>
          <div class="field"><label>Alto h0</label><input type="number" id="sh0" value="200" step="10"></div>
          <div class="field"><label>Pared t0</label><input type="number" id="st0" value="10" step="1"></div>
        </div>
        <div class="spfc">
          <div class="field"><label>PFC</label><select id="pfc"></select></div>
          <div class="row2">
            <div class="field"><label>h</label><input type="number" id="pH" value="300" step="10"></div>
            <div class="field"><label>bf</label><input type="number" id="pBf" value="100" step="5"></div>
          </div>
          <div class="row3">
            <div class="field"><label>tw</label><input type="number" id="pTw" value="9" step="0.5"></div>
            <div class="field"><label>tf</label><input type="number" id="pTf" value="16.5" step="0.5"></div>
            <div class="field spf"><label>Oreja a alma c</label><input type="number" id="cw" value="35" step="5"></div>
          </div>
        </div>
        <div class="row3 ssup">
          <div class="field"><label>fy0 <span class="unit">[MPa]</span></label><input type="number" id="fy0" value="355" step="5"></div>
          <div class="field"><label>n = σ0/fy0</label><input type="number" id="n0" value="0" step="0.1"></div>
          <div class="field en"><label>γM5</label><input type="number" id="gM5" value="1.00" step="0.05"></div>
        </div>
      </div>
      <div class="row2 bpx bsx">
        <div class="field"><label>Placa base tb</label><input type="number" id="tb" value="25" step="1"></div>
        <div class="field bpx"><label>Soporte t</label><input type="number" id="tsup" value="20" step="1"></div>
      </div>
      <div class="bpx">
        <div class="row3">
          <div class="field"><label>Perno</label><select id="bd"></select></div>
          <div class="field"><label>Clase</label><select id="bg"><option>4.6</option><option>5.6</option><option>8.8</option><option>10.9</option></select></div>
          <div class="field"><label>Hilo en plano de corte</label><select id="bth"><option value="Y" selected>Sí</option><option value="N">No</option></select></div>
        </div>
        <div class="row3">
          <div class="field"><label>Filas n1</label><input type="number" id="n1" value="2" step="1" min="1"></div>
          <div class="field"><label>Paso p1</label><input type="number" id="p1" value="140" step="5"></div>
          <div class="field"><label>Borde e1</label><input type="number" id="e1" value="45" step="5"></div>
        </div>
        <div class="row3">
          <div class="field"><label>Columnas n2</label><select id="n2"><option value="1">1 por lado</option><option value="2">2 por lado</option></select></div>
          <div class="field"><label>Gramil g</label><input type="number" id="gg" value="130" step="5"></div>
          <div class="field"><label>Paso p2</label><input type="number" id="p2" value="70" step="5"></div>
        </div>
        <div class="row3">
          <div class="field"><label>Borde e2</label><input type="number" id="e2" value="45" step="5"></div>
        </div>
      </div>
      <div class="bsx">
        <div class="row3">
          <div class="field"><label>Largo Lb</label><input type="number" id="Lbs" value="260" step="5"></div>
          <div class="field"><label>Vano Wb</label><input type="number" id="Wb" value="160" step="5"></div>
          <div class="field"><label>Garganta borde a2</label><input type="number" id="a2" value="6" step="1"></div>
        </div>
      </div>
    </div>
    <div class="panel">
      <div class="note" id="notes"></div>
    </div>
  </div>
  <div>
    <div class="stat-row" id="stats"></div>
    <div id="warns"></div>
    <div class="chartwrap"><div class="toolbar" id="v3bar"></div><canvas id="v3" style="width:100%;height:460px;display:block"></canvas></div>
    <div class="chartwrap"><svg id="lgSvg" viewBox="0 0 1300 660" width="100%" style="display:block;height:auto"></svg></div>
    <div class="chartwrap">
      <div class="ctrls">
        <div class="field"><label>Barrido</label><select id="xv"><option value="al" selected>α en el plano</option><option value="ph">φ fuera del plano</option></select></div>
        <div class="field"><label>Gráfico</label><select id="cy"><option value="r" selected>Razón por grupo</option><option value="f">F serv máx.</option></select></div>
      </div>
      <svg id="chSvg" viewBox="0 0 760 380" width="100%" style="display:block;height:auto"></svg>
    </div>
    <div class="panel"><div class="section-title">Verificaciones</div><div class="tablewrap"><table id="tbChk"></table></div></div>
    <div class="panel"><div class="section-title">Cálculo</div><div class="tablewrap"><table id="tbDet"></table></div></div>
  </div>
</div>

<script>
const svgNS='http://www.w3.org/2000/svg';
function el(tag,attrs){ const n=document.createElementNS(svgNS,tag); for(const k in attrs) n.setAttribute(k,attrs[k]); return n; }
function tx(x,y,s,o){ const t=el('text',Object.assign({x,y,'font-size':11,'text-anchor':'middle',fill:'#000'},o||{})); t.textContent=s; return t; }
function niceStep(range,count){ const raw=Math.max(range,1e-12)/count, m=Math.pow(10,Math.floor(Math.log10(raw))), f=raw/m; return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*m; }
function fmtTick(v,st){ const d=st>=1?0:Math.min(6,Math.ceil(-Math.log10(st))); return (Math.abs(v)<st*1e-6?0:v).toFixed(d); }
const fmt=(x,d)=>isFinite(x)?x.toFixed(d):'-';
const fmtk=x=>isFinite(x)?String(Math.round(x)):'-';
const FAIL='#b3261e';

function chart(svg,cfg){
  svg.innerHTML='';
  const W=760,H=cfg.H||420,L=70,R=18,T=16,B=46;
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
  const xs=[],ys=[];
  cfg.series.forEach(s=>s.pts.forEach(p=>{ if(isFinite(p[0])&&isFinite(p[1])){ xs.push(p[0]); ys.push(p[1]); } }));
  (cfg.points||[]).forEach(p=>{ xs.push(p.x); ys.push(p.y); });
  if(!xs.length){ svg.appendChild(tx(W/2,H/2,'Sin datos')); return; }
  let x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
  if(cfg.zeroX){ x0=Math.min(x0,0); x1=Math.max(x1,0); } if(cfg.zeroY){ y0=Math.min(y0,0); y1=Math.max(y1,0); }
  if(cfg.equal){ const c=(x0+x1)/2, d=(y0+y1)/2, h=Math.max(x1-x0,(y1-y0)*(W-L-R)/(H-T-B))/2; x0=c-h; x1=c+h; const hv=h*(H-T-B)/(W-L-R); y0=d-hv; y1=d+hv; }
  const px=(x1-x0)*0.06||1, py=(y1-y0)*0.08||1; x0-=px; x1+=px; y0-=py; y1+=py;
  const sx=niceStep(x1-x0,8), sy=niceStep(y1-y0,7);
  x0=Math.floor(x0/sx)*sx; x1=Math.ceil(x1/sx)*sx; y0=Math.floor(y0/sy)*sy; y1=Math.ceil(y1/sy)*sy;
  if(cfg.xfix){ x0=cfg.xfix[0]; x1=cfg.xfix[1]; } const sxx=cfg.xstep||sx;
  const X=x=>L+(x-x0)/(x1-x0)*(W-L-R), Y=y=>H-B-(y-y0)/(y1-y0)*(H-T-B);
  const g=el('g',{});
