<!doctype html>

<head>

<title>Estanques de acero | fddlebel</title>
<style>
:root{
  --paper:#ffffff;--panel:#ffffff;--ink:#000000;--line:#9a9a9a;--line-strong:#7a7a7a;

  --fail:#b3261e;--focus:#4a4d24;
  --sans:'Arial Narrow',Arial,Helvetica,sans-serif;
}
*{box-sizing:border-box;}
[hidden]{display:none!important;}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);padding-block:20px 48px;padding-inline:max(16px,calc((100vw - 1400px)/2));}
h1{font-size:22px;font-weight:700;margin:0;}
.app-header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px;}
.clause{font-size:12px;}
.btn{font-family:var(--sans);font-weight:700;font-size:13px;color:#fff;background:var(--accent);border:1px solid var(--accent);border-radius:4px;padding:7px 14px;cursor:pointer;}
.btn.sec{background:var(--panel);color:var(--ink);border-color:var(--line-strong);}
.grid{display:grid;grid-template-columns:320px minmax(0,1fr);gap:16px;align-items:start;}
@media (max-width:900px){.grid{grid-template-columns:1fr;}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:14px;}
.panel+.panel{margin-top:12px;}
.section-title{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;margin:0 0 10px;}
.field{margin-bottom:9px;min-width:0;}
.field label{display:block;font-size:12px;margin-bottom:3px;}
.unit{opacity:.75;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
input[type=number],input[type=text],select,textarea{width:100%;font-family:var(--sans);font-size:13px;color:var(--ink);background:#fff;border:1px solid var(--line-strong);border-radius:4px;padding:6px 7px;font-variant-numeric:tabular-nums;}
textarea{font-size:12px;resize:vertical;}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--focus);outline-offset:1px;}
details summary{cursor:pointer;font-size:13px;font-weight:700;margin-top:4px;user-select:none;}
details[open] summary{margin-bottom:8px;}
.chk{display:flex;align-items:center;gap:6px;font-size:12px;}
.chk input{width:auto;margin:0;}
.toolbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px;}
.tool{font-family:var(--sans);font-size:12.5px;font-weight:700;background:var(--panel);color:var(--ink);border:1px solid var(--line-strong);border-radius:4px;padding:6px 10px;cursor:pointer;}
.tool.active{background:var(--accent);color:#fff;border-color:var(--accent);}
.toolbar select{width:auto;}
.toolbar .sep{width:1px;height:24px;background:var(--line);margin:0 4px;}
#gridWrap{position:relative;border:1px solid var(--line);border-radius:4px;overflow:auto;max-height:560px;background:#fff;}
#gridCanvas{display:block;cursor:crosshair;touch-action:none;}
#gridInfo{font-size:12px;margin-top:6px;min-height:16px;}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 10px;}
.tabs button{font-family:var(--sans);font-weight:700;font-size:13px;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:7px 14px;cursor:pointer;}
.tabs button.active{background:var(--accent);color:#fff;border-color:var(--accent);}
.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-bottom:12px;}
.stat{border:1px solid var(--line);border-radius:4px;padding:8px 10px;}
.stat .k{font-size:11px;text-transform:uppercase;letter-spacing:.04em;}
.stat .v{font-size:16px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums;}
table{width:100%;border-collapse:collapse;font-size:12.5px;}
th,td{text-align:left;padding:5px 8px;border:1px solid var(--line);font-variant-numeric:tabular-nums;}
th{font-size:11px;font-weight:700;background:var(--accent-soft);}
td.num,th.num{text-align:right;}
tr.fail td{color:var(--fail);font-weight:700;}
.tablewrap{overflow-x:auto;}
.chartwrap{border:1px solid var(--line);border-radius:4px;padding:10px;margin-bottom:12px;}
.ctrls{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin-bottom:10px;}
.ctrls .field{margin:0;width:150px;}
#glWrap{position:relative;border:1px solid var(--line);border-radius:4px;overflow:hidden;background:#fff;}
#glCanvas{display:block;width:100%;height:560px;cursor:grab;touch-action:none;}
#glLabels{position:absolute;inset:0;pointer-events:none;font-size:11px;}
#glLabels span{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;}
.note{font-size:11.5px;line-height:1.5;}
.warn{background:var(--accent-soft);border:1px solid var(--line-strong);border-radius:4px;padding:7px 10px;font-size:12px;margin-bottom:10px;}
#busy{font-size:12px;margin-left:8px;}
svg text{font-family:var(--sans);}
#printReport{display:none;}
.rpt-header{margin-bottom:12px;}
.rpt-header h1{font-size:20px;}
.rpt-sub{font-size:11.5px;margin-top:2px;}
.rpt-params{width:100%;border-collapse:collapse;margin-bottom:14px;font-size:11px;}
.rpt-params td{border:1px solid var(--line);padding:4px 7px;}
.rpt-params td.k{font-weight:700;width:22%;background:var(--accent-soft);}
.rpt-section{margin-bottom:16px;page-break-inside:avoid;break-inside:avoid;}
.rpt-section h2{font-size:14px;font-weight:700;margin:0 0 8px;border-bottom:1px solid var(--line);padding-bottom:4px;break-after:avoid;}
.rpt-section.allow-break{page-break-inside:auto;break-inside:auto;}
.rpt-foot{font-size:10px;margin-top:14px;border-top:1px solid var(--line);padding-top:6px;}
.rpt-small{font-size:10px;}
.rpt-small td,.rpt-small th{padding:2px 5px;}
@media print{
  body *{visibility:hidden;}
  #printReport,#printReport *{visibility:visible;}
  #printReport{display:block;position:absolute;left:0;top:0;width:100%;}
  @page{margin:12mm;}
}
</style>
</head>

<div class="app-header">
  <h1><a href="index.html" style="color:inherit;text-decoration:none;font-weight:400;">fddlebel</a> / Estanques de acero</h1>

<div class="grid">

        <div class="field"><label>Eficiencia de junta</label><input type="number" id="Ej" value="1" step="0.05"></div>

      <div class="row3">
        <div class="field"><label>tb fondo <span class="unit">[mm]</span></label><input type="number" id="tb" value="8" step="1"></div>
        <div class="field"><label>ta anular</label><input type="number" id="ta" value="8" step="1"></div>
        <div class="field"><label>CA fondo</label><input type="number" id="CAb" value="2" step="0.5"></div>
      </div>
      <div class="row2">
        <div class="field"><label>Fy anular <span class="unit">[MPa]</span></label><input type="number" id="aFy" value="250" step="5"></div>
        <div class="field"><label>Ancho anular Ls <span class="unit">[m]</span></label><input type="number" id="Ls" value="0.6" step="0.05"></div>

      <div class="section-title" style="margin-top:12px">Techo</div>
      <div class="row3">
        <div class="field"><label>Tipo</label><select id="roof"><option value="cone" selected>Cono autosoportado</option><option value="sup">Soportado</option><option value="open">Abierto</option></select></div>
        <div class="field"><label>Altura cono <span class="unit">[m]</span></label><input type="number" id="hr" value="2" step="0.1"></div>
        <div class="field"><label>t techo <span class="unit">[mm]</span></label><input type="number" id="tr" value="8" step="1"></div>
      </div>
      <div class="row3">
        <div class="field"><label>CA techo</label><input type="number" id="CAr" value="2" step="0.5"></div>
        <div class="field"><label>Adicional <span class="unit">[kN]</span></label><input type="number" id="Wra" value="10" step="1"></div>
        <div class="field"><label>Fracción al manto</label><input type="number" id="frs" value="1" step="0.1"></div>
      </div>
      <div class="row3">
        <div class="field"><label>Lr <span class="unit">[kPa]</span></label><input type="number" id="Lr" value="1" step="0.1"></div>
        <div class="field"><label>Sb nieve</label><input type="number" id="Sb" value="0" step="0.1"></div>
        <div class="field"><label>Pe vacío</label><input type="number" id="Pe" value="0" step="0.1"></div>
      </div>
      <div class="field"><label>Revancha: altura del manto <span class="unit">[m]</span></label><input type="number" id="Hs" value="10" step="0.1"></div>

      <div class="section-title" style="margin-top:12px">Sismo NCh2369:2025</div>
      <div class="row3">
        <div class="field"><label>Zona</label><select id="zona"><option value="0.2">1, A0 = 0,20g</option><option value="0.3">2, A0 = 0,30g</option><option value="0.4" selected>3, A0 = 0,40g</option></select></div>
        <div class="field"><label>Suelo</label><select id="suelo"><option>A</option><option>B</option><option selected>C</option><option>D</option><option>E</option></select></div>
        <div class="field"><label>I</label><select id="imp"><option value="0.8">I, 0,80</option><option value="1.0" selected>II, 1,00</option><option value="1.2">III, 1,20</option><option value="1.2">IV, 1,20</option></select></div>
      </div>
      <div class="row2">
        <div class="field"><label>Impulsivo R / ξ</label><div class="row2"><input type="number" id="Ri" value="4" step="0.5"><input type="number" id="xii" value="0.02" step="0.005"></div></div>
        <div class="field"><label>Convectivo R / ξ</label><div class="row2"><input type="number" id="Rc" value="1.5" step="0.5"><input type="number" id="xic" value="0.005" step="0.005"></div></div>
      </div>
      <label class="chk"><input type="checkbox" id="qmin" checked> Corte basal mínimo 0,25·I·Ar·S, 5.12.1</label>
      <label class="chk"><input type="checkbox" id="vert" checked> Sismo vertical CV, 5.7.1, combinado según 4.5.2</label>

      <div id="boltBox">
        <div class="section-title" style="margin-top:12px">Pernos y sillas</div>
        <div class="row3">
          <div class="field"><label>N pernos</label><input type="number" id="Nb" value="16" step="2"></div>
          <div class="field"><label>Diámetro <span class="unit">[in]</span></label><select id="db"><option>1</option><option>1.25</option><option selected>1.5</option><option>1.75</option><option>2</option><option>2.5</option></select></div>
          <div class="field"><label>CA perno <span class="unit">[mm]</span></label><input type="number" id="CAp" value="1.5" step="0.5"></div>
        </div>
        <div class="row3">
          <div class="field"><label>Fy perno <span class="unit">[MPa]</span></label><input type="number" id="bFy" value="250" step="5"></div>
          <div class="field"><label>Fu perno</label><input type="number" id="bFu" value="400" step="5"></div>
          <div class="field"><label>e excentric. <span class="unit">[mm]</span></label><input type="number" id="ec" value="80" step="5"></div>
        </div>
        <div class="row3">
          <div class="field"><label>a placa sup.</label><input type="number" id="ca" value="160" step="5"></div>
          <div class="field"><label>c espesor</label><input type="number" id="cc" value="35" step="1"></div>
          <div class="field"><label>g entre atiesad.</label><input type="number" id="cg" value="160" step="5"></div>
        </div>
        <div class="row3">
          <div class="field"><label>h altura silla</label><input type="number" id="ch" value="400" step="10"></div>
          <div class="field"><label>j atiesador</label><input type="number" id="cj" value="14" step="1"></div>
          <div class="field"><label>Fy silla</label><input type="number" id="cFy" value="250" step="5"></div>
        </div>
      </div>
      <div class="section-title" style="margin-top:12px">Fundación anular y deslizamiento</div>
      <div class="row3">
        <div class="field"><label>Ancho anillo <span class="unit">[m]</span></label><input type="number" id="bw" value="0.6" step="0.05"></div>
        <div class="field"><label>Alto anillo</label><input type="number" id="hw" value="1.2" step="0.1"></div>
        <div class="field"><label>Wg suelo <span class="unit">[kN]</span></label><input type="number" id="Wg" value="0" step="10"></div>
      </div>
      <div class="row3">
        <div class="field"><label>σ adm. sísmica <span class="unit">[kPa]</span></label><input type="number" id="qadm" value="300" step="10"></div>
        <div class="field"><label>μ roce</label><input type="number" id="mu" value="0.4" step="0.05"></div>
        <div class="field"><label>γ hormigón</label><input type="number" id="gc" value="25" step="0.5"></div>
      </div>
    </div>
    <div class="panel">
      <div class="section-title">Notas</div>
      <div class="note" id="notes"></div>
    </div>
  </div>

  <div style="min-width:0;">
    <div class="stat-row" id="stats"></div>
    <div id="warns"></div>
    <div class="chartwrap"><div class="toolbar" id="v3bar"></div><canvas id="v3" style="width:100%;height:440px;display:block"></canvas></div>
    <div class="chartwrap"><svg id="tkSvg" viewBox="0 0 1300 740" width="100%" style="display:block;height:auto"></svg></div>
    <div class="tabs" id="tabs">
      <button data-tab="rs" class="active">Resumen</button>

    <div class="tabpane" data-pane="mt" hidden>

<script>
const svgNS='http://www.w3.org/2000/svg';
function el(tag,attrs){ const n=document.createElementNS(svgNS,tag); for(const k in attrs) n.setAttribute(k,attrs[k]); return n; }
function tx(x,y,s,o){ const t=el('text',Object.assign({x,y,'font-size':11,'text-anchor':'middle',fill:'#000'},o||{})); t.textContent=s; return t; }
function niceStep(range,count){ const raw=Math.max(range,1e-12)/count, m=Math.pow(10,Math.floor(Math.log10(raw))), f=raw/m; return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*m; }
function fmtTick(v,st){ const d=st>=1?0:Math.min(6,Math.ceil(-Math.log10(st))); return (Math.abs(v)<st*1e-6?0:v).toFixed(d); }
const fmt=(x,d)=>isFinite(x)?x.toFixed(d):'-';
const fmtk=x=>isFinite(x)?String(Math.round(x)):'-';
const FAIL='#b3261e';

function chart(svg,cfg){
  svg.innerHTML='';
  const W=760,H=cfg.H||420,L=70,R=18,T=16,B=46;
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
  const xs=[],ys=[];
  cfg.series.forEach(s=>s.pts.forEach(p=>{ if(isFinite(p[0])&&isFinite(p[1])){ xs.push(p[0]); ys.push(p[1]); } }));
  (cfg.points||[]).forEach(p=>{ xs.push(p.x); ys.push(p.y); });
  if(!xs.length){ svg.appendChild(tx(W/2,H/2,'Sin datos')); return; }
  let x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
  if(cfg.zeroX){ x0=Math.min(x0,0); x1=Math.max(x1,0); } if(cfg.zeroY){ y0=Math.min(y0,0); y1=Math.max(y1,0); }
  if(cfg.equal){ const c=(x0+x1)/2, d=(y0+y1)/2, h=Math.max(x1-x0,(y1-y0)*(W-L-R)/(H-T-B))/2; x0=c-h; x1=c+h; const hv=h*(H-T-B)/(W-L-R); y0=d-hv; y1=d+hv; }
  const px=(x1-x0)*0.06||1, py=(y1-y0)*0.08||1; x0-=px; x1+=px; y0-=py; y1+=py;
  const sx=niceStep(x1-x0,8), sy=niceStep(y1-y0,7);
  x0=Math.floor(x0/sx)*sx; x1=Math.ceil(x1/sx)*sx; y0=Math.floor(y0/sy)*sy; y1=Math.ceil(y1/sy)*sy;
  if(cfg.xfix){ x0=cfg.xfix[0]; x1=cfg.xfix[1]; }
  const X=x=>L+(x-x0)/(x1-x0)*(W-L-R), Y=y=>H-B-(y-y0)/(y1-y0)*(H-T-B);
  const g=el('g',{});
  for(let y=y0;y<=y1+sy*1e-6;y+=sy){ g.appendChild(el('line',{x1:L,x2:W-R,y1:Y(y),y2:Y(y),stroke:'#dcdcdc','stroke-width':0.6})); g.appendChild(tx(L-6,Y(y)+4,fmtTick(y,sy),{'text-anchor':'end'})); }
  for(let x=x0;x<=x1+sx*1e-6;x+=sx){ g.appendChild(el('line',{x1:X(x),x2:X(x),y1:T,y2:H-B,stroke:'#dcdcdc','stroke-width':0.6})); g.appendChild(tx(X(x),H-B+15,fmtTick(x,sx))); }
  svg.appendChild(g);
  if(x0<0&&x1>0) svg.appendChild(el('line',{x1:X(0),x2:X(0),y1:T,y2:H-B,stroke:'#555','stroke-width':0.9}));
  if(y0<0&&y1>0) svg.appendChild(el('line',{x1:L,x2:W-R,y1:Y(0),y2:Y(0),stroke:'#555','stroke-width':0.9}));
  svg.appendChild(el('rect',{x:L,y:T,width:W-L-R,height:H-T-B,fill:'none',stroke:'#7a7a7a','stroke-width':1}));
  svg.appendChild(tx((L+W-R)/2,H-8,cfg.xlabel,{'font-weight':700}));
  const yl=tx(14,(T+H-B)/2,cfg.ylabel,{'font-weight':700}); yl.setAttribute('transform',`rotate(-90 14 ${(T+H-B)/2})`); svg.appendChild(yl);
  const clipId='c'+Math.random().toString(36).slice(2);
  const cp=el('clipPath',{id:clipId}); cp.appendChild(el('rect',{x:L,y:T,width:W-L-R,height:H-T-B})); svg.appendChild(cp);

    const P=Math.min(Fyb*Ab,3*Tb); o.Patt=P;
    const kip=4448.22, inch=25.4, ksi=6.89476;
    const Pk=P/kip, ci=p.cc/inch, fi=(p.ca-dbm-3)/2/inch, gi=p.cg/inch, di=dbm/inch, ei=p.ec/inch, ai=p.ca/inch, hi=p.ch/inch, mi=(p.ta)/inch, ti=tsC/inch, Ri_=R*1000/inch;
    const Stop=Pk/(fi*ci*ci)*(0.375*gi-0.22*di)*ksi;
    const Zf=1/((0.177*ai*mi/SQ(Ri_*ti))*Math.pow(mi/ti,2)+1);
    const Ssh=Pk*ei/(ti*ti)*(1.32*Zf/(1.43*ai*hi*hi/(Ri_*ti)+Math.pow(4*ai*hi*hi,0.333))+0.031/SQ(Ri_*ti))*ksi;
    const SshT=Ssh*Tb/P;
    const jmin=Math.max(0.04*(p.ch-p.cc),12.7);
    Object.assign(o,{Stop,Ssh,SshT,jmin,Zf,fi:fi*inch});
    C.push({n:'Placa superior de silla, AISI E-1, carga 5.12.13',d:f1(Stop,1)+' MPa',c:f1(p.cFy,1)+' MPa',r:Stop/p.cFy});
    C.push({n:'Manto en la silla con Tb, AISI E-1 y Tabla 5.20a',d:f1(SshT,1)+' MPa',c:f1(5/6*p.sFy,1)+' MPa',r:SshT/(5/6*p.sFy)});
    C.push({n:'Manto en la silla con carga 5.12.13, AISI E-1',d:f1(Ssh,1)+' MPa',c:f1(p.sFy,1)+' MPa',r:Ssh/p.sFy});
    C.push({n:'Espesor de atiesadores, AISI E-1',d:f1(jmin,1)+' mm',c:f1(p.cj,1)+' mm',r:jmin/p.cj});
    if(p.ch<Math.max(250,8*dbm)) o.warn.push(`Altura de silla ${p.ch} mm menor que el largo expuesto mínimo max(250 mm, 8d) = ${f1(Math.max(250,8*dbm),0)} mm, 8.5.2.`);
    const WT=Ws+Wr+Wp+Wf, Wfd=PI*(D+p.bw)*p.bw*p.hw*p.gc;
    const OTR=0.5*D*(WT+Wfd+p.Wg)/Ms; o.WT=WT; o.Wfd=Wfd; o.OTR=OTR;
    C.push({n:'Estabilidad de la fundación, E.6.2.3-1',d:f1(2,2),c:f1(OTR,2),r:2/OTR});
    const qw=((wt*(1+v)+1.273*Mrw*1000/(D*D))/1000+p.gc*p.bw*p.hw+gw*G*H*(p.bw/2)*(1+v))/p.bw;
    o.qw=qw; C.push({n:'Presión bajo el anillo de fundación',d:f1(qw,1)+' kPa',c:f1(p.qadm,1)+' kPa',r:qw/p.qadm});

  } else {

    if(wa>wlim){ wa=wlim; L=0.035*D; }
    const Lsel=Math.min(p.Ls,L); if(p.Ls<L){ wa=Math.min(wa,5742*H*Ge*p.Ls); }
    const J=Mrw*1000/(D*D*(wt*(1-v)+wa));
    Object.assign(o,{ta,Ge,wa,L,J});
    if(L>0.035*D+1e-9) o.warn.push('L requerido > 0,035D.');
    if(ta>tsC) o.warn.push('ta mayor que el espesor corroído de la virola inferior, E.6.2.1.1.2.');
    C.push({n:'Razón de anclaje J, Tabla E.6',d:f1(J,3),c:'1.540',r:J/1.54});
    const J15=Mrw15*1000/(D*D*(wt*(1-v)+wa)); o.J15=J15;
    if(J15>1.54){ o.sc=NaN; C.push({n:'Compresión longitudinal del manto, E.6.2.2.1 con R = 1,5 (11.1.1)',d:'J = '+f1(J15,2)+' > 1,54',c:f1(Fc,2)+' MPa',r:Infinity}); }
    else { const sc=J15<=0.785?(wt*(1+v)+1.273*Mrw15*1000/(D*D))/(1000*tsC):((wt*(1+v)+wa)/(0.607-0.18667*Math.pow(J15,2.3))-wa)/(1000*tsC);
      o.sc=sc; C.push({n:'Compresión longitudinal del manto, E.6.2.2.1 con R = 1,5 (11.1.1)',d:f1(sc,2)+' MPa',c:f1(Fc,2)+' MPa',r:sc/Fc}); }
    const Vs=Math.min(p.mu,0.4)*(Ws+Wr+Wf+Wp)*(1-v);
    o.Vs=Vs; C.push({n:'Deslizamiento, E.7.6',d:f1(V,1)+' kN',c:f1(Vs,1)+' kN',r:V/Vs});
    o.yu=12.10*p.aFy*L*L/(p.ta-p.CAb);
    const Pf=wt*(1+v)+1.273*Mrw*1000/(D*D);
    const qw=(Pf/1000+p.gc*p.bw*p.hw+gw*G*H*(p.bw/2)*(1+v))/p.bw; o.qw=qw; o.Pf=Pf;
    C.push({n:'Presión bajo el anillo, Pf E.6.2.3-2',d:f1(qw,1)+' kPa',c:f1(p.qadm,1)+' kPa',r:qw/p.qadm});
    o.Vmax=2*V*1000/(PI*D);
  }
  const tbt=Math.max(...o.crsR.map(r=>r.treq-p.CA)), st1=Math.max(o.crsR[0].td-p.CA,0)/(p.crs[0].t-p.CA)*p.Sd, st2=o.crsR[0].tt/p.crs[0].t*p.St, sMax=Math.max(st1,st2);
  o.st1=st1; o.st2=st2;
  const tcol=[[19,[6,6,7,9]],[25,[6,7,10,11]],[32,[6,9,12,14]],[40,[8,11,14,17]],[45,[9,13,16,19]]], scol=[190,210,220,250];
  const t1=p.crs[0].t; let tbreq=6; const row=tcol.find(r=>t1<=r[0])||tcol[tcol.length-1]; const ci=scol.findIndex(x=>sMax<=x); tbreq=row[1][ci<0?3:ci];
  o.tbreq=tbreq+p.CAb; C.push({n:'Placa anular, Tabla 5.1a',d:f1(o.tbreq,1)+' mm',c:f1(p.ta,1)+' mm',r:o.tbreq/p.ta});
  if(p.roof==='cone'){

    const DL=p.tr/1000*77.0+p.Wra/Aroof, B=DL+Math.max(p.Lr,p.Sb)+0.4*p.Pe, Uu=B;
    const tR=Math.max(2000*D/Math.sin(th)*SQ(B/(1000*ESTEEL))+p.CAr,2000*D/Math.sin(th)*SQ(Uu/(1.33*1000*ESTEEL))+p.CAr,5);
    o.roofR={thd,DL,B,tR}; C.push({n:'Espesor del techo cónico, 5.10.5.1',d:f1(tR,2)+' mm',c:f1(p.tr,1)+' mm',r:tR/p.tr});
    if(p.tr-p.CAr>13) o.warn.push('Espesor corroído del techo mayor que 13 mm, 5.10.5.1.');
    o.roofR.Areq=B*1e-3*Math.pow(D*1000,2)/(8*0.6*p.sFy*Math.tan(th));
  }
  return o;
}

    ['D/H',f1(o.DH,3),''],['Wi / Wc',`${kN(o.Wi)} / ${kN(o.Wc)}`,o.DH>=1.333?'Ec. E.6.1.1-1, E.6.1.1-3':'Ec. E.6.1.1-2, E.6.1.1-3'],['Xi / Xc',`${f1(o.Xi,2)} / ${f1(o.Xc,2)} m`,'Ec. E.6.1.2.1'],['Xis / Xcs',`${f1(o.Xis,2)} / ${f1(o.Xcs,2)} m`,'Ec. E.6.1.2.2'],
    [null,'Periodos, E.4.5'],['tu, Ci',`${f1(o.tu,2)} mm, ${f1(o.Ci,3)}`,'Fig. E.1'],['Ti',f1(o.Ti,3)+' s','Ec. E.4.5.1-1a'],['Ks, Tc',`${f1(o.Ks,3)}, ${f1(o.Tc,2)} s`,'Ec. E.4.5.2-a, E.4.5.2-c'],
    [null,'Aceleraciones, NCh2369:2025 con E.4.3 opción 1'],['Ar, S',`${f1(p.Ar,2)} g, ${SUELO[p.suelo].S}`,''],['Sa impulsivo',`${f1(o.Sai,4)} g`,`R = ${o.Ri}, ξ = ${p.xii}: ${f1(o.SaiR,4)}${p.qmin?', mín. '+f1(o.Qm,4):''}, 11.2.1.6`],['Sa convectivo',`${f1(o.Sac,4)} g`,`R = ${p.Rc}, ξ = ${p.xic}: ${f1(o.SacR,4)}, mín. ${f1(o.Scm,4)}, 11.2.1.7`],
    ['Ai, Ac nivel ASD',`${f1(o.Ai,4)}, ${f1(o.Ac,4)} g`,'0,70·Sa, combinación ASD 4.5.1, Ac ≤ Ai'],['Ai con R = 1,5',f1(o.Ai15,4)+' g','pandeo del manto, 11.1.1'],['CV, Av = 0,70·CV',`${f1(o.CV,4)} g, ${f1(o.Av,4)} g`,'5.7.1, 0,3·Av en lugar de 0,4Av, 4.5.2'],

function run(){
  if(!CRS){ CRS=[{h:2,t:6},{h:2,t:6},{h:2,t:6},{h:2,t:6},{h:2,t:6}]; crsUI(); }
  $('boltBox').hidden=$('anc').value==='self';
  R=analyze();
  $('warns').innerHTML=R.warn.map(w=>`<div class="warn">${w}</div>`).join('');
  renderAll(R,{sum:$('tbSum'),shell:$('tbShell'),roof:$('tbRoof'),seis:$('tbSeis'),anc:$('tbAnc'),fnd:$('tbFnd')},{tk:$('tkSvg')});
  if(!V3){ V3=new View3D($('v3'),{pitch:0.35}); view3dBar('v3bar',V3); } const S3=scene3D(R); V3.set(S3.ms,S3.lb);
  const mx=Math.max(...R.chk.map(c=>c.r));
  $('stats').innerHTML=statsHtml([['V basal ASD',f1(R.V,0)+' kN'],['Mrw ASD',f1(R.Mrw,0)+' kN·m'],['Razón máx.',f1(mx,3),mx<=1],['Estado',mx<=1?'Cumple':'No cumple',mx<=1]]);
  $('notes').innerHTML=notesHtml();
}
function notesHtml(){ return 'Unidades kN, m, mm y MPa. Manto por el método de 1 pie 5.6.3 con Sd y St de la Tabla 5.2a. Sismo según API 650 Anexo E con el espectro de NCh2369:2025 por E.4.3 opción 1: impulsivo R = 4 anclado o 2,5 no anclado con ξ = 2 %, convectivo R = 1,5 con ξ = 0,5 % y mínimo 0,10·I·Ar·S, combinación SRSS. Las aceleraciones se llevan a nivel ASD con 0,70·Sa, y el sismo vertical se combina con 0,3 según 4.5.2 en lugar de 0,4Av. La compresión del manto se calcula con R = 1,5 por 11.1.1. Ola con R = 1. Pernos según 5.12 y corte con 1/3 de los pernos, 11.2.1.13. Silla según AISI E-1 Vol. 2 parte VII, citado en 5.12.7. Ci leído de la Fig. E.1.'; }
function report(){
  const p=R.p, rp=reportStart('Estanque de acero',`${p.proj?p.proj+', ':''}API 650 2021 Anexo E, NCh2369:2025`,[['Geometría',`D = ${p.D} m, H = ${p.H} m, G = ${p.G}, manto ${f1(R.Hs,2)} m`,'Manto',`${$('smat').value}, Sd ${p.Sd}, St ${p.St} MPa, CA ${p.CA} mm`],['Sismo',`Zona ${p.zona} g, suelo ${p.suelo}, I = ${p.I}`,'Anclaje',p.anc==='self'?'No anclado':`${p.Nb} pernos ${p.db} in, ${p.anc==='ring'?'anillo continuo':'sillas'}`]]);
  const T={}; ['sum','shell','roof','seis','anc','fnd'].forEach(k=>T[k]=document.createElement('table'));
  const S={tk:rp.svg()}; S.tk.style.maxWidth='100%'; renderAll(R,T,S);
  rp.sec('Vista 3D',null,snap3D(V3,760,440)); rp.sec('Plano',null,S.tk); rp.sec('Resumen',T.sum.innerHTML); rp.sec('Virolas',T.shell.innerHTML); rp.sec('Fondo y techo',T.roof.innerHTML); rp.sec('Sismo',T.seis.innerHTML); rp.sec('Anclaje',T.anc.innerHTML); rp.sec('Fundación',T.fnd.innerHTML); rp.foot(notesHtml());
}
$('smat').innerHTML=T52.map((m,i)=>`<option value="${i}"${m[0]==='A36M'?' selected':''}>${m[0]}</option>`).join('');
