<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Placa de piso | fddlebel</title>
<style>
:root{
  --paper:#ffffff;--panel:#ffffff;--ink:#000000;--line:#9a9a9a;--line-strong:#7a7a7a;
  --accent:#000000;--accent-soft:#e9e9e9;--grid:#d9d9d9;--conc:#c0c0c0;--conc-dark:#a8a8a8;
  --fail:#b3261e;--focus:#4a4d24;
  --sans:'Arial Narrow',Arial,Helvetica,sans-serif;
}
*{box-sizing:border-box;}
[hidden]{display:none!important;}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);padding-block:20px 48px;padding-inline:max(16px,calc((100vw - 1400px)/2));}
h1{font-size:22px;font-weight:700;margin:0;}
.app-header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px;}
.clause{font-size:12px;}
.btn{font-family:var(--sans);font-weight:700;font-size:13px;color:#fff;background:var(--accent);border:1px solid var(--accent);border-radius:4px;padding:7px 14px;cursor:pointer;}
.btn.sec{background:var(--panel);color:var(--ink);border-color:var(--line-strong);}
.grid{display:grid;grid-template-columns:320px minmax(0,1fr);gap:16px;align-items:start;}
@media (max-width:900px){.grid{grid-template-columns:1fr;}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:14px;}
.panel+.panel{margin-top:12px;}
.section-title{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;margin:0 0 10px;}
.field{margin-bottom:9px;min-width:0;}
.field label{display:block;font-size:12px;margin-bottom:3px;}
.unit{opacity:.75;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
input[type=number],input[type=text],select,textarea{width:100%;font-family:var(--sans);font-size:13px;color:var(--ink);background:#fff;border:1px solid var(--line-strong);border-radius:4px;padding:6px 7px;font-variant-numeric:tabular-nums;}
textarea{font-size:12px;resize:vertical;}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--focus);outline-offset:1px;}
details summary{cursor:pointer;font-size:13px;font-weight:700;margin-top:4px;user-select:none;}
details[open] summary{margin-bottom:8px;}
.chk{display:flex;align-items:center;gap:6px;font-size:12px;}
.chk input{width:auto;margin:0;}
.toolbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px;}
.tool{font-family:var(--sans);font-size:12.5px;font-weight:700;background:var(--panel);color:var(--ink);border:1px solid var(--line-strong);border-radius:4px;padding:6px 10px;cursor:pointer;}
.tool.active{background:var(--accent);color:#fff;border-color:var(--accent);}
.toolbar select{width:auto;}
.toolbar .sep{width:1px;height:24px;background:var(--line);margin:0 4px;}
#gridWrap{position:relative;border:1px solid var(--line);border-radius:4px;overflow:auto;max-height:560px;background:#fff;}
#gridCanvas{display:block;cursor:crosshair;touch-action:none;}
#gridInfo{font-size:12px;margin-top:6px;min-height:16px;}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 10px;}
.tabs button{font-family:var(--sans);font-weight:700;font-size:13px;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:7px 14px;cursor:pointer;}
.tabs button.active{background:var(--accent);color:#fff;border-color:var(--accent);}
.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-bottom:12px;}
.stat{border:1px solid var(--line);border-radius:4px;padding:8px 10px;}
.stat .k{font-size:11px;text-transform:uppercase;letter-spacing:.04em;}
.stat .v{font-size:16px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums;}
table{width:100%;border-collapse:collapse;font-size:12.5px;}
th,td{text-align:left;padding:5px 8px;border:1px solid var(--line);font-variant-numeric:tabular-nums;}
th{font-size:11px;font-weight:700;background:var(--accent-soft);}
td.num,th.num{text-align:right;}
tr.fail td{color:var(--fail);font-weight:700;}
.tablewrap{overflow-x:auto;}
.chartwrap{border:1px solid var(--line);border-radius:4px;padding:10px;margin-bottom:12px;}
.ctrls{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin-bottom:10px;}
.ctrls .field{margin:0;width:150px;}
#glWrap{position:relative;border:1px solid var(--line);border-radius:4px;overflow:hidden;background:#fff;}
#glCanvas{display:block;width:100%;height:560px;cursor:grab;touch-action:none;}
#glLabels{position:absolute;inset:0;pointer-events:none;font-size:11px;}
#glLabels span{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;}
.note{font-size:11.5px;line-height:1.5;}
.warn{background:var(--accent-soft);border:1px solid var(--line-strong);border-radius:4px;padding:7px 10px;font-size:12px;margin-bottom:10px;}
#busy{font-size:12px;margin-left:8px;}
svg text{font-family:var(--sans);}
#printReport{display:none;}
.rpt-header{margin-bottom:12px;}
.rpt-header h1{font-size:20px;}
.rpt-sub{font-size:11.5px;margin-top:2px;}
.rpt-params{width:100%;border-collapse:collapse;margin-bottom:14px;font-size:11px;}
.rpt-params td{border:1px solid var(--line);padding:4px 7px;}
.rpt-params td.k{font-weight:700;width:22%;background:var(--accent-soft);}
.rpt-section{margin-bottom:16px;page-break-inside:avoid;break-inside:avoid;}
.rpt-section h2{font-size:14px;font-weight:700;margin:0 0 8px;border-bottom:1px solid var(--line);padding-bottom:4px;break-after:avoid;}
.rpt-section.allow-break{page-break-inside:auto;break-inside:auto;}
.rpt-foot{font-size:10px;margin-top:14px;border-top:1px solid var(--line);padding-top:6px;}
.rpt-small{font-size:10px;}
.rpt-small td,.rpt-small th{padding:2px 5px;}
@media print{
  body *{visibility:hidden;}
  #printReport,#printReport *{visibility:visible;}
  #printReport{display:block;position:absolute;left:0;top:0;width:100%;}
  @page{margin:12mm;}
}
</style>
</head>
<body>

<div class="app-header">
  <h1><a href="index.html" style="color:inherit;text-decoration:none;font-weight:400;">fddlebel</a> / Placa de piso</h1>
  <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
    <div class="clause">AISC 360-22 F11, G4, H1</div>
    <button class="btn sec" id="saveBtn">Guardar proyecto</button>
    <button class="btn sec" id="loadBtn">Abrir proyecto</button>
    <input type="file" id="loadFile" accept=".json" hidden>
    <button class="btn" id="pdfBtn">Exportar PDF</button>
  </div>
</div>

<div id="printReport"></div>

<div class="grid">
  <div>
    <div class="panel">
      <div class="field"><label>Proyecto / placa</label><input type="text" id="proj" value=""></div>
      <div class="row2">
        <div class="field"><label>Método</label><select id="meth"><option value="lrfd" selected>LRFD, φ</option><option value="asd">ASD, Ω</option></select></div>
        <div class="field"><label>Acero</label><select id="mat"></select></div>
      </div>
      <div class="row3">
        <div class="field"><label>Fy <span class="unit">[MPa]</span></label><input type="number" id="Fy" value="250" step="5"></div>
        <div class="field"><label>Fu</label><input type="number" id="Fu" value="400" step="5"></div>
        <div class="field"><label>t <span class="unit">[mm]</span></label><input type="number" id="t" value="6" step="1"></div>
      </div>
      <div class="row2">
        <div class="field"><label>Luz entre apoyos <span class="unit">[mm]</span></label><input type="number" id="L" value="600" step="50"></div>
        <div class="field"><label>Límite de flecha L/</label><input type="number" id="dl" value="250" step="10"></div>
      </div>
      <div class="section-title" style="margin-top:12px">Cargas</div>
      <div class="row2">
        <div class="field"><label>D sobrepuesta <span class="unit">[kPa]</span></label><input type="number" id="qD" value="0" step="0.1"></div>
        <div class="field"><label>L uniforme <span class="unit">[kPa]</span></label><input type="number" id="qL" value="5" step="0.5"></div>
      </div>
      <div class="row3">
        <div class="field"><label>P puntual <span class="unit">[kN]</span></label><input type="number" id="P" value="4.5" step="0.5"></div>
        <div class="field"><label>Huella <span class="unit">[mm]</span></label><input type="number" id="c" value="100" step="10"></div>
        <div class="field"><label>Ancho efectivo be</label><input type="number" id="be" value="400" step="10"></div>
      </div>
      <label class="chk"><input type="checkbox" id="memb"> Acción de membrana con apoyos que impiden el desplazamiento horizontal</label>
      <div class="row2" id="mBox"><div class="field"><label>Resistencia de fijación <span class="unit">[kN]</span></label><input type="number" id="Rf" value="6.9" step="0.1"></div><div class="field"><label>Fijaciones por metro</label><input type="number" id="nf" value="4" step="1"></div></div>
    </div>
    <div class="panel">
      <div class="section-title">Notas</div>
      <div class="note" id="notes"></div>
    </div>
  </div>
  <div style="min-width:0;">
    <div class="stat-row" id="stats"></div>
    <div id="warns"></div>
    <div class="chartwrap"><svg id="ppSvg" viewBox="0 0 760 260" width="100%" style="display:block;height:auto"></svg></div>
    <div class="panel"><div class="section-title">Verificaciones</div><div class="tablewrap"><table id="tbChk"></table></div></div>
    <div class="panel"><div class="section-title">Desarrollo</div><div class="tablewrap"><table id="tbDet"></table></div></div>
  </div>
</div>
<script>
const svgNS='http://www.w3.org/2000/svg';
function el(tag,attrs){ const n=document.createElementNS(svgNS,tag); for(const k in attrs) n.setAttribute(k,attrs[k]); return n; }
function tx(x,y,s,o){ const t=el('text',Object.assign({x,y,'font-size':11,'text-anchor':'middle',fill:'#000'},o||{})); t.textContent=s; return t; }
function niceStep(range,count){ const raw=Math.max(range,1e-12)/count, m=Math.pow(10,Math.floor(Math.log10(raw))), f=raw/m; return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*m; }
function fmtTick(v,st){ const d=st>=1?0:Math.min(6,Math.ceil(-Math.log10(st))); return (Math.abs(v)<st*1e-6?0:v).toFixed(d); }
const fmt=(x,d)=>isFinite(x)?x.toFixed(d):'-';
const fmtk=x=>isFinite(x)?String(Math.round(x)):'-';
const FAIL='#b3261e';

function chart(svg,cfg){
  svg.innerHTML='';
  const W=760,H=cfg.H||420,L=70,R=18,T=16,B=46;
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
  const xs=[],ys=[];
  cfg.series.forEach(s=>s.pts.forEach(p=>{ if(isFinite(p[0])&&isFinite(p[1])){ xs.push(p[0]); ys.push(p[1]); } }));
  (cfg.points||[]).forEach(p=>{ xs.push(p.x); ys.push(p.y); });
  if(!xs.length){ svg.appendChild(tx(W/2,H/2,'Sin datos')); return; }
  let x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
  if(cfg.zeroX){ x0=Math.min(x0,0); x1=Math.max(x1,0); } if(cfg.zeroY){ y0=Math.min(y0,0); y1=Math.max(y1,0); }
  if(cfg.equal){ const c=(x0+x1)/2, d=(y0+y1)/2, h=Math.max(x1-x0,(y1-y0)*(W-L-R)/(H-T-B))/2; x0=c-h; x1=c+h; const hv=h*(H-T-B)/(W-L-R); y0=d-hv; y1=d+hv; }
  const px=(x1-x0)*0.06||1, py=(y1-y0)*0.08||1; x0-=px; x1+=px; y0-=py; y1+=py;
  const sx=niceStep(x1-x0,8), sy=niceStep(y1-y0,7);
  x0=Math.floor(x0/sx)*sx; x1=Math.ceil(x1/sx)*sx; y0=Math.floor(y0/sy)*sy; y1=Math.ceil(y1/sy)*sy;
  if(cfg.xfix){ x0=cfg.xfix[0]; x1=cfg.xfix[1]; }
  const X=x=>L+(x-x0)/(x1-x0)*(W-L-R), Y=y=>H-B-(y-y0)/(y1-y0)*(H-T-B);
  const g=el('g',{});
  for(let y=y0;y<=y1+sy*1e-6;y+=sy){ g.appendChild(el('line',{x1:L,x2:W-R,y1:Y(y),y2:Y(y),stroke:'#dcdcdc','stroke-width':0.6})); g.appendChild(tx(L-6,Y(y)+4,fmtTick(y,sy),{'text-anchor':'end'})); }
  for(let x=x0;x<=x1+sx*1e-6;x+=sx){ g.appendChild(el('line',{x1:X(x),x2:X(x),y1:T,y2:H-B,stroke:'#dcdcdc','stroke-width':0.6})); g.appendChild(tx(X(x),H-B+15,fmtTick(x,sx))); }
  svg.appendChild(g);
  if(x0<0&&x1>0) svg.appendChild(el('line',{x1:X(0),x2:X(0),y1:T,y2:H-B,stroke:'#555','stroke-width':0.9}));
  if(y0<0&&y1>0) svg.appendChild(el('line',{x1:L,x2:W-R,y1:Y(0),y2:Y(0),stroke:'#555','stroke-width':0.9}));
  svg.appendChild(el('rect',{x:L,y:T,width:W-L-R,height:H-T-B,fill:'none',stroke:'#7a7a7a','stroke-width':1}));
  svg.appendChild(tx((L+W-R)/2,H-8,cfg.xlabel,{'font-weight':700}));
  const yl=tx(14,(T+H-B)/2,cfg.ylabel,{'font-weight':700}); yl.setAttribute('transform',`rotate(-90 14 ${(T+H-B)/2})`); svg.appendChild(yl);
  const clipId='c'+Math.random().toString(36).slice(2);
  const cp=el('clipPath',{id:clipId}); cp.appendChild(el('rect',{x:L,y:T,width:W-L-R,height:H-T-B})); svg.appendChild(cp);
  const gc=el('g',{'clip-path':`url(#${clipId})`});
  cfg.series.forEach(s=>{
    const d=s.pts.filter(p=>isFinite(p[0])&&isFinite(p[1])).map((p,i)=>(i?'L':'M')+X(p[0]).toFixed(1)+','+Y(p[1]).toFixed(1)).join(' ')+(s.close?'Z':'');
    gc.appendChild(el('path',{d,fill:'none',stroke:s.color||'#000','stroke-width':s.w||1.4,'stroke-dasharray':s.dash||'none','stroke-linejoin':'round'}));
  });
  (cfg.points||[]).forEach(p=>{
    const col=p.fail?FAIL:'#000';
    if(p.ring) gc.appendChild(el('circle',{cx:X(p.x),cy:Y(p.y),r:3.5,fill:'#fff',stroke:col,'stroke-width':1.4}));
    else gc.appendChild(el('circle',{cx:X(p.x),cy:Y(p.y),r:3.2,fill:col}));
    if(p.label) gc.appendChild(tx(X(p.x)+6,Y(p.y)-6,p.label,{'text-anchor':'start','font-size':10.5,'font-weight':700,fill:col}));
  });
  svg.appendChild(gc);
  const named=cfg.series.filter(s=>s.name);
  if(named.length){
    const lx=cfg.legendRight?W-R-220:L+12; let ly=T+16;
    svg.appendChild(el('rect',{x:lx-6,y:T+4,width:214,height:named.length*16+6,fill:'#fff',stroke:'#cfcfcf','stroke-width':0.6}));
    named.forEach(s=>{
      svg.appendChild(el('line',{x1:lx,x2:lx+28,y1:ly-4,y2:ly-4,stroke:s.color||'#000','stroke-width':s.w||1.4,'stroke-dasharray':s.dash||'none'}));
      svg.appendChild(tx(lx+36,ly,s.name,{'text-anchor':'start','font-size':11}));
      ly+=16;
    });
  }
}

const $=id=>document.getElementById(id);
function num(id,def){ const e=$(id); if(!e) return def; const x=parseFloat(e.value); return isFinite(x)?x:def; }
const f1=(x,d)=>isFinite(x)?x.toFixed(d):'-';
const OKS=ok=>ok?'Cumple':'No cumple';
const ESTEEL=200000, GSTEEL=77200;
let R=null;
function kv(rows){ return '<thead><tr><th>Parámetro</th><th class="num">Valor</th><th>Referencia</th></tr></thead><tbody>'+rows.map(r=>r[0]===null?`<tr><th colspan="3" style="text-align:left">${r[1]}</th></tr>`:`<tr${r[3]===false?' class="fail"':''}><td>${r[0]}</td><td class="num">${r[1]}</td><td>${r[2]||''}</td></tr>`).join('')+'</tbody>'; }
function tbl(head,rows,numFrom){ const nf=numFrom==null?1:numFrom; return '<thead><tr>'+head.map((h,i)=>`<th${i>=nf?' class="num"':''}>${h}</th>`).join('')+'</tr></thead><tbody>'+rows.map(r=>`<tr${r.fail?' class="fail"':''}>`+r.c.map((v,i)=>`<td${i>=nf?' class="num"':''}>${v}</td>`).join('')+'</tr>').join('')+'</tbody>'; }
function chkTable(list){ return tbl(['Verificación','Demanda','Capacidad','Razón','Estado'],list.map(c=>({fail:!(c.r<=1+1e-9),c:[c.n,c.d,c.c,f1(c.r,3),OKS(c.r<=1+1e-9)]})),1); }
function statsHtml(list){ return list.map(s=>`<div class="stat"><div class="k">${s[0]}</div><div class="v"${s[2]===false?` style="color:${FAIL}"`:''}>${s[1]}</div></div>`).join(''); }
const MATS={A36:[250,400],'A572 Gr50':[345,450],A992:[345,450],'A500 Gr B rect.':[315,400],'A500 Gr B red.':[290,400],'A500 Gr C rect.':[345,425],'A500 Gr C red.':[315,425],'A53 Gr B':[240,415],A270ES:[270,410],A345ES:[345,450]};
function fillMat(selId,fyId,fuId,def){ const s=$(selId); s.innerHTML=Object.keys(MATS).map(k=>`<option${k===def?' selected':''}>${k}</option>`).join('')+'<option value="otro">Otro</option>'; s.addEventListener('change',()=>{ const m=MATS[s.value]; if(m){ $(fyId).value=m[0]; $(fuId).value=m[1]; } }); }
function phiOm(lrfd,phi,om){ return lrfd?phi:1/om; }
function wireApp(cfg){
  let tmr=null;
  const go=()=>{ try{ cfg.run(); try{ localStorage.setItem(cfg.key,JSON.stringify(projectData())); }catch(e){} }catch(e){ $('warns').innerHTML=`<div class="warn">Error: ${e.message}</div>`; console.error(e); } };
  const bind=root=>root.querySelectorAll('input,select,textarea').forEach(i=>{ if(i.type==='file'||i.dataset.bound) return; i.dataset.bound=1; i.addEventListener('input',()=>{ clearTimeout(tmr); tmr=setTimeout(go,150); }); i.addEventListener('change',()=>{ clearTimeout(tmr); tmr=setTimeout(go,30); }); });
  bind(document);
  document.querySelectorAll('#tabs button').forEach(b=>b.addEventListener('click',()=>{ document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('active',x===b)); document.querySelectorAll('.tabpane').forEach(q=>q.hidden=q.dataset.pane!==b.dataset.tab); }));
  const ids=()=>[...document.querySelectorAll('input,select,textarea')].filter(e=>e.id&&e.type!=='file').map(e=>e.id);
  function projectData(){ const d={}; ids().forEach(id=>{ const e=$(id); d[id]=e.type==='checkbox'?e.checked:e.value; }); return {app:cfg.app,v:1,inputs:d,extra:cfg.getExtra?cfg.getExtra():null}; }
  function loadProject(d){ if(!d||!d.inputs) return false; if(cfg.setExtra) cfg.setExtra(d.extra); bind(document); Object.entries(d.inputs).forEach(([id,v])=>{ const e=$(id); if(!e) return; if(e.type==='checkbox') e.checked=!!v; else e.value=v; }); if(cfg.afterLoad) cfg.afterLoad(); return true; }
  function download(name,text,type){ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([text],{type:type||'text/plain'})); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },500); }
  const base=()=>(($('proj')&&$('proj').value.trim().replace(/[^\w\-]+/g,'_'))||cfg.app);
  $('saveBtn').addEventListener('click',()=>download(base()+'.json',JSON.stringify(projectData()),'application/json'));
  $('loadBtn').addEventListener('click',()=>$('loadFile').click());
  $('loadFile').addEventListener('change',ev=>{ const f=ev.target.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>{ try{ if(loadProject(JSON.parse(r.result))) go(); }catch(e){ $('warns').innerHTML='<div class="warn">El archivo no es un proyecto válido.</div>'; } }; r.readAsText(f); ev.target.value=''; });
  $('pdfBtn').addEventListener('click',()=>{ if(!R) return; cfg.report(); window.print(); });
  window.rerun=()=>{ bind(document); go(); };
  try{ const d=JSON.parse(localStorage.getItem(cfg.key)||'null'); if(d) loadProject(d); }catch(e){}
  if(cfg.init) cfg.init();
  go();
}
function reportStart(title,sub,params){
  const ct=$('printReport'); ct.innerHTML='';
  const hd=document.createElement('div'); hd.className='rpt-header'; hd.innerHTML=`<h1>${title}</h1><div class="rpt-sub">${sub}, ${new Date().toLocaleDateString('es-CL')}</div>`; ct.appendChild(hd);
  if(params&&params.length){ const pt=document.createElement('table'); pt.className='rpt-params'; pt.innerHTML=params.map(r=>`<tr>${r.map((c,i)=>`<td${i%2===0?' class="k"':''}>${c}</td>`).join('')}</tr>`).join(''); ct.appendChild(pt); }
  return {
    sec(t,html,node){ const s=document.createElement('div'); s.className='rpt-section'; s.innerHTML=`<h2>${t}</h2>`; if(html){ const tb=document.createElement('table'); tb.className='rpt-small'; tb.innerHTML=html; s.appendChild(tb); } if(node) s.appendChild(node); ct.appendChild(s); return s; },
    svg(){ return el('svg',{width:'100%',style:'max-width:620px;height:auto;display:block;margin:0 auto;'}); },
    foot(h){ const f=document.createElement('div'); f.className='rpt-foot'; f.innerHTML=h; ct.appendChild(f); }
  };
}
const SQ=Math.sqrt, PI=Math.PI;
const kcF=(h,tw)=>Math.min(0.76,Math.max(0.35,4/SQ(h/tw)));

  } else if(s.fam==='2L'){
    const b=dir==='y'?s.dv:s.dh, Cv=Cv2F(b/s.t,1.2,E,Fy); Vn=2*0.6*Fy*b*s.t*Cv; ref=`Ec. G3-1 × 2 piernas, Cv2 = ${f1(Cv,3)}`;

function torsionHSS(s,m){
  const E=m.E,Fy=m.Fy; let Fcr;

function memb(Q,qline,L,EI,EA){
  const k1=EI*Math.pow(PI,4)/(2*L*L*L), k3=EA*Math.pow(PI,4)/(8*L*L*L), F=2*qline*L/PI+Q;
  let d=F/k1; for(let i=0;i<60;i++){ const f=k1*d+k3*d*d*d-F, df=k1+3*k3*d*d; const dn=d-f/df; if(Math.abs(dn-d)<1e-10){ d=dn; break; } d=dn; }

  return {d,N,M,M0,k1,k3,F};
}
function analyze(){

  const Mu=wu*L*L/8, Vu=wu*L/2;

  o.chk.push({n:'Flexión, carga uniforme, F11',d:f1(Mu/1e6,3)+' kN·m',c:f1(pb*Mn(b)/1e6,3)+' kN·m',r:Mu/(pb*Mn(b))});
  o.chk.push({n:'Corte, carga uniforme, G4',d:f1(Vu/1e3,2)+' kN',c:f1(pv*Vn(b)/1e3,1)+' kN',r:Vu/(pv*Vn(b))});
  const MuP=cP[2]*L/4+cP[1]*L*L/8, VuP=cP[2]/2+cP[1]*L/2;
  D.push([null,'Carga puntual al centro, ancho efectivo be'],['Combinación',cP[0],'P no simultánea con L uniforme'],['M, V',`${f1(MuP/1e6,3)} kN·m, ${f1(VuP/1e3,2)} kN`,'P·L/4 + w·L²/8']);
  if(be<c) o.warn.push('be menor que la huella de la carga.');
  if(be>b) o.warn.push('be mayor que 1 m: revisar el ancho real disponible.');
  o.chk.push({n:'Flexión, carga puntual, F11',d:f1(MuP/1e6,3)+' kN·m',c:f1(pb*Mn(be)/1e6,3)+' kN·m',r:MuP/(pb*Mn(be))});
  o.chk.push({n:'Corte, carga puntual, G4',d:f1(VuP/1e3,2)+' kN',c:f1(pv*Vn(be)/1e3,1)+' kN',r:VuP/(pv*Vn(be))});
  const dLu=5*qL*b*Math.pow(L,4)/(384*E*I(b)), dP=P*L*L*L/(48*E*I(be)), dlim=L/dl;

  o.chk.push({n:'Flecha L uniforme',d:f1(dLu,2)+' mm',c:f1(dlim,2)+' mm',r:dLu/dlim});

    D.push([null,'Acción de membrana, Ritz con w = δ·sin(πx/L)'],['Equilibrio','EIπ⁴δ/2L³ + EAπ⁴δ³/8L³ = 2qL/π + P','energía potencial estacionaria'],
      ['Servicio: δ, N, M',`${f1(s.d,2)} mm, ${f1(s.N/1e3,2)} kN, ${f1(s.M/1e6,3)} kN·m`,'P de servicio sobre be, M = M0 − N·δ'],
      [lrfd?'Mayorado: δ, N, M':'ASD: δ, N, M',`${f1(u.d,2)} mm, ${f1(u.N/1e3,2)} kN, ${f1(u.M/1e6,3)} kN·m`,cP[0]],
      ['Pr/Pc, Mr/Mc',`${f1(rp,3)}, ${f1(rm,3)}`,'D2-1 y F11 sobre be']);
    o.chk.push({n:'Flecha P con membrana',d:f1(s.d,2)+' mm',c:f1(dlim,2)+' mm',r:s.d/dlim});
    o.chk.push({n:'Tracción y flexión con membrana, H1',d:'',c:'1.000',r:h1});
    const Hm=u.N/be*1000, Rf=num('Rf',6.9)*1e3*num('nf',4);
    D.push(['Fuerza horizontal en el apoyo',f1(Hm/1e3,2)+' kN/m','N / be']);
    o.chk.push({n:'Fijación al apoyo',d:f1(Hm/1e3,2)+' kN/m',c:f1(Rf/1e3,2)+' kN/m',r:Hm/Rf});
    o.memb={s,u};

}
function draw(svg,o){
  const W=760,H=260; svg.innerHTML=''; svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
  const A=(n,a)=>svg.appendChild(el(n,a)), T=(x,y,t,op)=>svg.appendChild(tx(x,y,t,Object.assign({'font-size':11},op||{})));

  A('rect',{x:x0-30,y:y,width:x1-x0+60,height:th,fill:'#cfcfcf',stroke:'#000','stroke-width':1.2});
  [x0,x1].forEach(x=>{ A('polygon',{points:`${x},${y+th} ${x-10},${y+th+16} ${x+10},${y+th+16}`,fill:'none',stroke:'#000'}); });
  const xm=(x0+x1)/2; A('line',{x1:xm,x2:xm,y1:y-50,y2:y-4,stroke:'#000','stroke-width':1.6}); A('polygon',{points:`${xm},${y-2} ${xm-5},${y-12} ${xm+5},${y-12}`,fill:'#000'}); T(xm+8,y-40,`P = ${f1(o.P/1e3,2)} kN`,{'text-anchor':'start'});
  for(let i=0;i<=18;i++){ const x=x0+(x1-x0)*i/18; A('line',{x1:x,x2:x,y1:y-22,y2:y-4,stroke:'#000','stroke-width':0.6}); }
  A('line',{x1:x0,x2:x1,y1:y-22,y2:y-22,stroke:'#000','stroke-width':0.6});
  if(o.memb){ const d=o.memb.s.d, amp=Math.min(60/Math.max(d,1e-3),20); let pts=''; for(let i=0;i<=40;i++){ const xx=i/40; pts+=`${x0+(x1-x0)*xx},${y+th/2+amp*d*Math.sin(Math.PI*xx)} `; } A('polyline',{points:pts,fill:'none',stroke:'#000','stroke-width':1,'stroke-dasharray':'5,3'}); T(xm,y+th+60,`δ servicio = ${f1(d,2)} mm, N = ${f1(o.memb.s.N/1e3,2)} kN`); }
  A('line',{x1:x0,x2:x1,y1:y+th+30,y2:y+th+30,stroke:'#000','stroke-width':0.6}); T(xm,y+th+44,`L = ${o.L} mm, t = ${o.t} mm, be = ${o.be} mm`);
}
function run(){

  R=analyze();
