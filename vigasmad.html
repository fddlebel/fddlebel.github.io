<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vigas de madera | fddlebel</title>
<style>
:root{
  --paper:#ffffff;--panel:#ffffff;--ink:#000000;--line:#9a9a9a;--line-strong:#7a7a7a;
  --accent:#000000;--accent-soft:#e9e9e9;--grid:#d9d9d9;--conc:#c0c0c0;--conc-dark:#a8a8a8;
  --fail:#b3261e;--focus:#4a4d24;
  --sans:'Arial Narrow',Arial,Helvetica,sans-serif;
}
*{box-sizing:border-box;}
[hidden]{display:none!important;}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);padding-block:20px 48px;padding-inline:max(16px,calc((100vw - 1400px)/2));}
h1{font-size:22px;font-weight:700;margin:0;}
.app-header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px;}
.clause{font-size:12px;}
.btn{font-family:var(--sans);font-weight:700;font-size:13px;color:#fff;background:var(--accent);border:1px solid var(--accent);border-radius:4px;padding:7px 14px;cursor:pointer;}
.btn.sec{background:var(--panel);color:var(--ink);border-color:var(--line-strong);}
.grid{display:grid;grid-template-columns:320px minmax(0,1fr);gap:16px;align-items:start;}
@media (max-width:900px){.grid{grid-template-columns:1fr;}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:14px;}
.panel+.panel{margin-top:12px;}
.section-title{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;margin:0 0 10px;}
.field{margin-bottom:9px;min-width:0;}
.field label{display:block;font-size:12px;margin-bottom:3px;}
.unit{opacity:.75;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
input[type=number],input[type=text],select,textarea{width:100%;font-family:var(--sans);font-size:13px;color:var(--ink);background:#fff;border:1px solid var(--line-strong);border-radius:4px;padding:6px 7px;font-variant-numeric:tabular-nums;}
textarea{font-size:12px;resize:vertical;}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--focus);outline-offset:1px;}
details summary{cursor:pointer;font-size:13px;font-weight:700;margin-top:4px;user-select:none;}
details[open] summary{margin-bottom:8px;}
.chk{display:flex;align-items:center;gap:6px;font-size:12px;}
.chk input{width:auto;margin:0;}
.toolbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px;}
.tool{font-family:var(--sans);font-size:12.5px;font-weight:700;background:var(--panel);color:var(--ink);border:1px solid var(--line-strong);border-radius:4px;padding:6px 10px;cursor:pointer;}
.tool.active{background:var(--accent);color:#fff;border-color:var(--accent);}
.toolbar select{width:auto;}
.toolbar .sep{width:1px;height:24px;background:var(--line);margin:0 4px;}
#gridWrap{position:relative;border:1px solid var(--line);border-radius:4px;overflow:auto;max-height:560px;background:#fff;}
#gridCanvas{display:block;cursor:crosshair;touch-action:none;}
#gridInfo{font-size:12px;margin-top:6px;min-height:16px;}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 10px;}
.tabs button{font-family:var(--sans);font-weight:700;font-size:13px;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:7px 14px;cursor:pointer;}
.tabs button.active{background:var(--accent);color:#fff;border-color:var(--accent);}
.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-bottom:12px;}
.stat{border:1px solid var(--line);border-radius:4px;padding:8px 10px;}
.stat .k{font-size:11px;text-transform:uppercase;letter-spacing:.04em;}
.stat .v{font-size:16px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums;}
table{width:100%;border-collapse:collapse;font-size:12.5px;}
th,td{text-align:left;padding:5px 8px;border:1px solid var(--line);font-variant-numeric:tabular-nums;}
th{font-size:11px;font-weight:700;background:var(--accent-soft);}
td.num,th.num{text-align:right;}
tr.fail td{color:var(--fail);font-weight:700;}
.tablewrap{overflow-x:auto;}
.chartwrap{border:1px solid var(--line);border-radius:4px;padding:10px;margin-bottom:12px;}
.ctrls{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin-bottom:10px;}
.ctrls .field{margin:0;width:150px;}
#glWrap{position:relative;border:1px solid var(--line);border-radius:4px;overflow:hidden;background:#fff;}
#glCanvas{display:block;width:100%;height:560px;cursor:grab;touch-action:none;}
#glLabels{position:absolute;inset:0;pointer-events:none;font-size:11px;}
#glLabels span{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;}
.note{font-size:11.5px;line-height:1.5;}
.warn{background:var(--accent-soft);border:1px solid var(--line-strong);border-radius:4px;padding:7px 10px;font-size:12px;margin-bottom:10px;}
#busy{font-size:12px;margin-left:8px;}
svg text{font-family:var(--sans);}
#printReport{display:none;}
.rpt-header{margin-bottom:12px;}
.rpt-header h1{font-size:20px;}
.rpt-sub{font-size:11.5px;margin-top:2px;}
.rpt-params{width:100%;border-collapse:collapse;margin-bottom:14px;font-size:11px;}
.rpt-params td{border:1px solid var(--line);padding:4px 7px;}
.rpt-params td.k{font-weight:700;width:22%;background:var(--accent-soft);}
.rpt-section{margin-bottom:16px;page-break-inside:avoid;break-inside:avoid;}
.rpt-section h2{font-size:14px;font-weight:700;margin:0 0 8px;border-bottom:1px solid var(--line);padding-bottom:4px;break-after:avoid;}
.rpt-section.allow-break{page-break-inside:auto;break-inside:auto;}
.rpt-foot{font-size:10px;margin-top:14px;border-top:1px solid var(--line);padding-top:6px;}
.rpt-small{font-size:10px;}
.rpt-small td,.rpt-small th{padding:2px 5px;}
@media print{
  body *{visibility:hidden;}
  #printReport,#printReport *{visibility:visible;}
  #printReport{display:block;position:absolute;left:0;top:0;width:100%;}
  @page{margin:12mm;}
}
@media print{.grid,.app-header{display:none!important;}}
input[type=range]{width:100%;margin:0;accent-color:#000;}
input:disabled,select:disabled{background:#f2f2f2;color:#777;}
</style>
</head>
<body>
<div class="app-header">
  <h1><a href="index.html" style="color:inherit;text-decoration:none;font-weight:400;">fddlebel</a> / Vigas de madera</h1>
  <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
    <div class="clause" id="clause">NCh1198:2024, 8.2, 8.5, 8.6, 8.7 y 11</div>
    <button class="btn sec" id="saveBtn">Guardar proyecto</button>
    <button class="btn sec" id="loadBtn">Abrir proyecto</button>
    <input type="file" id="loadFile" accept=".json" hidden>
    <button class="btn" id="pdfBtn">Exportar PDF</button>
  </div>
</div>

<div id="printReport"></div>

<div class="grid">
  <div>
    <div class="panel">
      <div class="field"><label>Proyecto / elemento</label><input type="text" id="proj" value=""></div>

      <div class="section-title" style="margin-top:12px">Material</div>
      <div class="row2">
        <div class="field"><label>Especie</label><select id="sp"></select></div>
        <div class="field"><label>Grado</label><select id="gr"></select></div>
      </div>
      <div class="row2">
        <div class="field"><label>Humedad de servicio H <span class="unit">[%]</span></label><input type="number" id="H" value="12" step="1" min="0"></div>
        <div class="field"><label>G / Ef <span class="unit">Anexo B</span></label><input type="number" id="Grat" value="0.065" step="0.005"></div>
      </div>
      <div class="row2 saw">
        <div class="field"><label>Fcn, Tabla U.10</label><select id="fcnG"></select></div>
        <div class="field"><label>Fcn usuario <span class="unit">[MPa]</span></label><input type="number" id="FcnU" value="2.5" step="0.1"></div>
      </div>
      <div class="glu">
        <div class="row2">
          <div class="field"><label>Láminas de</label><select id="glSp"><option value="pr" selected>Pino radiata</option><option value="ot">Otras especies</option></select></div>
          <div class="field"><label>Laminación</label><select id="glOr"><option value="h" selected>Horizontal</option><option value="v">Vertical</option></select></div>
        </div>
        <div class="row3">
          <div class="field"><label>Ff <span class="unit">[MPa]</span></label><input type="number" id="glFf" value="11.0" step="0.1"></div>
          <div class="field"><label>Ff eje débil</label><input type="number" id="glFfy" value="11.0" step="0.1"></div>
          <div class="field"><label>Fcz</label><input type="number" id="glFcz" value="1.1" step="0.05"></div>
        </div>
        <div class="row3">
          <div class="field"><label>Fcn</label><input type="number" id="glFcn" value="2.5" step="0.1"></div>
          <div class="field"><label>Ef</label><input type="number" id="glEf" value="10500" step="100"></div>
          <div class="field"><label>t lámina <span class="unit">[mm]</span></label><input type="number" id="tl" value="33" step="1"></div>
        </div>
      </div>
      <label class="chk saw"><input type="checkbox" id="rep">Trabajo conjunto, 3 o más piezas a 610 mm o menos, KC = 1.15</label>
      <label class="chk" style="margin-top:4px"><input type="checkbox" id="Ek">Flecha con Ef,k = 0.60·Ef, 6.2.3</label>

      <div class="section-title" style="margin-top:12px">Sección</div>
      <div class="field"><label>Escuadría</label><select id="secSrc"></select></div>
      <div class="row2" id="dimBox">
        <div class="field"><label>Espesor comercial</label><select id="dimE"></select></div>
        <div class="field"><label>Altura comercial</label><select id="dimA"></select></div>
      </div>
      <div class="row3">
        <div class="field"><label>Piezas n</label><input type="number" id="np" value="1" step="1" min="1"></div>
        <div class="field"><label>b pieza <span class="unit">[mm]</span></label><input type="number" id="b" value="41" step="1"></div>
        <div class="field"><label>h <span class="unit">[mm]</span></label><input type="number" id="h" value="185" step="1"></div>
      </div>
      <div class="row2">
        <div class="field"><label>Densidad <span class="unit">[kg/m³]</span></label><input type="number" id="dens" value="500" step="10"></div>
        <div class="field"><label class="chk" style="margin-top:20px"><input type="checkbox" id="sw" checked>Peso propio en D</label></div>
      </div>

      <div class="section-title" style="margin-top:12px">Apoyos y luces</div>
      <div class="field"><label>Esquema</label><select id="lay"><option value="ss" selected>Simplemente apoyada</option><option value="cant">Voladizo empotrado</option><option value="c2">Continua de dos tramos</option><option value="ov">Apoyada con voladizo</option></select></div>
      <div class="row2">
        <div class="field"><label id="Llab">Luz L <span class="unit">[m]</span></label><input type="number" id="L" value="3.6" step="0.1" min="0.1"></div>
        <div class="field" id="L2Box"><label id="L2lab">Luz L2 <span class="unit">[m]</span></label><input type="number" id="L2" value="3.6" step="0.1" min="0.05"></div>
      </div>
      <div class="row2" id="brgBox">
        <div class="field"><label>Largo de apoyo l <span class="unit">[mm]</span></label><input type="number" id="lb" value="90" step="5"></div>
        <div class="field"><label>Extremo tras apoyo s <span class="unit">[mm]</span></label><input type="number" id="sEnd" value="0" step="10"></div>
      </div>
      <label class="chk" id="redBox"><input type="checkbox" id="redV" checked>Corte sin cargas a h del borde de apoyo, 8.2.3.2</label>

      <div class="section-title" style="margin-top:12px">Apoyo lateral</div>
      <div class="row2">
        <div class="field"><label>Borde superior</label><select id="brT"><option value="sup">Solo en apoyos</option><option value="esp">Espaciado</option><option value="cont" selected>Continuo</option></select></div>
        <div class="field"><label>Espaciamiento <span class="unit">[m]</span></label><input type="number" id="sT" value="0.6" step="0.1"></div>
      </div>
      <div class="row2">
        <div class="field"><label>Borde inferior</label><select id="brB"><option value="sup" selected>Solo en apoyos</option><option value="esp">Espaciado</option></select></div>
        <div class="field"><label>Espaciamiento <span class="unit">[m]</span></label><input type="number" id="sB" value="1.2" step="0.1"></div>
      </div>
      <label class="chk" style="margin-bottom:8px"><input type="checkbox" id="lat5">Cumple disposiciones de 8.2.2.5.2, Kλv = 1</label>
      <div class="field"><label>Caso lv, Tabla 5</label><select id="lvCase"><option value="auto" selected>Automático</option><option value="u">Carga uniforme</option><option value="pc">Carga concentrada central o en extremo libre</option><option value="pcb">Carga central con apoyo lateral en el centro</option><option value="gen">Otras condiciones</option></select></div>

      <div class="section-title" style="margin-top:12px">Pendiente de techo</div>
      <div class="row3">
        <div class="field"><label>α <span class="unit">[°]</span></label><input type="number" id="alpha" value="0" step="1" min="0" max="60"></div>
        <div class="field"><label>Eje débil</label><select id="wkAx"><option value="free" selected>Flexión desviada</option><option value="sh">Lo toma la cubierta</option></select></div>
        <div class="field"><label>Tensores</label><select id="tens"><option value="0" selected>Sin tensores</option><option value="1">Al centro</option><option value="2">A los tercios</option></select></div>
      </div>

      <div class="section-title" style="margin-top:12px">Cargas de servicio</div>
      <div class="row3" style="grid-template-columns:28px 1fr 1.7fr;font-size:12px;margin-bottom:3px"><div></div><div>q <span class="unit">[kN/m]</span></div><div>KD, Anexo G</div></div>
      <div class="row3" style="grid-template-columns:28px 1fr 1.7fr;align-items:center"><div style="font-size:12px;font-weight:700">D</div><div class="field"><input type="number" id="qD" value="0.30" step="0.05"></div><div class="field"><select id="kdD"></select></div></div>
      <div class="row3" style="grid-template-columns:28px 1fr 1.7fr;align-items:center"><div style="font-size:12px;font-weight:700">L</div><div class="field"><input type="number" id="qL" value="0" step="0.05"></div><div class="field"><select id="kdL"></select></div></div>
      <div class="row3" style="grid-template-columns:28px 1fr 1.7fr;align-items:center"><div style="font-size:12px;font-weight:700">Lr</div><div class="field"><input type="number" id="qLr" value="0.60" step="0.05"></div><div class="field"><select id="kdLr"></select></div></div>
      <div class="row3" style="grid-template-columns:28px 1fr 1.7fr;align-items:center"><div style="font-size:12px;font-weight:700">S</div><div class="field"><input type="number" id="qS" value="0" step="0.05"></div><div class="field"><select id="kdS"></select></div></div>
      <div class="row3" style="grid-template-columns:28px 1fr 1.7fr;align-items:center"><div style="font-size:12px;font-weight:700">W</div><div class="field"><input type="number" id="qW" value="0" step="0.05"></div><div class="field"><select id="kdW"></select></div></div>
      <div class="row3" style="margin-top:8px">
        <div class="field"><label>P <span class="unit">[kN]</span></label><input type="number" id="P" value="0" step="0.1"></div>
        <div class="field"><label>Tipo</label><select id="Pcat"><option value="D">D</option><option value="L">L</option><option value="Lr">Lr</option><option value="S">S</option><option value="M" selected>Mantención 8.2.1.4</option></select></div>
        <div class="field"><label>x desde izq. <span class="unit">[m]</span></label><input type="number" id="xP" value="1.8" step="0.1"></div>
      </div>
      <div class="row2">
        <div class="field" id="kdPBox"><label>KD mantención</label><select id="kdP"></select></div>
        <div class="field"><label class="chk" style="margin-top:20px"><input type="checkbox" id="Pw">Posición más desfavorable</label></div>
      </div>
      <label class="chk" id="pattBox"><input type="checkbox" id="patt" checked>Alternancia de L, Lr y S por tramo</label>

      <div class="section-title" style="margin-top:12px">Deformaciones</div>
      <div class="field"><label>Uso, Tabla 6</label><select id="duse"></select></div>
      <div class="row2" id="duBox">
        <div class="field"><label>Sobrecarga L /</label><input type="number" id="dLv" value="360" step="10"></div>
        <div class="field"><label>Total L /</label><input type="number" id="dLt" value="240" step="10"></div>
      </div>
      <div id="vibBox">
        <label class="chk"><input type="checkbox" id="vib">Vibraciones de piso, 8.2.4.13</label>
        <div class="row2" style="margin-top:6px">
          <div class="field"><label>Separación vigas s <span class="unit">[m]</span></label><input type="number" id="vs" value="0.4" step="0.05"></div>
          <div class="field"><label>Ancho del piso B <span class="unit">[m]</span></label><input type="number" id="vB" value="4.0" step="0.1"></div>
        </div>
        <div class="row2">
          <div class="field"><label>(EI)tran <span class="unit">[kN·m²/m]</span></label><input type="number" id="vEIt" value="5" step="1"></div>
          <div class="field"><label>Fracción de L en masa <span class="unit">[%]</span></label><input type="number" id="vPsi" value="25" step="5"></div>
        </div>
      </div>

      <div class="section-title" style="margin-top:12px">Rebaje en apoyos extremos, 8.7</div>
      <div class="row2">
        <div class="field"><label>Rebaje</label><select id="nt"><option value="no" selected>Sin rebaje</option><option value="inf">Lado del apoyo, inferior</option><option value="sup">Lado opuesto, superior</option></select></div>
        <div class="field"><label>hr <span class="unit">[mm]</span></label><input type="number" id="hr" value="140" step="5"></div>
      </div>
      <div class="row2">
        <div class="field"><label>x reacción a vértice <span class="unit">[mm]</span></label><input type="number" id="nx" value="60" step="5"></div>
        <div class="field"><label>i = 1/tan β</label><input type="number" id="ni" value="0" step="0.5" min="0"></div>
      </div>
    </div>
    <div class="panel">
      <div class="note" id="notes"></div>
    </div>
  </div>
  <div>
    <div class="stat-row" id="stats"></div>
    <div id="warns"></div>
    <div class="chartwrap"><div class="toolbar" id="v3bar"></div><canvas id="v3" style="width:100%;height:460px;display:block"></canvas></div>
    <div class="chartwrap"><svg id="bmSvg" viewBox="0 0 1300 660" width="100%" style="display:block;height:auto"></svg></div>
    <div class="chartwrap">
      <div class="ctrls">
        <div class="field"><label>Gráfico</label><select id="cy"><option value="M" selected>Momento Mx</option><option value="V">Corte Vx</option><option value="d">Deformada</option><option value="r">Razón vs luz</option></select></div>
      </div>
      <svg id="chSvg" viewBox="0 0 760 380" width="100%" style="display:block;height:auto"></svg>
    </div>
    <div class="panel"><div class="section-title">Verificaciones</div><div class="tablewrap"><table id="tbChk"></table></div></div>
    <div class="panel"><div class="section-title">Cálculo</div><div class="tablewrap"><table id="tbDet"></table></div></div>
  </div>
</div>

<script>
const svgNS='http://www.w3.org/2000/svg';
function el(tag,attrs){ const n=document.createElementNS(svgNS,tag); for(const k in attrs) n.setAttribute(k,attrs[k]); return n; }
function tx(x,y,s,o){ const t=el('text',Object.assign({x,y,'font-size':11,'text-anchor':'middle',fill:'#000'},o||{})); t.textContent=s; return t; }
function niceStep(range,count){ const raw=Math.max(range,1e-12)/count, m=Math.pow(10,Math.floor(Math.log10(raw))), f=raw/m; return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*m; }
function fmtTick(v,st){ const d=st>=1?0:Math.min(6,Math.ceil(-Math.log10(st))); return (Math.abs(v)<st*1e-6?0:v).toFixed(d); }
const fmt=(x,d)=>isFinite(x)?x.toFixed(d):'-';
const fmtk=x=>isFinite(x)?String(Math.round(x)):'-';
const FAIL='#b3261e';

function chart(svg,cfg){
  svg.innerHTML='';
  const W=760,H=cfg.H||420,L=70,R=18,T=16,B=46;
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
  const xs=[],ys=[];
  cfg.series.forEach(s=>s.pts.forEach(p=>{ if(isFinite(p[0])&&isFinite(p[1])){ xs.push(p[0]); ys.push(p[1]); } }));
  (cfg.points||[]).forEach(p=>{ xs.push(p.x); ys.push(p.y); });
  if(!xs.length){ svg.appendChild(tx(W/2,H/2,'Sin datos')); return; }
  let x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
  if(cfg.zeroX){ x0=Math.min(x0,0); x1=Math.max(x1,0); } if(cfg.zeroY){ y0=Math.min(y0,0); y1=Math.max(y1,0); }
  if(cfg.equal){ const c=(x0+x1)/2, d=(y0+y1)/2, h=Math.max(x1-x0,(y1-y0)*(W-L-R)/(H-T-B))/2; x0=c-h; x1=c+h; const hv=h*(H-T-B)/(W-L-R); y0=d-hv; y1=d+hv; }
  const px=(x1-x0)*0.06||1, py=(y1-y0)*0.08||1; x0-=px; x1+=px; y0-=py; y1+=py;
