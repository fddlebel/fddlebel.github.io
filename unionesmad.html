<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Uniones en madera | fddlebel</title>
<style>
:root{
  --paper:#ffffff;--panel:#ffffff;--ink:#000000;--line:#9a9a9a;--line-strong:#7a7a7a;
  --accent:#000000;--accent-soft:#e9e9e9;--grid:#d9d9d9;--conc:#c0c0c0;--conc-dark:#a8a8a8;
  --fail:#b3261e;--focus:#4a4d24;
  --sans:'Arial Narrow',Arial,Helvetica,sans-serif;
}
*{box-sizing:border-box;}
[hidden]{display:none!important;}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);padding-block:20px 48px;padding-inline:max(16px,calc((100vw - 1400px)/2));}
h1{font-size:22px;font-weight:700;margin:0;}
.app-header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px;}
.clause{font-size:12px;}
.btn{font-family:var(--sans);font-weight:700;font-size:13px;color:#fff;background:var(--accent);border:1px solid var(--accent);border-radius:4px;padding:7px 14px;cursor:pointer;}
.btn.sec{background:var(--panel);color:var(--ink);border-color:var(--line-strong);}
.grid{display:grid;grid-template-columns:320px minmax(0,1fr);gap:16px;align-items:start;}
@media (max-width:900px){.grid{grid-template-columns:1fr;}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:14px;}
.panel+.panel{margin-top:12px;}
.section-title{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;margin:0 0 10px;}
.field{margin-bottom:9px;min-width:0;}
.field label{display:block;font-size:12px;margin-bottom:3px;}
.unit{opacity:.75;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
input[type=number],input[type=text],select,textarea{width:100%;font-family:var(--sans);font-size:13px;color:var(--ink);background:#fff;border:1px solid var(--line-strong);border-radius:4px;padding:6px 7px;font-variant-numeric:tabular-nums;}
textarea{font-size:12px;resize:vertical;}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--focus);outline-offset:1px;}
details summary{cursor:pointer;font-size:13px;font-weight:700;margin-top:4px;user-select:none;}
details[open] summary{margin-bottom:8px;}
.chk{display:flex;align-items:center;gap:6px;font-size:12px;}
.chk input{width:auto;margin:0;}
.toolbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px;}
.tool{font-family:var(--sans);font-size:12.5px;font-weight:700;background:var(--panel);color:var(--ink);border:1px solid var(--line-strong);border-radius:4px;padding:6px 10px;cursor:pointer;}
.tool.active{background:var(--accent);color:#fff;border-color:var(--accent);}
.toolbar select{width:auto;}
.toolbar .sep{width:1px;height:24px;background:var(--line);margin:0 4px;}
#gridWrap{position:relative;border:1px solid var(--line);border-radius:4px;overflow:auto;max-height:560px;background:#fff;}
#gridCanvas{display:block;cursor:crosshair;touch-action:none;}
#gridInfo{font-size:12px;margin-top:6px;min-height:16px;}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 10px;}
.tabs button{font-family:var(--sans);font-weight:700;font-size:13px;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:7px 14px;cursor:pointer;}
.tabs button.active{background:var(--accent);color:#fff;border-color:var(--accent);}
.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-bottom:12px;}
.stat{border:1px solid var(--line);border-radius:4px;padding:8px 10px;}
.stat .k{font-size:11px;text-transform:uppercase;letter-spacing:.04em;}
.stat .v{font-size:16px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums;}
table{width:100%;border-collapse:collapse;font-size:12.5px;}
th,td{text-align:left;padding:5px 8px;border:1px solid var(--line);font-variant-numeric:tabular-nums;}
th{font-size:11px;font-weight:700;background:var(--accent-soft);}
td.num,th.num{text-align:right;}
tr.fail td{color:var(--fail);font-weight:700;}
.tablewrap{overflow-x:auto;}
.chartwrap{border:1px solid var(--line);border-radius:4px;padding:10px;margin-bottom:12px;}
.ctrls{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin-bottom:10px;}
.ctrls .field{margin:0;width:150px;}
#glWrap{position:relative;border:1px solid var(--line);border-radius:4px;overflow:hidden;background:#fff;}
#glCanvas{display:block;width:100%;height:560px;cursor:grab;touch-action:none;}
#glLabels{position:absolute;inset:0;pointer-events:none;font-size:11px;}
#glLabels span{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;}
.note{font-size:11.5px;line-height:1.5;}
.warn{background:var(--accent-soft);border:1px solid var(--line-strong);border-radius:4px;padding:7px 10px;font-size:12px;margin-bottom:10px;}
#busy{font-size:12px;margin-left:8px;}
svg text{font-family:var(--sans);}
#printReport{display:none;}
.rpt-header{margin-bottom:12px;}
.rpt-header h1{font-size:20px;}
.rpt-sub{font-size:11.5px;margin-top:2px;}
.rpt-params{width:100%;border-collapse:collapse;margin-bottom:14px;font-size:11px;}
.rpt-params td{border:1px solid var(--line);padding:4px 7px;}
.rpt-params td.k{font-weight:700;width:22%;background:var(--accent-soft);}
.rpt-section{margin-bottom:16px;page-break-inside:avoid;break-inside:avoid;}
.rpt-section h2{font-size:14px;font-weight:700;margin:0 0 8px;border-bottom:1px solid var(--line);padding-bottom:4px;break-after:avoid;}
.rpt-section.allow-break{page-break-inside:auto;break-inside:auto;}
.rpt-foot{font-size:10px;margin-top:14px;border-top:1px solid var(--line);padding-top:6px;}
.rpt-small{font-size:10px;}
.rpt-small td,.rpt-small th{padding:2px 5px;}
@media print{
  body *{visibility:hidden;}
  #printReport,#printReport *{visibility:visible;}
  #printReport{display:block;position:absolute;left:0;top:0;width:100%;}
  @page{margin:12mm;}
}
@media print{.grid,.app-header{display:none!important;}}
input[type=range]{width:100%;margin:0;accent-color:#000;}
input:disabled,select:disabled{background:#f2f2f2;color:#777;}
</style>
</head>
<body>
<div class="app-header">
  <h1><a href="index.html" style="color:inherit;text-decoration:none;font-weight:400;">fddlebel</a> / Uniones en madera</h1>
  <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
    <div class="clause" id="clause">NCh1198:2024 cláusula 10</div>
    <button class="btn sec" id="saveBtn">Guardar proyecto</button>
    <button class="btn sec" id="loadBtn">Abrir proyecto</button>
    <input type="file" id="loadFile" accept=".json" hidden>
    <button class="btn" id="pdfBtn">Exportar PDF</button>
  </div>
</div>

<div id="printReport"></div>

<div class="grid">
  <div>
    <div class="panel">
      <div class="field"><label>Proyecto / unión</label><input type="text" id="proj" value=""></div>

      <div class="section-title" style="margin-top:12px">Medio de unión</div>
      <div class="row2">
        <div class="field"><label>Tipo</label><select id="ftype"><option value="clavo">Clavo</option><option value="tornillo">Tornillo</option><option value="perno" selected>Perno</option><option value="pasador">Pasador</option><option value="tirafondo">Tirafondo</option></select></div>
        <div class="field"><label>Medida</label><select id="fsz"></select></div>
      </div>
      <div class="row2" id="lenBox">
        <div class="field"><label>Largo</label><select id="flen"></select></div>
        <div class="field"></div>
      </div>
      <div class="row3">
        <div class="field"><label>D <span class="unit">[mm]</span></label><input type="number" id="D" value="16" step="0.1"></div>
        <div class="field fL"><label>L <span class="unit">[mm]</span></label><input type="number" id="L" value="100" step="1"></div>
        <div class="field fDr"><label>Dr <span class="unit">[mm]</span></label><input type="number" id="Dr" value="9.4" step="0.1"></div>
      </div>
      <div class="row3">
        <div class="field fK"><label>Punta k <span class="unit">[mm]</span></label><input type="number" id="kp" value="0" step="0.5"></div>
        <div class="field fR"><label>Rosca r <span class="unit">[mm]</span></label><input type="number" id="rth" value="57" step="1"></div>
        <div class="field"><label>Fff <span class="unit">[MPa]</span></label><input type="number" id="Fff" value="" placeholder="auto" step="10"></div>
      </div>
      <label class="chk fN"><input type="checkbox" id="npg">Clavado con perforación guía</label>

      <div class="section-title" style="margin-top:12px">Configuración</div>
      <div class="row2">
        <div class="field"><label>Cizalle</label><select id="cfg"><option value="s">Simple, A y B</option><option value="dA" selected>Doble, A central</option><option value="dB">Doble, B central</option></select></div>
        <div class="field"><label>Pieza B</label><select id="bmat"><option value="m" selected>Madera</option><option value="a">Placa de acero</option></select></div>
      </div>
      <div class="row2">
        <div class="field"><label>Unión</label><select id="jt"><option value="t" selected>Traccionada</option><option value="c">Comprimida</option></select></div>
        <div class="field fN"><label>Exponente m, 10.6.4.3</label><select id="mex"><option value="1" selected>1.0</option><option value="1.5">1.5, costaneras</option></select></div>
      </div>

      <div class="section-title" style="margin-top:12px">Pieza A, horizontal</div>
      <div class="row2">
        <div class="field"><label>Especie</label><select id="spA"></select></div>
        <div class="field"><label>Grado</label><select id="grA"></select></div>
      </div>
      <div class="row3">
        <div class="field"><label>Densidad, Tabla E.1</label><select id="rhoA"></select></div>
        <div class="field"><label>ρ0 <span class="unit">[kg/m³]</span></label><input type="number" id="r0A" value="450" step="5"></div>
        <div class="field"><label>ρ0,k <span class="unit">[kg/m³]</span></label><input type="number" id="r0kA" value="370" step="5"></div>
      </div>
      <div class="row3">
        <div class="field"><label>Espesor eA</label><input type="number" id="tA" value="69" step="1"></div>
        <div class="field"><label>Altura hA</label><input type="number" id="hA" value="190" step="5"></div>
        <div class="field"><label>θA carga-fibra <span class="unit">[°]</span></label><input type="number" id="thA" value="0" step="5" min="0" max="90"></div>
      </div>
      <div class="row3">
        <div class="field"><label>Extremo</label><select id="endA"><option value="c">Continua</option><option value="e" selected>Extremo</option></select></div>
        <div class="field"><label>Dist. extremo</label><input type="number" id="eA" value="115" step="5"></div>
        <div class="field"><label>Desplaz. grupo</label><input type="number" id="yoff" value="0" step="5"></div>
      </div>
      <div class="row2">
        <div class="field"><label>N en A <span class="unit">[kN]</span></label><input type="number" id="NA" value="" placeholder="auto" step="1"></div>
        <div class="field"></div>
      </div>

      <div class="section-title" style="margin-top:12px">Pieza B</div>
      <div class="bW">
        <div class="row2">
          <div class="field"><label>Especie</label><select id="spB"></select></div>
          <div class="field"><label>Grado</label><select id="grB"></select></div>
        </div>
        <div class="row3">
          <div class="field"><label>Densidad, Tabla E.1</label><select id="rhoB"></select></div>
          <div class="field"><label>ρ0 <span class="unit">[kg/m³]</span></label><input type="number" id="r0B" value="450" step="5"></div>
          <div class="field"><label>ρ0,k <span class="unit">[kg/m³]</span></label><input type="number" id="r0kB" value="370" step="5"></div>
        </div>
      </div>
      <div class="row2 bS">
        <div class="field"><label>fy placa <span class="unit">[MPa]</span></label><input type="number" id="fyP" value="270" step="5"></div>
        <div class="field"><label>fu placa <span class="unit">[MPa]</span></label><input type="number" id="fuP" value="410" step="5"></div>
      </div>
      <div class="row3">
        <div class="field"><label>Espesor eB</label><input type="number" id="tB" value="45" step="1"></div>
        <div class="field"><label>Ancho hB</label><input type="number" id="hB" value="190" step="5"></div>
        <div class="field bW"><label>θB carga-fibra <span class="unit">[°]</span></label><input type="number" id="thB" value="0" step="5" min="0" max="90"></div>
      </div>
      <div class="row2">
        <div class="field"><label>Dist. extremo</label><input type="number" id="eB" value="115" step="5"></div>
        <div class="field"><label>N en B <span class="unit">[kN]</span></label><input type="number" id="NB" value="" placeholder="auto" step="1"></div>
      </div>

      <div class="section-title" style="margin-top:12px">Disposición</div>
      <div class="row2">
        <div class="field"><label>Columnas, según fibra A</label><input type="number" id="nc" value="3" step="1" min="1"></div>
        <div class="field"><label>Paso s1</label><input type="number" id="s1" value="80" step="5"></div>
      </div>
      <div class="row2">
        <div class="field"><label>Filas</label><input type="number" id="nr" value="2" step="1" min="1"></div>
        <div class="field"><label>Paso s2</label><input type="number" id="s2" value="70" step="5"></div>
      </div>

      <div class="section-title" style="margin-top:12px">Factores</div>
      <div class="row2">
        <div class="field"><label>Duración de carga KD</label><select id="kd"></select></div>
        <div class="field"><label>Temperatura KUT</label><select id="tmp"><option value="a" selected>T ≤ 38 °C</option><option value="b">38 a 52 °C</option><option value="c">52 a 67 °C</option></select></div>
      </div>
      <div class="row2">
        <div class="field"><label>H servicio <span class="unit">[%]</span></label><input type="number" id="H" value="12" step="1"></div>
        <div class="field"><label>H en fabricación</label><select id="Hf"><option value="s" selected>≤ 19 %</option><option value="h">&gt; 19 %</option></select></div>
      </div>
      <div class="row2">
        <div class="field"><label>Fracción de corte Q</label><input type="number" id="qf" value="1" step="0.1"></div>
        <div class="field"></div>
      </div>
      <label class="chk"><input type="checkbox" id="kce">Eje paralelo a la fibra en A, Kce</label>

      <div class="section-title" style="margin-top:12px">Cargas</div>
      <div class="row2">
        <div class="field"><label>P lateral <span class="unit">[kN]</span></label><input type="number" id="P" value="30" step="1"></div>
        <div class="field"><label>N extracción <span class="unit">[kN]</span></label><input type="number" id="Nax" value="0" step="0.5"></div>
      </div>
    </div>
    <div class="panel">
      <div class="note" id="notes"></div>
    </div>
  </div>
  <div>
    <div class="stat-row" id="stats"></div>
    <div id="warns"></div>
    <div class="chartwrap"><div class="toolbar" id="v3bar"></div><canvas id="v3" style="width:100%;height:460px;display:block"></canvas></div>
    <div class="chartwrap"><svg id="shSvg" viewBox="0 0 1300 660" width="100%" style="display:block;height:auto"></svg></div>
    <div class="chartwrap">
      <div class="ctrls">
        <div class="field"><label>Barrido</label><select id="xv"><option value="tA" selected>Espesor eA</option><option value="tB">Espesor eB</option><option value="thA">Ángulo θA</option></select></div>
      </div>
      <svg id="chSvg" viewBox="0 0 760 380" width="100%" style="display:block;height:auto"></svg>
    </div>
    <div class="panel"><div class="section-title">Verificaciones</div><div class="tablewrap"><table id="tbChk"></table></div></div>
    <div class="panel"><div class="section-title">Cálculo</div><div class="tablewrap"><table id="tbDet"></table></div></div>
  </div>
</div>

<script>
const svgNS='http://www.w3.org/2000/svg';
function el(tag,attrs){ const n=document.createElementNS(svgNS,tag); for(const k in attrs) n.setAttribute(k,attrs[k]); return n; }
function tx(x,y,s,o){ const t=el('text',Object.assign({x,y,'font-size':11,'text-anchor':'middle',fill:'#000'},o||{})); t.textContent=s; return t; }
function niceStep(range,count){ const raw=Math.max(range,1e-12)/count, m=Math.pow(10,Math.floor(Math.log10(raw))), f=raw/m; return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*m; }
function fmtTick(v,st){ const d=st>=1?0:Math.min(6,Math.ceil(-Math.log10(st))); return (Math.abs(v)<st*1e-6?0:v).toFixed(d); }
const fmt=(x,d)=>isFinite(x)?x.toFixed(d):'-';
const fmtk=x=>isFinite(x)?String(Math.round(x)):'-';
const FAIL='#b3261e';

function chart(svg,cfg){
  svg.innerHTML='';
  const W=760,H=cfg.H||420,L=70,R=18,T=16,B=46;
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
  const xs=[],ys=[];
  cfg.series.forEach(s=>s.pts.forEach(p=>{ if(isFinite(p[0])&&isFinite(p[1])){ xs.push(p[0]); ys.push(p[1]); } }));
  (cfg.points||[]).forEach(p=>{ xs.push(p.x); ys.push(p.y); });
  if(!xs.length){ svg.appendChild(tx(W/2,H/2,'Sin datos')); return; }
  let x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
  if(cfg.zeroX){ x0=Math.min(x0,0); x1=Math.max(x1,0); } if(cfg.zeroY){ y0=Math.min(y0,0); y1=Math.max(y1,0); }
  if(cfg.equal){ const c=(x0+x1)/2, d=(y0+y1)/2, h=Math.max(x1-x0,(y1-y0)*(W-L-R)/(H-T-B))/2; x0=c-h; x1=c+h; const hv=h*(H-T-B)/(W-L-R); y0=d-hv; y1=d+hv; }
  const px=(x1-x0)*0.06||1, py=(y1-y0)*0.08||1; x0-=px; x1+=px; y0-=py; y1+=py;
  const sx=niceStep(x1-x0,8), sy=niceStep(y1-y0,7);
  x0=Math.floor(x0/sx)*sx; x1=Math.ceil(x1/sx)*sx; y0=Math.floor(y0/sy)*sy; y1=Math.ceil(y1/sy)*sy;
  if(cfg.xfix){ x0=cfg.xfix[0]; x1=cfg.xfix[1]; } const sxx=cfg.xstep||sx;
  const X=x=>L+(x-x0)/(x1-x0)*(W-L-R), Y=y=>H-B-(y-y0)/(y1-y0)*(H-T-B);
  const g=el('g',{});
  for(let y=y0;y<=y1+sy*1e-6;y+=sy){ g.appendChild(el('line',{x1:L,x2:W-R,y1:Y(y),y2:Y(y),stroke:'#dcdcdc','stroke-width':0.6})); g.appendChild(tx(L-6,Y(y)+4,fmtTick(y,sy),{'text-anchor':'end'})); }
  for(let x=Math.ceil(x0/sxx-1e-9)*sxx;x<=x1+sxx*1e-6;x+=sxx){ g.appendChild(el('line',{x1:X(x),x2:X(x),y1:T,y2:H-B,stroke:'#dcdcdc','stroke-width':0.6})); g.appendChild(tx(X(x),H-B+15,fmtTick(x,sxx))); }
  svg.appendChild(g);
  if(x0<0&&x1>0) svg.appendChild(el('line',{x1:X(0),x2:X(0),y1:T,y2:H-B,stroke:'#555','stroke-width':0.9}));
  if(y0<0&&y1>0) svg.appendChild(el('line',{x1:L,x2:W-R,y1:Y(0),y2:Y(0),stroke:'#555','stroke-width':0.9}));
  svg.appendChild(el('rect',{x:L,y:T,width:W-L-R,height:H-T-B,fill:'none',stroke:'#7a7a7a','stroke-width':1}));
  svg.appendChild(tx((L+W-R)/2,H-8,cfg.xlabel,{'font-weight':700}));
  const yl=tx(14,(T+H-B)/2,cfg.ylabel,{'font-weight':700}); yl.setAttribute('transform',`rotate(-90 14 ${(T+H-B)/2})`); svg.appendChild(yl);
  const clipId='c'+Math.random().toString(36).slice(2);
  const cp=el('clipPath',{id:clipId}); cp.appendChild(el('rect',{x:L,y:T,width:W-L-R,height:H-T-B})); svg.appendChild(cp);
  const gc=el('g',{'clip-path':`url(#${clipId})`});
  cfg.series.forEach(s=>{
    const d=s.pts.filter(p=>isFinite(p[0])&&isFinite(p[1])).map((p,i)=>(i?'L':'M')+X(p[0]).toFixed(1)+','+Y(p[1]).toFixed(1)).join(' ')+(s.close?'Z':'');
    gc.appendChild(el('path',{d,fill:'none',stroke:s.color||'#000','stroke-width':s.w||1.4,'stroke-dasharray':s.dash||'none','stroke-linejoin':'round'}));
  });
  (cfg.points||[]).forEach(p=>{
    const col=p.fail?FAIL:'#000';
    if(p.ring) gc.appendChild(el('circle',{cx:X(p.x),cy:Y(p.y),r:3.5,fill:'#fff',stroke:col,'stroke-width':1.4}));
    else gc.appendChild(el('circle',{cx:X(p.x),cy:Y(p.y),r:3.2,fill:col}));
    if(p.label) gc.appendChild(tx(X(p.x)+6,Y(p.y)-6,p.label,{'text-anchor':'start','font-size':10.5,'font-weight':700,fill:col}));
  });
  svg.appendChild(gc);
  const named=cfg.series.filter(s=>s.name);
  if(named.length){
    const lx=cfg.legendRight?W-R-220:L+12; let ly=T+16;

  const xc=Math.max(...g.xs), ys=g.ys, yA0=-P.yoff-P.hA/2, yA1=-P.yoff+P.hA/2, vr0=Math.min(yA0,Math.min(...ys))-0.45*P.hA, vr1=Math.max(yA1,Math.max(...ys))+0.45*P.hA;
  const bi=bOnLine(g,P,xc), bI=bi?[Math.max(bi[0],vr0),Math.min(bi[1],vr1)]:null, fp=fprof(R), hs=fp.fp+fp.bk, s2=Math.min(300/hs,380/(vr1-vr0),6), mid=(vr0+vr1)/2;
  const U=w=>ox-hs/2*s2+(fp.fp+w)*s2, V=y=>300-(y-mid)*s2;
  let top=Infinity, bot=-Infinity;
  st.ly.forEach(q=>{ const iv=q.p==='A'?[yA0,yA1]:bI; if(!iv||iv[1]<=iv[0]) return; const k=q.p==='A'?'tA hA':'tB hB bmat', wd=q.p==='A'||P.bmat==='m';
    K.rc(U(q.w0),V(iv[1]),q.t*s2,(iv[1]-iv[0])*s2,'cut',K.H(wd?'sw':'st2'),{k}); top=Math.min(top,V(iv[1])); bot=Math.max(bot,V(iv[0]));
    if(q.p==='B'&&bi){ if(bi[1]>vr1) K.brk(U(q.w0),V(iv[1]),U(q.w1),V(iv[1])); if(bi[0]<vr0) K.brk(U(q.w0),V(iv[0]),U(q.w1),V(iv[0])); }
    let by=(iv[0]+iv[1])/2, bd=-1; for(let i=0;i<=24;i++){ const y=iv[0]+(iv[1]-iv[0])*(0.06+0.88*i/24), d=Math.min(...ys.map(v=>Math.abs(v-y)-(fp.wd||F.dc||F.hc||Dn)/2)); if(d>bd){ bd=d; by=y; } }
    K.t(U((q.w0+q.w1)/2),V(by)+4,q.p,{b:true,s:13,k}); });
  const kf='D fsz ftype flen L';
  ys.forEach(y=>{ const yy=V(y), r=Dn/2*s2, rc=(w0,w1,hw)=>K.rc(U(w0),yy-hw*s2,(w1-w0)*s2,2*hw*s2,'vis','#fff',{k:kf});
    if(t==='perno'){ rc(-fp.fp,T+fp.tw+1.1*Dn,Dn/2); rc(-fp.tw,0,fp.wd/2); rc(T,T+fp.tw,fp.wd/2); rc(-fp.fp,-fp.tw,0.75*Dn); rc(T+fp.tw,T+fp.tw+0.8*Dn,0.75*Dn); }
    else if(t==='pasador') rc(0,T,Dn/2);

    else if(t==='tornillo'){ const dp=Math.max(0,(F.hc-Dn)/2); rc(dp,F.L,Dn/2); K.pl([[U(0),yy-F.hc/2*s2],[U(0),yy+F.hc/2*s2],[U(dp),yy+Dn/2*s2],[U(dp),yy-Dn/2*s2]],'vis','#fff',{k:kf}); }
    else { rc(0,F.L,Dn/2); rc(-fp.tw,0,fp.wd/2); rc(-fp.fp,-fp.tw,F.hc/2); }
    if(t==='tornillo'||t==='tirafondo'){ const w0=F.L-F.r; [1,-1].forEach(sd=>K.ln(U(w0),yy+sd*F.Dr/2*s2,U(F.L),yy+sd*F.Dr/2*s2,'thin',{k:'Dr rth'})); }
    K.cl(U(-fp.fp)-4,yy,U(fp.bk)+4,yy); });

  planes.forEach(w=>K.ln(U(w),top-30,U(w),bot+12,'phan',{k:'cfg'}));
  const lx=U(-fp.fp)-40, ly=top-46; planes.forEach((w,i)=>{ K.ln(U(w),top-28,lx,ly,'thin',{k:'cfg'}); K.ah(U(w),top-28,Math.atan2(top-28-ly,U(w)-lx),{k:'cfg'},8,2.4); });
  K.ln(lx,ly,lx-12,ly,'thin',{k:'cfg'}); K.t(lx-15,ly+4,planes.length>1?'PLANOS DE CORTE':'PLANO DE CORTE',{a:'end',s:11.5,k:'cfg'});

  st.ly.forEach((q,i)=>{ if(thin[i]) K.t(U((q.w0+q.w1)/2),bot+42,fq(q.t),{s:11.5,k:q.p==='A'?'tA':'tB'}); });
  if(F.L&&(t==='clavo'||t==='tornillo'||t==='tirafondo')){ K.dh(U(0),U(F.L),bot+4,bot+4,bot+62,'L = '+fq(F.L),{k:'L flen fsz'}); const p=R.Lc.p, w=F.L-p; if(p>0) K.dh(U(w),U(F.L),bot+4,bot+4,bot+86,'p = '+fq(p),{k:'L flen'}); }
  K.dv(V(yA0),V(yA1),U(fp.bk),U(fp.bk),U(fp.bk)+24,fq(P.hA),{k:'hA'});
  if(P.Nax>0){ const yy=V(0); K.force(U(-fp.fp)-14-60,yy-22,-1,0,60,`N = ${f1(P.Nax,1)} kN`,{at:'tip',k:'Nax'}); }

}
function scene(R){
  const P=R.P, g=R.geo, F=R.F, t=F.t, Dn=F.D, st=g.st, T=st.T, ms=[], lb=[], Lv=lvOf(P,g), xs=g.xs, xmin=Math.min(...xs), xmax=Math.max(...xs);
  const yA0=-P.yoff-P.hA/2, yA1=-P.yoff+P.hA/2, xlo=xmin-Lv, xhi=P.endA==='e'?g.MA.end.xi:xmax+Lv, tE=g.MB.end.xi, tF=Math.max(...g.xiB)+Lv;
  const LB=(xi,et)=>[xi*g.gB[0]+et*g.nB[0],xi*g.gB[1]+et*g.nB[1]], bC=[LB(tE,-P.hB/2),LB(tF,-P.hB/2),LB(tF,P.hB/2),LB(tE,P.hB/2)], aC=[[xlo,yA0],[xhi,yA0],[xhi,yA1],[xlo,yA1]];
  const xf=T/2, Wp=(p,xw)=>[xw,p[0],p[1]], kA='tA hA spA grA endA eA yoff thA', kB='tB hB spB grB eB thB bmat', kf='D fsz ftype flen L nc nr s1 s2';
  st.ly.forEach(q=>{ const isA=q.p==='A'; ms.push(M3.key(M3.ext(isA?aC:bC,[xf-q.w1,0,0],[1,0,0],[0,1,0],[0,0,1],q.t,isA||P.bmat==='m'?COL.wood:COL.steel2),isA?kA:kB)); });
  const cyl=(x0,x1,y,z,r,c,n)=>M3.key(M3.along(M3.cyl(0,0,0,x1-x0,r,c,n||14),[x0,y,z],[1,0,0]),kf), hex=(x0,x1,y,z,s,c)=>M3.key(M3.along(M3.hex(0,0,0,x1-x0,s,c),[x0,y,z],[1,0,0]),kf), fp=fprof(R);
  g.pts.forEach(p=>{ const y=p.x, z=p.y;
    if(t==='perno'){ ms.push(cyl(xf-T-fp.tw-1.1*Dn,xf+fp.fp,y,z,Dn/2,COL.rod),cyl(xf,xf+fp.tw,y,z,fp.wd/2,COL.steel2,20),cyl(xf-T-fp.tw,xf-T,y,z,fp.wd/2,COL.steel2,20),hex(xf+fp.tw,xf+fp.fp,y,z,1.5*Dn,COL.nut),hex(xf-T-fp.tw-0.8*Dn,xf-T-fp.tw,y,z,1.5*Dn,COL.nut)); }
    else if(t==='pasador') ms.push(cyl(xf-T,xf+0.01,y,z,Dn/2,COL.rod));
    else if(t==='clavo') ms.push(cyl(xf-F.L,xf,y,z,Dn/2,COL.rod,8),cyl(xf,xf+fp.fp,y,z,F.dc/2,COL.nut,12));
    else if(t==='tornillo') ms.push(cyl(xf-F.L,xf,y,z,Dn/2,COL.rod,10),cyl(xf-0.2,xf+0.6,y,z,F.hc/2,COL.nut,14));

  lb.push({p:P.jt==='t'?tip:Wp([Pf[0]-g.u[0]*La,Pf[1]-g.u[1]*La],xm),t:`P = ${f1(P.P,1)} kN`,k:'P'});
  if(P.Nax>0){ const Lw=Math.max(80,0.3*Lv), tp=[xf+fp.fp+30+Lw,0,0]; ms.push(...M3.arrow(tp,[1,0,0],Lw,COL.red,rr).map(m=>M3.key(m,'Nax'))); lb.push({p:tp,t:`N = ${f1(P.Nax,1)} kN`,k:'Nax'}); }

function fillSizes(){ const t=$('ftype').value, s=$('fsz'), l=$('flen'); let o=[], L=[], d=0, dl=0;
  if(t==='clavo'){ o=NAILS.map((n,i)=>[i,n[0]]); d=2; }
  else if(t==='tornillo'){ o=SCR.N.map((n,i)=>[i,`N° ${n}, D ${f1(SCR.D[i],1)}`]); L=SCR.L.map((r,i)=>[i,`${r[1]}", ${f1(r[0],1)}`]); d=3; dl=6; }
  else if(t==='tirafondo'){ o=TIR.N.map((n,i)=>[i,`${n}", D ${f1(TIR.D[i],1)}`]); L=TIR.L.map((r,i)=>[i,`${r[1]}", ${f1(r[0],1)}`]); d=3; dl=5; }
  else if(t==='perno'){ o=PERN.map((p,i)=>[i,p[1]]); d=4; }
  else { o=PAS.map((v,i)=>[i,'Ø'+v]); d=3; }
  s.innerHTML=o.map(([v,tx])=>`<option value="${v}"${v===d?' selected':''}>${tx}</option>`).join('')+'<option value="u">Otra</option>';
  l.innerHTML=L.map(([v,tx])=>`<option value="${v}"${v===dl?' selected':''}>${tx}</option>`).join(''); }

  $('kp').disabled=t==='tirafondo'&&!u; if(t==='tirafondo'&&!u) $('kp').value=F.k;
  $('rth').disabled=!u; if(!u&&F.r) $('rth').value=+F.r.toFixed(1);
  $('Fff').placeholder='auto '+f1(F.FffA,0);
  [['rhoA','r0A','r0kA'],['rhoB','r0B','r0kB']].forEach(([s,a,b])=>{ const v=$(s).value, e=E1.find(q=>q[0]===v); $(a).disabled=$(b).disabled=!!e; if(e){ $(a).value=e[1]; $(b).value=e[2]; } }); }
let V3=null;
function run(){
  ui(); R=calc(inputs());
  $('warns').innerHTML=R.warn.map(w=>`<div class="warn">${w}</div>`).join('');
  sheet($('shSvg'),R);
  if(!V3){ V3=new View3D($('v3'),{yaw:-1.05,pitch:0.38}); view3dBar('v3bar',V3); } const S3=scene(R); V3.set(S3.ms,S3.lb);
  chart($('chSvg'),sweep(R));

  R.cap=capacity(R.P);

function notesHtml(){ return 'Unidades kN, mm, MPa. Tensiones admisibles según NCh1198:2024 cláusula 10. Pieza A horizontal con fibra según x, pieza B centrada en el grupo, θ es el ángulo agudo entre la carga y la fibra de cada pieza. Modos de fluencia Tabla 27 con FA de Tabla 28, aplastamiento 10.6.2.2, factores KD, KUH, KUT, Ku y Kce de 10.4 y 10.6.5. Espaciamientos Tablas 23, 24 y 26, borde cargado según 10.1.2.6. Sección neta 10.2.1 y 8.4, cizalle 10.2.2, corrimiento Tabla 40. Placa de acero con aplastamiento 2.4·fu/1.6 y tracción ASD NCh427/1. P máx. escala P y N en conjunto.'; }

  rp.sec('Verificaciones',chkTable(R.chk)); const s=rp.sec('Cálculo',kv(R.det)); s.classList.add('allow-break'); rp.foot(notesHtml()); }
fillKD('kd','normal'); [...$('kd').options].forEach(o=>{ if(o.value==='imp') o.remove(); });
rhoOpts('rhoA'); rhoOpts('rhoB'); $('rhoA').value='Pino radiata'; $('rhoB').value='Pino radiata';

  setExtra:e=>{ if(!e) return; if(e.ft&&FTN[e.ft]){ $('ftype').value=e.ft; fillSizes(); } if(e.spA&&MAT[e.spA]){ $('spA').value=e.spA; refA(false); } if(e.spB&&MAT[e.spB]){ $('spB').value=e.spB; refB(false); } }});
