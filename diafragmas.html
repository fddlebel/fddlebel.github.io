<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Diafragmas de entrepiso | fddlebel</title>
<style>
:root{
  --paper:#ffffff;--panel:#ffffff;--ink:#000000;--line:#9a9a9a;--line-strong:#7a7a7a;
  --accent:#000000;--accent-soft:#e9e9e9;--grid:#d9d9d9;--conc:#c0c0c0;--conc-dark:#a8a8a8;
  --fail:#b3261e;--focus:#4a4d24;
  --sans:'Arial Narrow',Arial,Helvetica,sans-serif;
}
*{box-sizing:border-box;}
[hidden]{display:none!important;}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);padding-block:20px 48px;padding-inline:max(16px,calc((100vw - 1400px)/2));}
h1{font-size:22px;font-weight:700;margin:0;}
.app-header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px;}
.clause{font-size:12px;}
.btn{font-family:var(--sans);font-weight:700;font-size:13px;color:#fff;background:var(--accent);border:1px solid var(--accent);border-radius:4px;padding:7px 14px;cursor:pointer;}
.btn.sec{background:var(--panel);color:var(--ink);border-color:var(--line-strong);}
.grid{display:grid;grid-template-columns:320px minmax(0,1fr);gap:16px;align-items:start;}
@media (max-width:900px){.grid{grid-template-columns:1fr;}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:14px;}
.panel+.panel{margin-top:12px;}
.section-title{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;margin:0 0 10px;}
.field{margin-bottom:9px;min-width:0;}
.field label{display:block;font-size:12px;margin-bottom:3px;}
.unit{opacity:.75;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
input[type=number],input[type=text],select,textarea{width:100%;font-family:var(--sans);font-size:13px;color:var(--ink);background:#fff;border:1px solid var(--line-strong);border-radius:4px;padding:6px 7px;font-variant-numeric:tabular-nums;}
textarea{font-size:12px;resize:vertical;}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--focus);outline-offset:1px;}
details summary{cursor:pointer;font-size:13px;font-weight:700;margin-top:4px;user-select:none;}
details[open] summary{margin-bottom:8px;}
.chk{display:flex;align-items:center;gap:6px;font-size:12px;}
.chk input{width:auto;margin:0;}
.toolbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px;}
.tool{font-family:var(--sans);font-size:12.5px;font-weight:700;background:var(--panel);color:var(--ink);border:1px solid var(--line-strong);border-radius:4px;padding:6px 10px;cursor:pointer;}
.tool.active{background:var(--accent);color:#fff;border-color:var(--accent);}
.toolbar select{width:auto;}
.toolbar .sep{width:1px;height:24px;background:var(--line);margin:0 4px;}
#gridWrap{position:relative;border:1px solid var(--line);border-radius:4px;overflow:auto;max-height:560px;background:#fff;}
#gridCanvas{display:block;cursor:crosshair;touch-action:none;}
#gridInfo{font-size:12px;margin-top:6px;min-height:16px;}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 10px;}
.tabs button{font-family:var(--sans);font-weight:700;font-size:13px;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:7px 14px;cursor:pointer;}
.tabs button.active{background:var(--accent);color:#fff;border-color:var(--accent);}
.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-bottom:12px;}
.stat{border:1px solid var(--line);border-radius:4px;padding:8px 10px;}
.stat .k{font-size:11px;text-transform:uppercase;letter-spacing:.04em;}
.stat .v{font-size:16px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums;}
table{width:100%;border-collapse:collapse;font-size:12.5px;}
th,td{text-align:left;padding:5px 8px;border:1px solid var(--line);font-variant-numeric:tabular-nums;}
th{font-size:11px;font-weight:700;background:var(--accent-soft);}
td.num,th.num{text-align:right;}
tr.fail td{color:var(--fail);font-weight:700;}
.tablewrap{overflow-x:auto;}
.chartwrap{border:1px solid var(--line);border-radius:4px;padding:10px;margin-bottom:12px;}
.ctrls{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin-bottom:10px;}
.ctrls .field{margin:0;width:150px;}
#glWrap{position:relative;border:1px solid var(--line);border-radius:4px;overflow:hidden;background:#fff;}
#glCanvas{display:block;width:100%;height:560px;cursor:grab;touch-action:none;}
#glLabels{position:absolute;inset:0;pointer-events:none;font-size:11px;}
#glLabels span{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;}
.note{font-size:11.5px;line-height:1.5;}
.warn{background:var(--accent-soft);border:1px solid var(--line-strong);border-radius:4px;padding:7px 10px;font-size:12px;margin-bottom:10px;}
#busy{font-size:12px;margin-left:8px;}
svg text{font-family:var(--sans);}
#printReport{display:none;}
.rpt-header{margin-bottom:12px;}
.rpt-header h1{font-size:20px;}
.rpt-sub{font-size:11.5px;margin-top:2px;}
.rpt-params{width:100%;border-collapse:collapse;margin-bottom:14px;font-size:11px;}
.rpt-params td{border:1px solid var(--line);padding:4px 7px;}
.rpt-params td.k{font-weight:700;width:22%;background:var(--accent-soft);}
.rpt-section{margin-bottom:16px;page-break-inside:avoid;break-inside:avoid;}
.rpt-section h2{font-size:14px;font-weight:700;margin:0 0 8px;border-bottom:1px solid var(--line);padding-bottom:4px;break-after:avoid;}
.rpt-section.allow-break{page-break-inside:auto;break-inside:auto;}
.rpt-foot{font-size:10px;margin-top:14px;border-top:1px solid var(--line);padding-top:6px;}
.rpt-small{font-size:10px;}
.rpt-small td,.rpt-small th{padding:2px 5px;}
@media print{
  body *{visibility:hidden;}
  #printReport,#printReport *{visibility:visible;}
  #printReport{display:block;position:absolute;left:0;top:0;width:100%;}
  @page{margin:12mm;}
}
@media print{.grid,.app-header{display:none!important;}}
input[type=range]{width:100%;margin:0;accent-color:#000;}
input:disabled,select:disabled{background:#f2f2f2;color:#777;}
</style>
</head>
<body>
<div class="app-header">
  <h1><a href="index.html" style="color:inherit;text-decoration:none;font-weight:400;">fddlebel</a> / Diafragmas de entrepiso</h1>
  <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
    <div class="clause" id="clause">NCh1198:2024 Anexo W, SDPWS 2015</div>
    <button class="btn sec" id="saveBtn">Guardar proyecto</button>
    <button class="btn sec" id="loadBtn">Abrir proyecto</button>
    <input type="file" id="loadFile" accept=".json" hidden>
    <button class="btn" id="pdfBtn">Exportar PDF</button>
  </div>
</div>

<div id="printReport"></div>

<div class="grid">
  <div>
    <div class="panel">
      <div class="field"><label>Proyecto / diafragma</label><input type="text" id="proj" value=""></div>

      <div class="section-title" style="margin-top:12px">Geometría y carga</div>
      <div class="row2">
        <div class="field"><label>Luz L entre muros <span class="unit">[m]</span></label><input type="number" id="dL" value="10" step="0.1" min="0.5"></div>
        <div class="field"><label>Ancho B <span class="unit">[m]</span></label><input type="number" id="dB" value="8" step="0.1" min="0.5"></div>
      </div>
      <div class="row3">
        <div class="field"><label>Carga</label><select id="lmode"><option value="w" selected>w distribuida</option><option value="F">F total</option></select></div>
        <div class="field"><label>w <span class="unit">[kN/m]</span></label><input type="number" id="qw" value="3" step="0.1"></div>
        <div class="field"><label>F <span class="unit">[kN]</span></label><input type="number" id="qF" value="30" step="1"></div>
      </div>
      <div class="row3">
        <div class="field"><label>Acción</label><select id="ltype"><option value="s" selected>Sismo</option><option value="v">Viento</option></select></div>
        <div class="field"><label>Ω sobrerresistencia</label><input type="number" id="Om" value="1.2" step="0.05"></div>
        <div class="field"><label>KD</label><select id="kd"></select></div>
      </div>

      <div class="section-title" style="margin-top:12px">Tablero y clavado</div>
      <div class="field"><label>Fila SDPWS Tabla 4.2A, grado, clavo, espesor mín.</label><select id="row"></select></div>
      <div class="row3">
        <div class="field"><label>Tablero</label><select id="ptype"><option value="osb" selected>OSB</option><option value="ply">Contrachapado</option></select></div>
        <div class="field"><label>t real <span class="unit">[mm]</span></label><input type="number" id="tp" value="15.1" step="0.1"></div>
        <div class="field"><label>Bloqueo</label><select id="blk"><option value="b" selected>Bloqueado</option><option value="u">No bloqueado</option></select></div>
      </div>
      <div class="row2">
        <div class="field"><label>Carga respecto a las vigas</label><select id="ldir"><option value="par" selected>Paralela</option><option value="perp">Perpendicular</option></select></div>
        <div class="field"><label>Lado largo del tablero</label><select id="plong"><option value="perp" selected>Perpendicular a vigas</option><option value="par">Paralelo a vigas</option></select></div>
      </div>
      <div class="row2">
        <div class="field"><label>Juntas continuas</label><select id="lay"><option value="13" selected>Perpendiculares a vigas</option><option value="24">Paralelas a vigas</option><option value="56">En ambos sentidos</option></select></div>
        <div class="field"><label>Caso SDPWS</label><input type="text" id="caseV" value="" readonly></div>
      </div>
      <div class="row3">
        <div class="field"><label>Borde, s b</label><select id="sb"></select></div>
        <div class="field"><label>Otros bordes</label><input type="text" id="seV" value="" readonly></div>
        <div class="field"><label>Campo <span class="unit">[mm]</span></label><input type="number" id="sf" value="300" step="25"></div>
      </div>
      <div class="field"><label>Clavo común</label><input type="text" id="ninf" value="" readonly></div>
      <div class="row2">
        <div class="field"><label>G gravedad específica</label><input type="number" id="Gsp" value="0.45" step="0.01"></div>
        <div class="field"><label>(FA)G</label><input type="text" id="FGV" value="" readonly></div>
      </div>
      <label class="chk"><input type="checkbox" id="wet">Vigas con H &gt; 19 % al construir, Ga × 0.5</label>
      <div class="ubx">
        <div class="note" style="margin:8px 0 6px">No bloqueado, valores de SDPWS Tabla 4.2C a ingresar.</div>
        <div class="row3">
          <div class="field"><label>vs nominal <span class="unit">[kN/m]</span></label><input type="number" id="vsU" value="8.3" step="0.1"></div>
          <div class="field"><label>vw nominal <span class="unit">[kN/m]</span></label><input type="number" id="vwU" value="11.6" step="0.1"></div>
          <div class="field"><label>Ga <span class="unit">[kN/mm]</span></label><input type="number" id="gaU" value="1.6" step="0.1"></div>
        </div>
      </div>

      <div class="section-title" style="margin-top:12px">Envigado</div>
      <div class="row3">
        <div class="field"><label>b viga <span class="unit">[mm]</span></label><input type="number" id="bj" value="41" step="1"></div>
        <div class="field"><label>h viga <span class="unit">[mm]</span></label><input type="number" id="hj" value="185" step="1"></div>
        <div class="field"><label>Separación <span class="unit">[mm]</span></label><input type="number" id="sj" value="406" step="1"></div>
      </div>
      <div class="row2">
        <div class="field"><label>Especie</label><select id="sp"></select></div>
        <div class="field"><label>Grado</label><select id="gr"></select></div>
      </div>
      <div class="row2">
        <div class="field"><label>H servicio <span class="unit">[%]</span></label><input type="number" id="Hs" value="12" step="1"></div>
        <div class="field"><label>ρ0 anhidra <span class="unit">[kg/m³]</span></label><input type="number" id="rho" value="450" step="10"></div>
      </div>

      <div class="section-title" style="margin-top:12px">Cuerdas</div>
      <div class="row3">
        <div class="field"><label>Piezas n</label><input type="number" id="nc" value="3" step="1" min="1"></div>
        <div class="field"><label>b <span class="unit">[mm]</span></label><input type="number" id="bc" value="41" step="1"></div>
        <div class="field"><label>h <span class="unit">[mm]</span></label><input type="number" id="hc" value="185" step="1"></div>
      </div>
      <div class="row2">
        <div class="field"><label>lp fuera del plano <span class="unit">[mm]</span></label><input type="number" id="lpc" value="2400" step="50"></div>
        <div class="field"><label>Largo de piezas <span class="unit">[m]</span></label><input type="number" id="lpz" value="3.2" step="0.1"></div>
      </div>
      <div class="row3">
        <div class="field"><label>Empalme</label><select id="stype"><option value="nail" selected>Clavos</option><option value="bolt">Pernos</option></select></div>
        <div class="field"><label>D <span class="unit">[mm]</span></label><input type="number" id="sD" value="3.9" step="0.1"></div>
        <div class="field snl"><label>Largo clavo <span class="unit">[mm]</span></label><input type="number" id="sLf" value="90" step="5"></div>
      </div>
      <div class="row2">
        <div class="field"><label>Medios por lado</label><input type="number" id="snf" value="16" step="1" min="1"></div>
        <div class="field"><label>Filas</label><input type="number" id="srows" value="2" step="1" min="1"></div>
      </div>

      <div class="section-title" style="margin-top:12px">Muros y conexión</div>
      <div class="row3">
        <div class="field"><label>Lw muro <span class="unit">[m]</span></label><input type="number" id="Lw" value="8" step="0.1"></div>
        <div class="field"><label>Δ muros <span class="unit">[mm]</span></label><input type="number" id="dw" value="2" step="0.5"></div>
        <div class="field"><label>h piso <span class="unit">[m]</span></label><input type="number" id="hs" value="2.47" step="0.01"></div>
      </div>
      <div class="row2">
        <div class="field"><label>Límite Δ/h</label><input type="number" id="drl" value="0.002" step="0.0005"></div>
        <div class="field"><label>Conector</label><select id="ctype"><option value="dow" selected>Tirafondo, D ≥ 6.4</option><option value="nail">Clavo o tornillo, D &lt; 6.4</option><option value="cat">Capacidad de catálogo</option></select></div>
      </div>
      <div class="row2 ccat">
        <div class="field"><label>P adm catálogo, KD 1 <span class="unit">[kN]</span></label><input type="number" id="cP" value="1.63" step="0.05"></div>
      </div>
      <div class="row3 cdw">
        <div class="field"><label>D <span class="unit">[mm]</span></label><input type="number" id="cD" value="12.7" step="0.1"></div>
        <div class="field"><label>ll solera <span class="unit">[mm]</span></label><input type="number" id="cll" value="82" step="1"></div>
        <div class="field"><label>lc penetración <span class="unit">[mm]</span></label><input type="number" id="clc" value="59.3" step="0.5"></div>
      </div>
      <div class="row2 cang">
        <div class="field"><label>Fuerza y fibra, viga</label><select id="cthc"><option value="0" selected>Paralela</option><option value="90">Normal</option></select></div>
        <div class="field"><label>Fuerza y fibra, solera</label><select id="cthl"><option value="0">Paralela</option><option value="90" selected>Normal</option></select></div>
      </div>
      <div class="row2">
        <div class="field"><label>Separación s <span class="unit">[mm]</span></label><input type="number" id="cs" value="400" step="25"></div>
      </div>
    </div>
    <div class="panel">
      <div class="note" id="notes"></div>
    </div>
  </div>
  <div>
    <div class="stat-row" id="stats"></div>
    <div id="warns"></div>
    <div class="chartwrap"><div class="toolbar" id="v3bar"></div><canvas id="v3" style="width:100%;height:460px;display:block"></canvas></div>
    <div class="chartwrap"><svg id="dfSvg" viewBox="0 0 1300 660" width="100%" style="display:block;height:auto"></svg></div>
    <div class="chartwrap">
      <div class="ctrls">
        <div class="field"><label>Gráfico</label><select id="cy"><option value="v" selected>Corte unitario</option><option value="c">Fuerza en cuerda</option></select></div>
      </div>
      <svg id="chSvg" viewBox="0 0 760 340" width="100%" style="display:block;height:auto"></svg>
    </div>
    <div class="panel"><div class="section-title">Verificaciones</div><div class="tablewrap"><table id="tbChk"></table></div></div>
    <div class="panel"><div class="section-title">Cálculo</div><div class="tablewrap"><table id="tbDet"></table></div></div>
  </div>
</div>

<script>
const svgNS='http://www.w3.org/2000/svg';
function el(tag,attrs){ const n=document.createElementNS(svgNS,tag); for(const k in attrs) n.setAttribute(k,attrs[k]); return n; }
function tx(x,y,s,o){ const t=el('text',Object.assign({x,y,'font-size':11,'text-anchor':'middle',fill:'#000'},o||{})); t.textContent=s; return t; }
function niceStep(range,count){ const raw=Math.max(range,1e-12)/count, m=Math.pow(10,Math.floor(Math.log10(raw))), f=raw/m; return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*m; }
function fmtTick(v,st){ const d=st>=1?0:Math.min(6,Math.ceil(-Math.log10(st))); return (Math.abs(v)<st*1e-6?0:v).toFixed(d); }
const fmt=(x,d)=>isFinite(x)?x.toFixed(d):'-';
const fmtk=x=>isFinite(x)?String(Math.round(x)):'-';
const FAIL='#b3261e';

function chart(svg,cfg){
  svg.innerHTML='';
  const W=760,H=cfg.H||420,L=70,R=18,T=16,B=46;
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
  const xs=[],ys=[];
  cfg.series.forEach(s=>s.pts.forEach(p=>{ if(isFinite(p[0])&&isFinite(p[1])){ xs.push(p[0]); ys.push(p[1]); } }));
  (cfg.points||[]).forEach(p=>{ xs.push(p.x); ys.push(p.y); });
  if(!xs.length){ svg.appendChild(tx(W/2,H/2,'Sin datos')); return; }
  let x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
  if(cfg.zeroX){ x0=Math.min(x0,0); x1=Math.max(x1,0); } if(cfg.zeroY){ y0=Math.min(y0,0); y1=Math.max(y1,0); }
  if(cfg.equal){ const c=(x0+x1)/2, d=(y0+y1)/2, h=Math.max(x1-x0,(y1-y0)*(W-L-R)/(H-T-B))/2; x0=c-h; x1=c+h; const hv=h*(H-T-B)/(W-L-R); y0=d-hv; y1=d+hv; }
  const px=(x1-x0)*0.06||1, py=(y1-y0)*0.08||1; x0-=px; x1+=px; y0-=py; y1+=py;
  const sx=niceStep(x1-x0,8), sy=niceStep(y1-y0,7);
  x0=Math.floor(x0/sx)*sx; x1=Math.ceil(x1/sx)*sx; y0=Math.floor(y0/sy)*sy; y1=Math.ceil(y1/sy)*sy;
  if(cfg.xfix){ x0=cfg.xfix[0]; x1=cfg.xfix[1]; } const sxx=cfg.xstep||sx;
  const X=x=>L+(x-x0)/(x1-x0)*(W-L-R), Y=y=>H-B-(y-y0)/(y1-y0)*(H-T-B);
  const g=el('g',{});
  for(let y=y0;y<=y1+sy*1e-6;y+=sy){ g.appendChild(el('line',{x1:L,x2:W-R,y1:Y(y),y2:Y(y),stroke:'#dcdcdc','stroke-width':0.6})); g.appendChild(tx(L-6,Y(y)+4,fmtTick(y,sy),{'text-anchor':'end'})); }
  for(let x=Math.ceil(x0/sxx-1e-9)*sxx;x<=x1+sxx*1e-6;x+=sxx){ g.appendChild(el('line',{x1:X(x),x2:X(x),y1:T,y2:H-B,stroke:'#dcdcdc','stroke-width':0.6})); g.appendChild(tx(X(x),H-B+15,fmtTick(x,sxx))); }
  svg.appendChild(g);
  if(x0<0&&x1>0) svg.appendChild(el('line',{x1:X(0),x2:X(0),y1:T,y2:H-B,stroke:'#555','stroke-width':0.9}));
  if(y0<0&&y1>0) svg.appendChild(el('line',{x1:L,x2:W-R,y1:Y(0),y2:Y(0),stroke:'#555','stroke-width':0.9}));
  svg.appendChild(el('rect',{x:L,y:T,width:W-L-R,height:H-T-B,fill:'none',stroke:'#7a7a7a','stroke-width':1}));
  svg.appendChild(tx((L+W-R)/2,H-8,cfg.xlabel,{'font-weight':700}));
  const yl=tx(14,(T+H-B)/2,cfg.ylabel,{'font-weight':700}); yl.setAttribute('transform',`rotate(-90 14 ${(T+H-B)/2})`); svg.appendChild(yl);
  const clipId='c'+Math.random().toString(36).slice(2);
  const cp=el('clipPath',{id:clipId}); cp.appendChild(el('rect',{x:L,y:T,width:W-L-R,height:H-T-B})); svg.appendChild(cp);
  const gc=el('g',{'clip-path':`url(#${clipId})`});
  cfg.series.forEach(s=>{
    const d=s.pts.filter(p=>isFinite(p[0])&&isFinite(p[1])).map((p,i)=>(i?'L':'M')+X(p[0]).toFixed(1)+','+Y(p[1]).toFixed(1)).join(' ')+(s.close?'Z':'');
    gc.appendChild(el('path',{d,fill:'none',stroke:s.color||'#000','stroke-width':s.w||1.4,'stroke-dasharray':s.dash||'none','stroke-linejoin':'round'}));
  });
  (cfg.points||[]).forEach(p=>{
    const col=p.fail?FAIL:'#000';

  K.title(440,H-24,'Planta','SIN ESCALA, cotas en mm');
  const x0=885, x1=1265, s2=(x1-x0)/L, X2=x=>x0+x*s2, yb=118;
  K.ln(X2(0),yb,X2(L),yb,'cut'); [0,L].forEach(x=>{ K.pl([[X2(x),yb],[X2(x)-7,yb+11],[X2(x)+7,yb+11]],'thin','#fff'); K.ln(X2(x)-10,yb+11,X2(x)+10,yb+11,'thin'); });
  K.rc(X2(0),yb-30,x1-x0,22,'thin',null,{k:'qw qF'}); for(let i=0;i<=8;i++){ const x=X2(L*i/8); K.ln(x,yb-30,x,yb-6,'thin',{k:'qw qF'}); K.ah(x,yb-1,Math.PI/2,{k:'qw qF'},7,2.2); }
  K.t((x0+x1)/2,yb-38,`w = ${f1(g.w,2)} kN/m`,{s:11,k:'qw qF'});
  K.dh(X2(0),X2(L),yb+11,yb+11,yb+32,f0(L),{k:'dL'});
  const yV=250, aV=55, Rk=g.R0/1e3;
  K.t(x0,yV-aV-22,'CORTE V [kN]',{a:'start',b:true,s:11.5}); K.t(x1,yV-aV-22,`v = ${f1(g.v,2)}, Ω·v = ${f1(g.vO,2)} kN/m`,{a:'end',s:11});
  K.pl([[X2(0),yV],[X2(0),yV-aV],[X2(L),yV+aV],[X2(L),yV]],'vis',K.H('sw'),{k:'qw qF dL'}); K.ln(x0-6,yV,x1+6,yV,'thin');
  K.t(X2(0)+4,yV-aV-5,'+'+f1(Rk,1),{a:'start',s:11,b:true}); K.t(X2(L)-4,yV+aV+14,'-'+f1(Rk,1),{a:'end',s:11,b:true});
  const yM=395, aM=75, Mk=g.Mm/1e6, pts=[[X2(0),yM]]; for(let i=0;i<=40;i++){ const x=L*i/40; pts.push([X2(x),yM+aM*4*(x/L)*(1-x/L)]); } pts.push([X2(L),yM]);
  K.t(x0,yM-18,'MOMENTO M [kNm]',{a:'start',b:true,s:11.5}); K.t(x1,yM-18,`T = C = Ω·M/B = ${f1(g.Tm/1e3,1)} kN`,{a:'end',s:11});
  K.pl(pts,'vis',K.H('sw'),{k:'qw qF dL'}); K.ln(x0-6,yM,x1+6,yM,'thin'); K.t(X2(L/2),yM+aM+15,f1(Mk,1),{s:11,b:true});
  if(g.crit){ const c=g.crit, yy=yM+aM*4*(c.x/L)*(1-c.x/L); K.ln(X2(c.x),yM,X2(c.x),yy,'hid',{k:'lpz'}); K.t(X2(c.x)+(c.x<L/2?-4:4),yM-4,`${f1(c.M/1e6,1)}`,{a:c.x<L/2?'end':'start',s:10.5,k:'lpz'}); }
  K.dh(X2(0),X2(L),yM,yM,yM+aM+40,f0(L),{k:'dL'});
  K.title((x0+x1)/2,H-24,'Viga equivalente',`R = ${f1(Rk,1)} kN, M máx = ${f1(Mk,1)} kNm`);
}
function scene(R){
  const P=R.P, g=R.geo, G=g.lay, ms=[], lb=[], L=P.L, B=P.B, tp=P.tp, hj=P.hj, hc=P.hc, bc=P.bc;
  const BX=(x0,y0,z0,x1,y1,z1,c,k,cov)=>{ const m=M3.box(Math.min(x0,x1),Math.min(y0,y1),Math.min(z0,z1),Math.max(x0,x1),Math.max(y0,y1),Math.max(z0,z1),c); m.f.forEach((q,i)=>q.eb=!cov?[true,true,true,true]:i===1?[false,false,false,false]:i===0?[true,true,true,true]:[true,true,false,true]); if(k) M3.key(m,k); return m; };
  const shown=G.panels.filter(p=>(p.x0+p.x1)/2/L+(p.y0+p.y1)/2/B<=1.25), cov=(x,y)=>shown.some(p=>x>=p.x0-1&&x<=p.x1+1&&y>=p.y0-1&&y<=p.y1+1);
  const bxs=new Set(); G.panels.forEach(p=>{ bxs.add(p.x0); bxs.add(p.x1); }); const bys=new Set(); G.panels.forEach(p=>{ bys.add(p.y0); bys.add(p.y1); });
  const FR=(x0,y0,z0,x1,y1,z1,c,k)=>{ const alongX=(x1-x0)>=(y1-y0), a0=alongX?x0:y0, a1=alongX?x1:y1, cut=[a0,...[...(alongX?bxs:bys)].filter(v=>v>a0+1&&v<a1-1).sort((p,q)=>p-q),a1];
    const segs=[]; for(let i=0;i<cut.length-1;i++){ const m=(cut[i]+cut[i+1])/2, cv=alongX?cov(m,(y0+y1)/2):cov((x0+x1)/2,m); if(segs.length&&segs[segs.length-1][2]===cv) segs[segs.length-1][1]=cut[i+1]; else segs.push([cut[i],cut[i+1],cv]); }
    segs.forEach(([a,b,cv])=>ms.push(alongX?BX(a,y0,z0,b,y1,z1,c,k,cv):BX(x0,a,z0,x1,b,z1,c,k,cv))); };
  const cuts=i=>g.spl.filter(s=>s.i===i).map(s=>s.x);
  for(let i=0;i<P.nc;i++){ const xs=[0,...cuts(i),L]; for(let k=0;k<xs.length-1;k++){ const a=xs[k]+(k?2:0), b=xs[k+1]-(k<xs.length-2?2:0);
    FR(a,i*bc,-hc,b,(i+1)*bc,0,COL.wood,'nc bc hc lpz'); FR(a,B-(i+1)*bc,-hc,b,B-i*bc,0,COL.wood,'nc bc hc lpz'); } }
  G.joists.forEach(j=>FR(j.x0,j.y0,-hj,j.x1,j.y1,0,COL.wood,'bj hj sj'));
  G.rims.forEach(j=>FR(j.x0,j.y0,-hj,j.x1,j.y1,0,COL.wood,'bj hj'));
  G.blocks.forEach(j=>ms.push(BX(j.x0,j.y0,-hj,j.x1,j.y1,0,COL.wood,'blk',cov((j.x0+j.x1)/2,(j.y0+j.y1)/2))));
  shown.forEach(p=>ms.push(BX(p.x0+3,p.y0+3,0,p.x1-3,p.y1-3,tp,COL.conc,'tp row lay plong ptype')));
  const ww=140, zw=-hc-1000, lw0=(B-Math.min(P.Lw,B))/2;
  [0,L-ww].forEach(x=>ms.push(BX(x,lw0,zw,x+ww,B-lw0,-hc,COL.steel2,'Lw dw')));
  const na=6, la=Math.min(1400,Math.max(500,B*0.16));
  for(let i=0;i<na;i++){ const tip=[L*(i+0.5)/na,B+80,tp/2]; ms.push(...M3.arrow(tip,[0,-1,0],la,COL.red,la*0.025).map(m=>M3.key(m,'qw qF lmode'))); }
  lb.push({p:[L/2,B+80+la,tp],t:`w = ${f1(g.w,2)} kN/m`,k:'qw qF'},{p:[L/2,0,-hc],t:`L = ${f1(L/1000,2)} m`,k:'dL'},{p:[0,B/2,tp],t:`B = ${f1(B/1000,2)} m`,k:'dB'},
    {p:[L*0.2,0,0],t:`Cuerda ${P.nc} × ${f1(bc,0)} × ${f1(hc,0)}`,k:'nc bc hc'},{p:[L,B/2,zw],t:'Muro de corte',k:'Lw'},
    {p:[L*0.25,B*0.4,tp],t:`${P.ptype==='osb'?'OSB':'Contrachapado'} ${f1(tp,1)} mm`,k:'tp'});
  const jv=G.joists.filter(j=>((j.x0+j.x1)/2)/L+((j.y0+j.y1)/2)/B>1.0);
  if(jv.length){ const j=jv[Math.floor(jv.length/2)]; lb.push({p:[(j.x0+j.x1)/2,G.fdir==='y'?B*0.85:(j.y0+j.y1)/2,0],t:`Vigas ${f1(P.bj,0)} × ${f1(hj,0)} @ ${f1(P.sj,0)}`,k:'bj hj sj'}); }
  return {ms,lb}; }
function sweep(R){
  const P=R.P, g=R.geo, L=P.L, mode=$('cy').value, xs=[]; for(let i=0;i<=60;i++) xs.push(L*i/60);
  const cfg={xlabel:'x [m]',H:340,xfix:[0,L/1000],zeroY:true,legendRight:true,series:[],points:[]};
  if(mode==='v'){ cfg.ylabel='Corte unitario [kN/m]';
    cfg.series.push({name:'Ω·v(x)',w:1.8,pts:xs.map(x=>[x/1000,P.Om*g.w*(L/2-x)/P.B])},{name:'± v adm',color:FAIL,dash:'5 3',w:1,pts:[[0,g.vad],[L/1000,g.vad]]},{color:FAIL,dash:'5 3',w:1,pts:[[0,-g.vad],[L/1000,-g.vad]]});
    cfg.points.push({x:0,y:g.vO,label:f1(g.vO,2)+' kN/m',fail:g.vO>g.vad}); }
  else { cfg.ylabel='Fuerza en cuerda [kN]'; const Mx=x=>g.w*x*(L-x)/2;
    cfg.series.push({name:'T = C = Ω·M(x)/B',w:1.8,pts:xs.map(x=>[x/1000,P.Om*Mx(x)/P.B/1e3])},{name:'Compresión adm.',color:FAIL,dash:'5 3',w:1,pts:[[0,g.Fcpl*g.Ac/1e3],[L/1000,g.Fcpl*g.Ac/1e3]]},{name:'Tracción adm.',color:FAIL,dash:'2 3',w:1,pts:[[0,g.Ftpd*g.Ac/1e3],[L/1000,g.Ftpd*g.Ac/1e3]]});
    g.spl.forEach(s=>cfg.points.push({x:s.x/1000,y:P.Om*Mx(s.x)/P.B/1e3,ring:true,label:s===g.crit?'Empalme':null}));
    cfg.points.push({x:L/2000,y:g.Tm/1e3,label:f1(g.Tm/1e3,1)+' kN',fail:R.chk.some(c=>c.g==='chord'&&c.r>1)}); }
  return cfg; }
let V3=null, refillGr=null;
function ui(){ const P=inputs(), T=T42A[P.row]||T42A[9], nl=NAIL[T.n], bl=P.blk==='b';
  $('qw').disabled=P.lmode!=='w'; $('qF').disabled=P.lmode!=='F';
  document.querySelectorAll('.ubx').forEach(e=>e.hidden=bl); if(!bl) $('sb').value='0'; $('sb').disabled=!bl;
  $('caseV').value=String(caseOf(P)); const se=seOf(inputs()); $('seV').value=`${se[0]} mm, ${se[1]} in`;
  $('ninf').value=`${T.n}, Ø${nl.D} × ${nl.L} mm, p mín. ${nl.p} mm`; $('FGV').value=f1(Math.min(1,1-(0.5-P.G)),3);
  const ct=P.ctype; document.querySelectorAll('.ccat').forEach(e=>e.hidden=ct!=='cat'); document.querySelectorAll('.cdw').forEach(e=>e.hidden=ct==='cat'); document.querySelectorAll('.cang').forEach(e=>e.hidden=ct!=='dow');
  document.querySelectorAll('.snl').forEach(e=>e.hidden=P.stype!=='nail'); }
function run(){
  ui(); R=calc(inputs());
  $('warns').innerHTML=R.warn.map(w=>`<div class="warn">${w}</div>`).join('');
  sheet($('dfSvg'),R);
  if(!V3){ V3=new View3D($('v3'),{yaw:-0.62,pitch:0.62}); view3dBar('v3bar',V3); } const S3=scene(R); V3.set(S3.ms,S3.lb);
  chart($('chSvg'),sweep(R));
  $('tbChk').innerHTML=chkTable(R.chk); $('tbDet').innerHTML=kv(R.det);
  const g=R.geo;
  $('stats').innerHTML=statsHtml([['Corte Ω·v',f1(g.vO,2)+' kN/m',g.vO<=g.vad],['v adm',f1(g.vad,2)+' kN/m'],['T = C',f1(g.Tm/1e3,1)+' kN'],['Deflexión',f1(g.dd,2)+' mm'],['Diafragma',g.flex?'Flexible':'No flexible',!g.flex],['Razón máx.',f1(R.mx,3),R.mx<=1],['Estado',R.mx<=1?'OK':'No cumple',R.mx<=1]]);
  $('notes').innerHTML=notesHtml();
}
function notesHtml(){ return 'Unidades kN, m, mm, MPa. Diafragma como viga simplemente apoyada entre muros de corte con carga uniforme w, V = w·L/2, M = w·L²/8, v = V/B, cuerdas T = C = Ω·M/B. Corte admisible según SDPWS 2015 Tabla 4.2A, dividido por 2.0 y por (FA)G (Manual Centro UC 2.3.2). Cuerdas según NCh1198:2024 8.3 y 8.4, empalmes y conexión a muro según 10.6.2, Tablas 27 y 28. Deflexión con SDPWS 2015 Ec. 4.2-1 en SI y corrimientos de NCh1198 Tabla 40, clasificación flexible según ASCE 7 12.3.1.3 (Manual 2.5). NCh1198 Anexo W.'; }
function report(){
  const P=R.P, g=R.geo, rp=reportStart('Diafragma de entrepiso',`${$('proj').value?$('proj').value+', ':''}NCh1198:2024 Anexo W, SDPWS 2015`,[
    ['Diafragma',`L ${f1(P.L/1000,2)} m, B ${f1(P.B/1000,2)} m, caso ${g.cas}, ${P.blk==='b'?'bloqueado':'no bloqueado'}`,'Carga',`w ${f1(g.w,2)} kN/m, Ω ${f1(P.Om,2)}, ${P.ltype==='s'?'sismo':'viento'}, KD ${f1(g.KD,2)}`],
    ['Tablero',`${P.ptype==='osb'?'OSB':'Contrachapado'} ${f1(P.tp,1)} mm, ${g.T.g}, ${g.T.n} @ ${SB[g.ci][0]} mm`,'Cuerdas',`${P.nc} × ${f1(P.bc,0)} × ${f1(P.hc,0)} ${P.sp} ${P.gr}`],
    ['Deflexión',`δ ${f1(g.dd,2)} mm, ${g.flex?'flexible':'no flexible'}`,'Resultado',`Razón máx. ${f1(R.mx,3)}, ${R.mx<=1?'OK':'No cumple'}`]]);
  rp.sec('Vista 3D',null,snap3D(V3,760,440)); const sv=rp.svg(); sv.style.maxWidth='100%'; sheet(sv,R); rp.sec('Esquema',null,sv);
  const cv=rp.svg(); cv.style.maxWidth='560px'; chart(cv,sweep(R)); rp.sec($('cy').selectedOptions[0].text,null,cv);
  rp.sec('Verificaciones',chkTable(R.chk)); const s=rp.sec('Cálculo',kv(R.det)); s.classList.add('allow-break'); rp.foot(notesHtml()); }
$('row').innerHTML=T42A.map((r,i)=>`<option value="${i}"${i===9?' selected':''}>${r.g}, ${r.n}, ${r.t} in, ${r.tm} mm</option>`).join('');
$('sb').innerHTML=SB.map((s,i)=>`<option value="${i}"${i===0?' selected':''}>${s[0]} mm, ${s[1]} in</option>`).join('');
fillKD('kd','ws');
refillGr=fillSpecies('sp','gr',null,'Pino radiata','C16');
wireApp({app:'fddlebel-diafragmas',key:'fdd_diafragmas_v1',run,report,getExtra:()=>({sp:$('sp').value,gr:$('gr').value}),setExtra:e=>{ if(e&&e.sp&&MAT[e.sp]){ $('sp').value=e.sp; refillGr(false); } }});

</script></body></html>
