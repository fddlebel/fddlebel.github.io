<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Consola de acero | fddlebel</title>
<style>
:root{
  --paper:#ffffff;--panel:#ffffff;--ink:#000000;--line:#9a9a9a;--line-strong:#7a7a7a;
  --accent:#000000;--accent-soft:#e9e9e9;--grid:#d9d9d9;--conc:#c0c0c0;--conc-dark:#a8a8a8;
  --fail:#b3261e;--focus:#4a4d24;
  --sans:'Arial Narrow',Arial,Helvetica,sans-serif;
}
*{box-sizing:border-box;}
[hidden]{display:none!important;}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);padding-block:20px 48px;padding-inline:max(16px,calc((100vw - 1400px)/2));}
h1{font-size:22px;font-weight:700;margin:0;}
.app-header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px;}
.clause{font-size:12px;}
.btn{font-family:var(--sans);font-weight:700;font-size:13px;color:#fff;background:var(--accent);border:1px solid var(--accent);border-radius:4px;padding:7px 14px;cursor:pointer;}
.btn.sec{background:var(--panel);color:var(--ink);border-color:var(--line-strong);}
.grid{display:grid;grid-template-columns:320px minmax(0,1fr);gap:16px;align-items:start;}
@media (max-width:900px){.grid{grid-template-columns:1fr;}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:14px;}
.panel+.panel{margin-top:12px;}
.section-title{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;margin:0 0 10px;}
.field{margin-bottom:9px;min-width:0;}
.field label{display:block;font-size:12px;margin-bottom:3px;}
.unit{opacity:.75;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
input[type=number],input[type=text],select,textarea{width:100%;font-family:var(--sans);font-size:13px;color:var(--ink);background:#fff;border:1px solid var(--line-strong);border-radius:4px;padding:6px 7px;font-variant-numeric:tabular-nums;}
textarea{font-size:12px;resize:vertical;}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--focus);outline-offset:1px;}
details summary{cursor:pointer;font-size:13px;font-weight:700;margin-top:4px;user-select:none;}
details[open] summary{margin-bottom:8px;}
.chk{display:flex;align-items:center;gap:6px;font-size:12px;}
.chk input{width:auto;margin:0;}
.toolbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px;}
.tool{font-family:var(--sans);font-size:12.5px;font-weight:700;background:var(--panel);color:var(--ink);border:1px solid var(--line-strong);border-radius:4px;padding:6px 10px;cursor:pointer;}
.tool.active{background:var(--accent);color:#fff;border-color:var(--accent);}
.toolbar select{width:auto;}
.toolbar .sep{width:1px;height:24px;background:var(--line);margin:0 4px;}
#gridWrap{position:relative;border:1px solid var(--line);border-radius:4px;overflow:auto;max-height:560px;background:#fff;}
#gridCanvas{display:block;cursor:crosshair;touch-action:none;}
#gridInfo{font-size:12px;margin-top:6px;min-height:16px;}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 10px;}
.tabs button{font-family:var(--sans);font-weight:700;font-size:13px;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:7px 14px;cursor:pointer;}
.tabs button.active{background:var(--accent);color:#fff;border-color:var(--accent);}
.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-bottom:12px;}
.stat{border:1px solid var(--line);border-radius:4px;padding:8px 10px;}
.stat .k{font-size:11px;text-transform:uppercase;letter-spacing:.04em;}
.stat .v{font-size:16px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums;}
table{width:100%;border-collapse:collapse;font-size:12.5px;}
th,td{text-align:left;padding:5px 8px;border:1px solid var(--line);font-variant-numeric:tabular-nums;}
th{font-size:11px;font-weight:700;background:var(--accent-soft);}
td.num,th.num{text-align:right;}
tr.fail td{color:var(--fail);font-weight:700;}
.tablewrap{overflow-x:auto;}
.chartwrap{border:1px solid var(--line);border-radius:4px;padding:10px;margin-bottom:12px;}
.ctrls{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin-bottom:10px;}
.ctrls .field{margin:0;width:150px;}
#glWrap{position:relative;border:1px solid var(--line);border-radius:4px;overflow:hidden;background:#fff;}
#glCanvas{display:block;width:100%;height:560px;cursor:grab;touch-action:none;}
#glLabels{position:absolute;inset:0;pointer-events:none;font-size:11px;}
#glLabels span{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;}
.note{font-size:11.5px;line-height:1.5;}
.warn{background:var(--accent-soft);border:1px solid var(--line-strong);border-radius:4px;padding:7px 10px;font-size:12px;margin-bottom:10px;}
#busy{font-size:12px;margin-left:8px;}
svg text{font-family:var(--sans);}
#printReport{display:none;}
.rpt-header{margin-bottom:12px;}
.rpt-header h1{font-size:20px;}
.rpt-sub{font-size:11.5px;margin-top:2px;}
.rpt-params{width:100%;border-collapse:collapse;margin-bottom:14px;font-size:11px;}
.rpt-params td{border:1px solid var(--line);padding:4px 7px;}
.rpt-params td.k{font-weight:700;width:22%;background:var(--accent-soft);}
.rpt-section{margin-bottom:16px;page-break-inside:avoid;break-inside:avoid;}
.rpt-section h2{font-size:14px;font-weight:700;margin:0 0 8px;border-bottom:1px solid var(--line);padding-bottom:4px;break-after:avoid;}
.rpt-section.allow-break{page-break-inside:auto;break-inside:auto;}
.rpt-foot{font-size:10px;margin-top:14px;border-top:1px solid var(--line);padding-top:6px;}
.rpt-small{font-size:10px;}
.rpt-small td,.rpt-small th{padding:2px 5px;}
@media print{
  body *{visibility:hidden;}
  #printReport,#printReport *{visibility:visible;}
  #printReport{display:block;position:absolute;left:0;top:0;width:100%;}
  @page{margin:12mm;}
}
</style>
</head>
<body>

<div class="app-header">
  <h1><a href="index.html" style="color:inherit;text-decoration:none;font-weight:400;">fddlebel</a> / Consola de acero</h1>
  <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
    <div class="clause">AISC 360-22 J4, J7, J10 y ACI 318-25 capítulo 17</div>
    <button class="btn sec" id="saveBtn">Guardar proyecto</button>
    <button class="btn sec" id="loadBtn">Abrir proyecto</button>
    <input type="file" id="loadFile" accept=".json" hidden>
    <button class="btn" id="pdfBtn">Exportar PDF</button>
  </div>
</div>

<div id="printReport"></div>

<div class="grid">
  <div>
    <div class="panel">
      <div class="field"><label>Proyecto / apoyo</label><input type="text" id="proj" value=""></div>
      <div class="row2">
        <div class="field"><label>Método</label><select id="meth"><option value="lrfd" selected>LRFD, φ</option><option value="asd">ASD, Ω</option></select></div>
        <div class="field"><label>Reacción R <span class="unit">[kN]</span></label><input type="number" id="Ru" value="35" step="1"></div>
      </div>

      <div class="section-title" style="margin-top:12px">Viga apoyada</div>
      <div class="field"><label>Perfil</label><select id="bcat"></select></div>
      <div class="row2"><div class="field"><label>Fy viga <span class="unit">[MPa]</span></label><input type="number" id="bFy" value="345" step="5"></div><div class="field"><label>Holgura a <span class="unit">[mm]</span></label><input type="number" id="sb" value="19" step="1"></div></div>

      <div class="section-title" style="margin-top:12px">Ángulo de asiento</div>
      <div class="row2">
        <div class="field"><label>Perfil, pierna mayor vertical</label><select id="acat"></select></div>
        <div class="field"><label>Largo Ls <span class="unit">[mm]</span></label><input type="number" id="Ls" value="150" step="10"></div>
      </div>
      <div class="row2">
        <div class="field"><label>Fy ángulo <span class="unit">[MPa]</span></label><input type="number" id="aFy" value="250" step="5"></div>
        <div class="field"><label>Orientación</label><select id="aor"><option value="lv" selected>Pierna mayor vertical</option><option value="sv">Pierna menor vertical</option></select></div>
      </div>
      <div class="row3">
        <div class="field"><label>Atiesadores</label><select id="nst"><option value="0" selected>Sin</option><option value="1">1</option><option value="2">2</option></select></div>
        <div class="field"><label>ts <span class="unit">[mm]</span></label><input type="number" id="ts" value="10" step="1"></div>
        <div class="field"><label>Destaje <span class="unit">[mm]</span></label><input type="number" id="clip" value="15" step="1"></div>
      </div>

      <div class="section-title" style="margin-top:12px">Anclajes al muro</div>
      <div class="row3">
        <div class="field"><label>Cantidad</label><input type="number" id="na" value="2" step="1"></div>
        <div class="field"><label>Diámetro <span class="unit">[in]</span></label><select id="da"><option>0.5</option><option>0.625</option><option selected>0.75</option><option>0.875</option><option>1</option><option>1.25</option></select></div>
        <div class="field"><label>Separación <span class="unit">[mm]</span></label><input type="number" id="sa" value="90" step="5"></div>
      </div>
      <div class="row3">
        <div class="field"><label>Altura fila <span class="unit">[mm]</span></label><input type="number" id="ya" value="100" step="5"></div>
        <div class="field"><label>hef</label><input type="number" id="hef" value="200" step="10"></div>
        <div class="field"><label>Cabeza</label><select id="head"><option value="hex" selected>Hexagonal</option><option value="plate">Placa</option><option value="J">Gancho J o L</option></select></div>
      </div>
      <div class="row3">
        <div class="field"><label>futa <span class="unit">[MPa]</span></label><input type="number" id="futa" value="400" step="10"></div>
        <div class="field"><label>fya</label><input type="number" id="fya" value="250" step="10"></div>
        <div class="field"><label>eh gancho</label><input type="number" id="eh" value="60" step="5"></div>
      </div>
      <div class="section-title" style="margin-top:12px">Muro de hormigón</div>
      <div class="row3">
        <div class="field"><label>f'c <span class="unit">[MPa]</span></label><input type="number" id="fc" value="25" step="1"></div>
        <div class="field"><label>Espesor ha</label><input type="number" id="ha" value="300" step="10"></div>
        <div class="field"><label>λ</label><input type="number" id="lam" value="1" step="0.05"></div>
      </div>
      <div class="row2">
        <div class="field"><label>Borde lateral <span class="unit">[mm]</span></label><input type="number" id="cx" value="1000" step="10"></div>
        <div class="field"><label>Borde inferior</label><input type="number" id="cyb" value="1000" step="10"></div>
      </div>
      <label class="chk"><input type="checkbox" id="crk" checked> Hormigón fisurado</label>
      <div class="field" id="afBox" style="margin-top:8px"><label>Factor de mayoración para anclajes con ASD</label><input type="number" id="aF" value="1.5" step="0.05"></div>
    </div>
    <div class="panel">
      <div class="section-title">Notas</div>
      <div class="note" id="notes"></div>
    </div>
  </div>

  <div style="min-width:0;">
    <div class="stat-row" id="stats"></div>
    <div id="warns"></div>
    <div class="chartwrap"><div class="toolbar" id="v3bar"></div><canvas id="v3" style="width:100%;height:460px;display:block"></canvas></div>
    <div class="chartwrap"><svg id="caSvg" viewBox="0 0 1300 640" width="100%" style="display:block;height:auto"></svg></div>
    <div class="panel"><div class="section-title">Verificaciones</div><div class="tablewrap"><table id="tbChk"></table></div></div>
    <div class="panel"><div class="section-title">Desarrollo</div><div class="tablewrap"><table id="tbDet"></table></div></div>
    <div class="panel"><div class="section-title">Anclajes, ACI 318-25 capítulo 17</div><div class="tablewrap"><table id="tbAnc"></table></div></div>
  </div>
</div>
<script>
const svgNS='http://www.w3.org/2000/svg';
function el(tag,attrs){ const n=document.createElementNS(svgNS,tag); for(const k in attrs) n.setAttribute(k,attrs[k]); return n; }
function tx(x,y,s,o){ const t=el('text',Object.assign({x,y,'font-size':11,'text-anchor':'middle',fill:'#000'},o||{})); t.textContent=s; return t; }
function niceStep(range,count){ const raw=Math.max(range,1e-12)/count, m=Math.pow(10,Math.floor(Math.log10(raw))), f=raw/m; return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*m; }
function fmtTick(v,st){ const d=st>=1?0:Math.min(6,Math.ceil(-Math.log10(st))); return (Math.abs(v)<st*1e-6?0:v).toFixed(d); }
const fmt=(x,d)=>isFinite(x)?x.toFixed(d):'-';
const fmtk=x=>isFinite(x)?String(Math.round(x)):'-';
const FAIL='#b3261e';

function chart(svg,cfg){
  svg.innerHTML='';
  const W=760,H=cfg.H||420,L=70,R=18,T=16,B=46;
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
  const xs=[],ys=[];
  cfg.series.forEach(s=>s.pts.forEach(p=>{ if(isFinite(p[0])&&isFinite(p[1])){ xs.push(p[0]); ys.push(p[1]); } }));
  (cfg.points||[]).forEach(p=>{ xs.push(p.x); ys.push(p.y); });
  if(!xs.length){ svg.appendChild(tx(W/2,H/2,'Sin datos')); return; }
  let x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
  if(cfg.zeroX){ x0=Math.min(x0,0); x1=Math.max(x1,0); } if(cfg.zeroY){ y0=Math.min(y0,0); y1=Math.max(y1,0); }
  if(cfg.equal){ const c=(x0+x1)/2, d=(y0+y1)/2, h=Math.max(x1-x0,(y1-y0)*(W-L-R)/(H-T-B))/2; x0=c-h; x1=c+h; const hv=h*(H-T-B)/(W-L-R); y0=d-hv; y1=d+hv; }
  const px=(x1-x0)*0.06||1, py=(y1-y0)*0.08||1; x0-=px; x1+=px; y0-=py; y1+=py;
  const sx=niceStep(x1-x0,8), sy=niceStep(y1-y0,7);
  x0=Math.floor(x0/sx)*sx; x1=Math.ceil(x1/sx)*sx; y0=Math.floor(y0/sy)*sy; y1=Math.ceil(y1/sy)*sy;
  if(cfg.xfix){ x0=cfg.xfix[0]; x1=cfg.xfix[1]; }
  const X=x=>L+(x-x0)/(x1-x0)*(W-L-R), Y=y=>H-B-(y-y0)/(y1-y0)*(H-T-B);
  const g=el('g',{});
  for(let y=y0;y<=y1+sy*1e-6;y+=sy){ g.appendChild(el('line',{x1:L,x2:W-R,y1:Y(y),y2:Y(y),stroke:'#dcdcdc','stroke-width':0.6})); g.appendChild(tx(L-6,Y(y)+4,fmtTick(y,sy),{'text-anchor':'end'})); }
  for(let x=x0;x<=x1+sx*1e-6;x+=sx){ g.appendChild(el('line',{x1:X(x),x2:X(x),y1:T,y2:H-B,stroke:'#dcdcdc','stroke-width':0.6})); g.appendChild(tx(X(x),H-B+15,fmtTick(x,sx))); }
  svg.appendChild(g);
  if(x0<0&&x1>0) svg.appendChild(el('line',{x1:X(0),x2:X(0),y1:T,y2:H-B,stroke:'#555','stroke-width':0.9}));
  if(y0<0&&y1>0) svg.appendChild(el('line',{x1:L,x2:W-R,y1:Y(0),y2:Y(0),stroke:'#555','stroke-width':0.9}));
  svg.appendChild(el('rect',{x:L,y:T,width:W-L-R,height:H-T-B,fill:'none',stroke:'#7a7a7a','stroke-width':1}));
  svg.appendChild(tx((L+W-R)/2,H-8,cfg.xlabel,{'font-weight':700}));
  const yl=tx(14,(T+H-B)/2,cfg.ylabel,{'font-weight':700}); yl.setAttribute('transform',`rotate(-90 14 ${(T+H-B)/2})`); svg.appendChild(yl);
  const clipId='c'+Math.random().toString(36).slice(2);
  const cp=el('clipPath',{id:clipId}); cp.appendChild(el('rect',{x:L,y:T,width:W-L-R,height:H-T-B})); svg.appendChild(cp);
  const gc=el('g',{'clip-path':`url(#${clipId})`});
  cfg.series.forEach(s=>{
    const d=s.pts.filter(p=>isFinite(p[0])&&isFinite(p[1])).map((p,i)=>(i?'L':'M')+X(p[0]).toFixed(1)+','+Y(p[1]).toFixed(1)).join(' ')+(s.close?'Z':'');
    gc.appendChild(el('path',{d,fill:'none',stroke:s.color||'#000','stroke-width':s.w||1.4,'stroke-dasharray':s.dash||'none','stroke-linejoin':'round'}));
  });
  (cfg.points||[]).forEach(p=>{
    const col=p.fail?FAIL:'#000';
    if(p.ring) gc.appendChild(el('circle',{cx:X(p.x),cy:Y(p.y),r:3.5,fill:'#fff',stroke:col,'stroke-width':1.4}));
    else gc.appendChild(el('circle',{cx:X(p.x),cy:Y(p.y),r:3.2,fill:col}));
    if(p.label) gc.appendChild(tx(X(p.x)+6,Y(p.y)-6,p.label,{'text-anchor':'start','font-size':10.5,'font-weight':700,fill:col}));
  });
  svg.appendChild(gc);
  const named=cfg.series.filter(s=>s.name);
  if(named.length){
    const lx=cfg.legendRight?W-R-220:L+12; let ly=T+16;
    svg.appendChild(el('rect',{x:lx-6,y:T+4,width:214,height:named.length*16+6,fill:'#fff',stroke:'#cfcfcf','stroke-width':0.6}));
    named.forEach(s=>{
      svg.appendChild(el('line',{x1:lx,x2:lx+28,y1:ly-4,y2:ly-4,stroke:s.color||'#000','stroke-width':s.w||1.4,'stroke-dasharray':s.dash||'none'}));
      svg.appendChild(tx(lx+36,ly,s.name,{'text-anchor':'start','font-size':11}));
      ly+=16;
    });
  }

  $('bcat').innerHTML=SHAPES.W.map(r=>`<option${r[0]==='W250X17.9'?' selected':''}>${r[0]}</option>`).join('');
  $('acat').innerHTML=SHAPES.L.map(r=>`<option${r[0]==='L152X102X12.7'?' selected':''}>${r[0]}</option>`).join('');
}

  D.push([null,'Alma de la viga en el extremo'],['d, tw, tf, k',`${f1(d,1)}, ${f1(tw,2)}, ${f1(tf,2)}, ${f1(k,1)} mm`,$('bcat').value],
    ['lb fluencia local del alma',f1(lb1,1)+' mm','Ec. J10-3, φ = 1,00'],['lb aplastamiento del alma',f1(lb2,1)+' mm','Ec. '+crip+', φ = 0,75'],['lb requerido, ≥ k',f1(lbReq,1)+' mm','J10.2, J10.3'],['lb disponible',f1(lbAv,1)+' mm','pierna horizontal − holgura']);
  o.chk.push({n:'Longitud de apoyo, J10.2 y J10.3',d:f1(lbReq,1)+' mm',c:f1(lbAv,1)+' mm',r:lbReq/lbAv});
  const lb=Math.min(Math.max(lbReq,0),lbAv);
  const ew=t+a+lb/2;
  if(nst===0){
    const e=a+lb/2-(kA-t);
    const ec=Math.max(a+lb/2+t-kA,0);
    const Mu=R*ec, Z=Ls*t*t/4, Mc=p9*Fya*Z;
    D.push([null,'Pierna horizontal sin atiesador'],['Sección crítica',`a + lb/2 − (k − t) = ${f1(ec,1)} mm desde el pie del filete`,'k del ángulo = '+f1(kA,1)+' mm'],['M requerido',f1(Mu/1e6,3)+' kN·m',''],['Mn = Fy·Ls·t²/4',f1(Fya*Z/1e6,3)+' kN·m','J4.5 fluencia en flexión']);
    o.chk.push({n:'Flexión de la pierna, J4.5',d:f1(Mu/1e6,3)+' kN·m',c:f1(Mc/1e6,3)+' kN·m',r:Mu/Mc});
    const Vc=p1*0.6*Fya*Ls*t;
    o.chk.push({n:'Fluencia en corte de la pierna, J4-3',d:f1(R/1e3,1)+' kN',c:f1(Vc/1e3,1)+' kN',r:R/Vc});
  } else {
    const bs=hh-t, Apb=nst*ts*(bs-clip), Rb=phiOm(lrfd,0.75,2.00)*1.8*Fya*Apb;
    const lam=bs/ts, lr=0.45*SQ(E/Fya);
    D.push([null,'Atiesador del asiento'],['bs, Apb',`${f1(bs,0)} mm, ${f1(Apb,0)} mm²`,'J7, Apb = n·ts·(bs − destaje)'],['bs/ts, límite',`${f1(lam,2)} / ${f1(lr,2)}`,'Tabla B4.1a caso 3']);
    o.chk.push({n:'Aplastamiento del atiesador, J7-1',d:f1(R/1e3,1)+' kN',c:f1(Rb/1e3,1)+' kN',r:R/Rb});
    o.chk.push({n:'Esbeltez del atiesador, B4.1a',d:f1(lam,2),c:f1(lr,2),r:lam/lr});
    const Lst=hv-t, rr=ts/SQ(12), KLr=0.75*Lst/rr;

  if((Math.max(1,Math.round(num('na',2)))-1)*num('sa',90)>Ls-2*(+$('da').value*25.4)) o.warn.push('Los anclajes no caben en el largo Ls del ángulo.');
  const n=Math.max(1,Math.round(num('na',2)));
  const p={inst:'cast',head:$('head').value,dain:$('da').value,fya:num('fya',250),futa:num('futa',400),hef:num('hef',200),ha:num('ha',300),duct:true,grout:false,Bp:0,Lp:0,tp:0,fyp:250,eh:num('eh',60),tcr:0,tunc:0,cat:1,cac:0,Nus:0,nx:n,sx:num('sa',90),ny:1,sy:0,cxm:num('cx',1000),cxp:num('cx',1000),cym:num('cyb',1000),cyp:1e9,Bbp:0,Lbp:0,tbp:0,gbp:0,fc:num('fc',25),lam:num('lam',1),zcm:0,crk:$('crk').checked,seis:false,condT:'B',condV:'B',psicV:1,red:n>1?'1':'0',psaT:0,psaV:0,dmode:'res',Nua,eNx:0,eNy:0,Vua,vdir:'my',eV:0,vcase:'std',arT:false,nbT:0,dbT:16,fyr:420,btype:'hook',rtop:50,Lx:50,Ly:100,arV:false,nbV:0,dbV:10,fyv:420,lug:false,lmode:'cap',bsl:0,Hsl:0,tsl:0,fysl:250,Pu:0,nbl:0,dbl:12,fyl:420};
  if(p.cym>1e8) p.cym=1e9;
  const A=ANCH.analyze(p); o.anc=A; o.warn.push(...A.warn);
  A.rows.forEach(r=>{ if(r.unit) return; o.chk.push({n:'Anclaje: '+r.name,d:f1(r.dem,1)+' kN',c:f1(r.des,1)+' kN',r:r.ratio}); });
  o.chk.push({n:'Anclaje: interacción acero, 17.8.4',d:'',c:'1.000',r:A.inter.is});
  o.chk.push({n:'Anclaje: interacción hormigón, 17.8.3',d:'',c:'1.000',r:A.inter.ic});
  Object.assign(o,{R,bw,an,lv,hv,hh,t,a,lb,lbReq,lbAv,nst,ts,z,n,ew,Ls,lrfd});
  return o;
}
function run(){
  $('afBox').hidden=$('meth').value==='lrfd'; ['ts','clip'].forEach(id=>$(id).closest('.field').style.visibility=$('nst').value==='0'?'hidden':'visible');
  R=analyze();
  $('warns').innerHTML=R.warn.map(w=>`<div class="warn">${w}</div>`).join('');
  caSheet($('caSvg'),R); if(!V3){ V3=new View3D($('v3'),{yaw:-2.3,pitch:0.45}); view3dBar('v3bar',V3); } const S3=scene3D(R); V3.set(S3.ms,S3.lb);
  $('tbChk').innerHTML=chkTable(R.chk); $('tbDet').innerHTML=kv(R.det);
  const A=R.anc; $('tbAnc').innerHTML=tbl(['Estado límite','φ','ψ','Rn [kN]','Diseño [kN]','Demanda [kN]','Razón'],A.rows.filter(r=>!r.unit).map(r=>({fail:!r.ok,c:[r.name,f1(r.phi,2),f1(r.psi,2),f1(r.Nn,1),f1(r.des,1),f1(r.dem,1),f1(r.ratio,3)]})),1);
  const mx=Math.max(...R.chk.map(c=>c.r));
  $('stats').innerHTML=statsHtml([['lb requerido',f1(R.lbReq,0)+' mm'],['Nua anclajes',f1(A.Ng,1)+' kN'],['Razón máx.',f1(mx,3),mx<=1],['Estado',mx<=1?'Cumple':'No cumple',mx<=1]]);
  $('notes').innerHTML=notesHtml();
}
function notesHtml(){ return 'Unidades N, mm, MPa. Asiento no atiesado: largo de apoyo por J10.2 y J10.3 en el extremo de la viga, pierna horizontal en flexión J4.5 con sección crítica en el pie del filete del ángulo y corte J4.2. Asiento atiesado: aplastamiento J7 y esbeltez del atiesador. Anclajes con el mismo cálculo de la herramienta de anclajes ACI 318-25, tracción por el momento R·(t + a + lb/2) sobre el brazo hasta el borde inferior del ala vertical, sin armadura suplementaria.'; }
function report(){
  const rp=reportStart('Consola de acero',`${$('proj').value?$('proj').value+', ':''}AISC 360-22 ${R.lrfd?'LRFD':'ASD'}, ACI 318-25`,[['Viga',$('bcat').value,'Ángulo',`${$('acat').value}, Ls = ${R.Ls} mm`],['Reacción',f1(R.R/1e3,1)+' kN','Anclajes',`${R.n} × ${$('da').value} in, hef ${$('hef').value} mm`]]);
  rp.sec('Vista 3D',null,snap3D(V3,760,440)); const sv=rp.svg(); sv.style.maxWidth='100%'; caSheet(sv,R); rp.sec('Detalle',null,sv); rp.sec('Verificaciones',chkTable(R.chk)); rp.sec('Desarrollo',kv(R.det)); rp.sec('Anclajes',$('tbAnc').innerHTML); rp.foot(notesHtml());
}
fillCats();
wireApp({app:'fddlebel-consolaac',key:'fdd_consolaac_v1',run,report});
function scene3D(o){
  const ms=[], lb=[], t=o.t, hv=o.hv, hh=o.hh, Ls=o.Ls, bw=o.bw, d=bw.d, bf=bw.bf, tf=bw.tf, tw=bw.tw, kA=o.an.k;

  const prof=[[0,0],[t,0],[t,hv-t-r]]; for(let i=1;i<6;i++){ const a=Math.PI/2*i/6; prof.push([t+r-r*Math.cos(a),hv-t-r+r*Math.sin(a)]); } prof.push([t+r,hv-t],[hh,hv-t],[hh,hv],[0,hv]);

  const db=+$('da').value*25.4, n=o.n, sa=num('sa',90), za=o.z, head=$('head').value;

  if(o.nst>0) lb.push({p:[t+(hh-t)/3,o.nst===1?o.ts/2:Ls/2-10,hv/2],t:`Atiesador ts ${o.ts}`});
  return {ms,lb};
}
